<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Drapeau RDC</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #eaeaea;
    }
    .drapeau {
      position: relative;
      width: 600px;
      height: 400px;
      background: #007fff; /* Bleu vif */
      overflow: hidden; /* Supprime débordements */
    }
    /* Bande diagonale rouge avec bordures jaunes */
    .bande {
      position: absolute;
      width: 900px;
      height: 90px;
      background: #ff0000;
      top: 155px;
      left: -150px;
      transform: rotate(-30deg);
      border-top: 20px solid #ffd700;
      border-bottom: 20px solid #ffd700;
    }
    /* Étoile jaune */
    .etoile {
      position: absolute;
      top: 40px;
      left: 40px;
      font-size: 120px;
      color: #ffd700;
    }
  </style>
</head>
<body>
  <div class="drapeau">
    <div class="bande"></div>
    <div class="etoile">★</div>
  </div>
</body>
</html>
