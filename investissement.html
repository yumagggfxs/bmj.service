<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMJ SERVICE - Déploiement en cours</title>
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .logo-area img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .logo-area h2 {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .logo-area h2 span {
            color: #3b82f6;
        }

        .icon-container {
            font-size: 64px;
            color: #3b82f6;
            margin-bottom: 25px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        h1 {
            font-size: 26px;
            margin-bottom: 15px;
            color: #ffffff;
        }

        p {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .badge-time {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 30px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .footer-note {
            font-size: 14px;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- En-tête avec Logo -->
        <div class="logo-area">
            <img src="images/logo.png" alt="BMJ SERVICE">
            <h2>BMJ <span>SERVICE</span></h2>
        </div>

        <!-- Icône animée -->
        <div class="icon-container">
            <i class="fa-solid fa-gears fa-spin"></i>
        </div>

        <!-- Messages -->
        <h1>Travail en cours de déploiement</h1>
        
        <p>
            Nous mettons à jour votre plateforme pour vous offrir une expérience encore plus performante. 
            L'équipe technique s'en charge activement.
        </p>

        <div class="badge-time">
            <i class="fa-solid fa-clock"></i>
            Veuillez patienter au moins 24h
        </div>

        <!-- Note de bas -->
        <div class="footer-note">
            Merci pour votre patience. L'équipe BMJ.
        </div>
    </div>

</body>
</html>
