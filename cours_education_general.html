        // BASE DE DONNÉES DES COURS EXTRÊMEMENT DÉVELOPPÉE, RICHE ET ILLUSTRÉE
        const donneesCours = {
            1: {
                titreBadge: "Module Magistral 01",
                titre: "Techniques Avancées de Mémorisation & Architecture de l'Apprentissage Actif",
                corps: `
                    <p>Bienvenue dans ce cours magistral et exhaustif consacré à l'ingénierie cognitive et aux méthodes d'optimisation de la mémoire. Dans un monde saturé d'informations, la réussite académique et professionnelle ne dépend plus de la simple accumulation passive de données, mais de la maîtrise rigoureuse des mécanismes psychologiques qui régissent l'encodage, la consolidation et la restitution des connaissances à long terme.</p>
                    
                    <div class="image-container">
                        <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=80" alt="Illustration apprentissage et neurosciences">
                        <div class="image-caption"><i class="fa-solid fa-image"></i> Schématisation des connexions synaptiques lors d'un apprentissage actif et structuré.</div>
                    </div>

                    <h2><i class="fa-solid fa-brain" style="color: #145A86;"></i> 1. Comprendre la Neurobiologie de l'Apprentissage</h2>
                    <p>Le cerveau humain n'est pas un disque dur passif : c'est un réseau neuronal plastique en perpétuelle reconfiguration. Lorsque nous découvrons une notion inédite, des synapses se créent, mais sans stimuli répétés, l'élagage synaptique s'enclenche, provoquant l'oubli. Hermann Ebbinghaus a mis en évidence dès 1885 la célèbre <strong>courbe de l'oubli</strong>, démontrant que sans intervention, plus de 70 % d'une information nouvelle est perdue en moins de 48 heures.</p>
                    <p>Pour déjouer cette fatalité biologique, la stratégie la plus redoutable consiste à structurer l'apprentissage autour de piliers scientifiques incontournables : l'attention sélective, la rétroaction corrective immédiate et, par-dessus tout, la répartition temporelle intelligente des révisions.</p>
                    <p>En outre, l'état émotionnel joue un rôle de catalyseur chimique. La sécrétion de dopamine lors de la résolution d'un problème complexe renforce l'ancrage mnésique, transformant une contrainte d'étude en une réelle dynamique de progression gratifiante.</p>

                    <div class="callout-box gold">
                        <h4><i class="fa-solid fa-medal"></i> Le Secret des Apprenants d'Excellence</h4>
                        <p>Ne lisez jamais un cours d'une seule traite en espérant qu'il s'imprime magiquement. Pratiquez l'auto-évaluation active (le "testing effect") : fermez votre manuel après une section et forcez votre esprit à restituer les idées maîtresses de mémoire.</p>
                    </div>

                    <h2><i class="fa-solid fa-calendar-days" style="color: #145A86;"></i> 2. La Méthode de la Répétition Espacée (Spaced Repetition)</h2>
                    <p>La répétition espacée consiste à espacer les sessions de révision selon un calendrier mathématique précis. Plutôt que de passer 5 heures d'affilée la veille d'un examen, il est infiniment plus efficace de répartir ce temps sur plusieurs semaines pour tromper la courbe naturelle de l'oubli.</p>
                    
                    <div class="image-container">
                        <img src="https://images.unsplash.com/photo-1434030216411-0b793f4b4173?auto=format&fit=crop&w=1200&q=80" alt="Planification et organisation des révisions">

                                    <th>Moment Idéal</th>

                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><strong>1ère révision</strong></td>
                                    <td>24 heures après le premier apprentissage</td>
                                    <td>Contrer la chute rapide de la courbe de l'oubli initiale.</td>
                                </tr>
                                <tr>
                                    <td><strong>2ème révision</strong></td>
                                    <td>3 à 5 jours plus tard</td>
                                    <td>Transférer l'information de l'hippocampe vers le cortex.</td>
                                </tr>
                                <tr>
                                    <td><strong>3ème révision</strong></td>
                                    <td>2 semaines plus tard</td>
                                    <td>Ancrer durablement la notion dans la mémoire à long terme.</td>
                                </tr>
                                <tr>
                                    <td><strong>4ème révision</strong></td>
                                    <td>1 mois à 2 mois plus tard</td>
                                    <td>Automatiser la restitution sans effort conscient.</td>
                                </tr>
                            </tbody>

                    </div>

                    <h2><i class="fa-solid fa-chalkboard-user" style="color: #145A86;"></i> 3. La Technique de Feynman et la Restitution Simple</h2>
                    <p>Richard Feynman, physicien nobélisé, a développé une méthode d'apprentissage universelle basée sur un principe implacable : <em>« Si vous ne pouvez pas expliquer un concept simplement, c'est que vous ne le comprenez pas assez bien. »</em></p>
                    <p>La mise en application de cette méthode s'articule en quatre étapes strictes :</p>
                    <ol>
                        <li><strong>Sélectionner un concept complexe :</strong> Isoler précisément la notion que l'on souhaite maîtriser sans tricher.</li>
                        <li><strong>L'enseigner à un néophyte fictif :</strong> Rédiger ou formuler l'explication en bannissant tout jargon technique abstrait, en privilégiant des métaphores tirées du quotidien.</li>
                        <li><strong>Identifier les failles de raisonnement :</strong> Observer les moments d'hésitation ou de confusion dans son propre discours. Ce sont précisément ces zones d'ombre qu'il faut retourner approfondir dans les sources bibliographiques.</li>
                        <li><strong>Simplifier et affiner :</strong> Épurer le vocabulaire pour obtenir une clarté absolue, élégante et percutante.</li>
                    </ol>

                    <h2><i class="fa-solid fa-puzzle-piece" style="color: #145A86;"></i> 1. L'Art de la Décomposition Systémique (Divide et Impera)</h2>
                    <p>Face à un problème d'apparence insurmontable, la réaction psychologique spontanée est souvent la sidération ou l'abandon prématuré. L'ingénieur en logique applique le principe fondamental du <strong>Diviser pour régner</strong>. Un problème complexe n'est jamais qu'une agglomération de sous-problèmes élémentaires interconnectés.</p>
                    <p>L'exercice consiste à lister chaque composante de l'énoncé, à isoler les données connues des variables inconnues, et à cartographier les dépendances logiques unissant les différentes étapes de la démonstration.</p>

                    <div class="callout-box gold">
                        <h4><i class="fa-solid fa-shield-halved"></i> La Rigueur de l'Hypothèse</h4>
                        <p>En logique formelle, une affirmation non démontrée reste une simple supposition. Apprenez à valider chaque étape intermédiaire avant d'autoriser votre raisonnement à passer à la suivante.</p>
                    </div>

                    <h2><i class="fa-solid fa-scale-balanced" style="color: #145A86;"></i> 2. Deduction vs Induction : Les Deux Piliers du Raisonnement</h2>
                    <p>La construction intellectuelle s'appuie principalement sur deux grands mouvements de pensée complémentaires :</p>
                    <ul>
                        <li><strong>Le Raisonnement Déductif :</strong> Part de prémisses générales universellement admises pour aboutir à une conclusion logique et irréfutable dans un cas particulier. <em>Exemple classique : Tous les hommes sont mortels (Règle) ; Socrate est un homme (Cas) ; Donc Socrate est mortel (Conclusion certaine).</em></li>
                        <li><strong>Le Raisonnement Inductif :</strong> Observe des occurrences particulières et récurrentes pour en extraire une loi générale ou une tendance statistique prédictive. C'est la base absolue de la démarche scientifique expérimentale.</li>
                    </ul>

                    <p>Pour modéliser des situations complexes, l'utilisation d'arbres de décision et d'opérateurs logiques (ET, OU, NON, IMPLIQUE) permet d'éliminer les biais cognitifs. En schématisant les flux d'hypothèses sous forme de diagrammes de flux, l'esprit humain gagne une visibilité instantanée sur les embranchements critiques d'un problème.</p>
                `

                corps: `
                    <p>L'écrit est le reflet direct de la clarté de la pensée. Qu'il s'agisse de rédiger un mémoire de fin d'études, un rapport stratégique d'entreprise ou une dissertation argumentée, la maîtrise de la syntaxe, du vocabulaire et de la structure textuelle est l'instrument le plus puissant d'influence et de persuasion.</p>

                    <h2><i class="fa-solid fa-feather" style="color: #145A86;"></i> 1. L'Architecture Tripartite : Introduction, Développement, Conclusion</h2>
                    <p>Toute production textuelle d'excellence obéit à une architecture canonique rigoureuse qui guide le lecteur sans jamais le perdre :</p>
                    <ul>
                        <li><strong>L'Introduction (Le Portique) :</strong> Elle s'ouvre par une accroche contextuelle, amène la problématique fondamentale du sujet, et s'achève par l'annonce explicite du plan du développement.</li>
                        <li><strong>Le Développement (Le Corps) :</strong> Divisé en parties équilibrées. Chaque paragraphe commence par une idée directrice claire, s'appuie sur une démonstration logique, et s'illustre par un exemple factuel précis.</li>
