<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messagerie | BMJ SERVICE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .topbar {
            height: 70px;
            background: #145a86;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 28px;

            box-shadow: 0 3px 15px rgba(0, 0, 0, .08);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255, 255, 255, .15);
        }

        .back-btn {
            border: none;
            background: rgba(255, 255, 255, .12);
            color: white;

            padding: 10px 15px;
            border-radius: 10px;

            display: flex;
            align-items: center;
            gap: 8px;

            transition: .2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, .22);
        }

        /* =====================================================
           PAGE
        ===================================================== */

        .page {
            width: min(1200px, calc(100% - 30px));
            margin: 30px auto;
        }

        .page-header {
            margin-bottom: 22px;
        }

        .page-header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .page-header p {
            color: #697586;
            font-size: 14px;
        }

        /* =====================================================
           LAYOUT
        ===================================================== */

        .messaging-layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;

            min-height: 650px;
        }

        .card {
            background: white;
            border-radius: 18px;

            box-shadow: 0 8px 30px rgba(20, 40, 70, .07);

            overflow: hidden;
        }

        /* =====================================================
           LISTE
        ===================================================== */

        .messages-header {
            padding: 20px;

            border-bottom: 1px solid #edf0f5;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .messages-header h2 {
            font-size: 17px;
        }

        .message-count {
            min-width: 26px;
            height: 26px;

            padding: 0 8px;

            border-radius: 20px;

            background: #145a86;
            color: white;

            font-size: 12px;
            font-weight: 700;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message-list {
            max-height: 590px;
            overflow-y: auto;
        }

        .message-item {
            padding: 17px 18px;

            border-bottom: 1px solid #edf0f5;

            cursor: pointer;

            transition: .2s;

            position: relative;
        }

        .message-item:hover {
            background: #f8fbff;
        }

        .message-item.active {
            background: #eef7ff;
            border-left: 4px solid #145a86;
        }

        .message-item.unread {
            background: #f7fbff;
        }

        .message-item.unread::after {
            content: "";

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #145a86;

            position: absolute;
            top: 20px;
            right: 18px;
        }

        .message-item-top {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 7px;
        }

        .message-icon {
            width: 36px;
            height: 36px;

            flex-shrink: 0;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #edf5fb;
            color: #145a86;
        }

        .message-item.unread .message-icon {
            background: #145a86;
            color: white;
        }

        .message-item-title {
            flex: 1;

            font-size: 13px;
            font-weight: 700;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message-date {
            color: #8993a4;
            font-size: 10px;
        }

        .message-preview {
            color: #697586;

            font-size: 12px;
            line-height: 1.5;

            margin-left: 46px;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;
        }

        .official-label {
            display: inline-flex;
            align-items: center;
            gap: 5px;

            margin-top: 8px;
            margin-left: 46px;

            padding: 4px 8px;

            border-radius: 6px;

            background: #fff5df;
            color: #a56b00;

            font-size: 9px;
            font-weight: 700;
        }

        .individual-label {
            display: inline-flex;
            align-items: center;
            gap: 5px;

            margin-top: 8px;
            margin-left: 46px;

            padding: 4px 8px;

            border-radius: 6px;

            background: #eaf7ef;
            color: #19713d;

            font-size: 9px;
            font-weight: 700;
        }

        /* =====================================================
           DETAIL
        ===================================================== */

        .message-detail {
            display: flex;
            flex-direction: column;

            min-width: 0;
        }

        .empty-state {
            flex: 1;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 40px;
        }

        .empty-icon {
            width: 85px;
            height: 85px;

            border-radius: 50%;

            background: #edf5fb;
            color: #145a86;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;

            margin-bottom: 18px;
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: #7b8797;
            font-size: 13px;
            max-width: 400px;
        }

        .detail-header {
            padding: 24px;

            border-bottom: 1px solid #edf0f5;
        }

        .detail-type {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 6px 10px;

            border-radius: 8px;

            font-size: 10px;
            font-weight: 700;

            margin-bottom: 13px;
        }

        .detail-type.official {
            background: #fff5df;
            color: #a56b00;
        }

        .detail-type.individual {
            background: #eaf7ef;
            color: #19713d;
        }

        .detail-header h2 {
            font-size: 21px;
            line-height: 1.35;

            margin-bottom: 10px;
        }

        .detail-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;

            color: #8993a4;

            font-size: 11px;
        }

        .detail-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .priority {
            padding: 4px 8px;
            border-radius: 6px;

            font-size: 9px;
            font-weight: 700;
        }

        .priority.normal {
            background: #edf1f5;
            color: #657182;
        }

        .priority.important {
            background: #fff4d7;
            color: #9a6800;
        }

        .priority.urgent {
            background: #ffe5e5;
            color: #c53030;
        }

        /* =====================================================
           CONTENU
        ===================================================== */

        .detail-body {
            flex: 1;

            padding: 28px;

            overflow-y: auto;

            background: #fbfcfe;
        }

        .message-content {
            background: white;

            border: 1px solid #edf0f5;

            border-radius: 14px;

            padding: 22px;

            font-size: 14px;
            line-height: 1.8;

            color: #374151;

            white-space: pre-wrap;

            word-break: break-word;
        }

        /* =====================================================
           REPONSE
        ===================================================== */

        .reply-box {
            padding: 18px 22px;

            background: white;

            border-top: 1px solid #edf0f5;
        }

        .reply-info {
            display: flex;
            align-items: center;
            gap: 8px;

            color: #697586;

            font-size: 11px;

            margin-bottom: 10px;
        }

        .reply-form {
            display: flex;
            gap: 10px;
        }

        .reply-form textarea {
            flex: 1;

            min-height: 48px;
            max-height: 130px;

            resize: vertical;

            border: 1px solid #dce2ea;
            border-radius: 11px;

            padding: 13px 15px;

            outline: none;

            font-size: 12px;

            transition: .2s;
        }

        .reply-form textarea:focus {
            border-color: #145a86;
            box-shadow: 0 0 0 3px rgba(20, 90, 134, .08);
        }

        .reply-btn {
            width: 50px;
            height: 48px;

            flex-shrink: 0;

            border: none;
            border-radius: 11px;

            background: #145a86;
            color: white;

            font-size: 17px;

            transition: .2s;
        }

        .reply-btn:hover {
            background: #0f4c73;
            transform: translateY(-1px);
        }

        .reply-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        /* =====================================================
           OFFICIAL NO REPLY
        ===================================================== */

        .no-reply {
            padding: 15px 22px;

            background: #fafbfc;

            border-top: 1px solid #edf0f5;

            color: #7b8797;

            font-size: 11px;

            display: flex;
            align-items: center;
            gap: 9px;
        }

        .no-reply i {
            color: #a56b00;
        }

        /* =====================================================
           LOADING
        ===================================================== */

        .loading {
            min-height: 250px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            color: #7b8797;

            font-size: 13px;
        }

        .spinner {
            width: 22px;
            height: 22px;

            border: 3px solid #e4e9ef;
            border-top-color: #145a86;

            border-radius: 50%;

            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =====================================================
           TOAST
        ===================================================== */

        .toast-container {
            position: fixed;

            right: 20px;
            bottom: 20px;

            z-index: 9999;

            display: flex;
            flex-direction: column;

            gap: 10px;
        }

        .toast {
            min-width: 280px;

            background: #172033;
            color: white;

            padding: 14px 17px;

            border-radius: 11px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, .18);

            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 12px;

            animation: toastIn .25s ease;
        }

        .toast.success i {
            color: #52d98b;
        }

        .toast.error i {
            color: #ff7777;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 850px) {

            .topbar {
                padding: 0 15px;
            }

            .brand {
                font-size: 16px;
            }

            .messaging-layout {
                grid-template-columns: 1fr;
            }

            .message-list {
                max-height: 400px;
            }

            .message-detail {
                min-height: 550px;
            }

            .page {
                width: calc(100% - 20px);
                margin: 20px auto;
            }

            .page-header h1 {
                font-size: 23px;
            }

            .detail-header {
                padding: 20px;
            }

            .detail-body {
                padding: 18px;
            }

            .reply-box {
                padding: 15px;
            }

            .back-btn span {
                display: none;
            }
        }
        /* ============================================================
   CHARGEMENT MESSAGES
============================================================ */

.message-loading {

    min-height: 220px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 10px;

    color: #64748b;

    text-align: center;

}


.message-loading strong {

    color: #145a86;

}

    box-shadow:
        0 8px 25px rgba(

        );

}


/* ============================================================
   ERREUR
============================================================ */

.message-error {

    min-height: 250px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

}


.message-error .error-icon {

    width: 65px;

    height: 65px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background: #fff1f2;

    color: #e11d48;

    font-size: 28px;

    margin-bottom: 15px;

}


.message-error h3 {

    margin: 0 0 8px;

    color: #1e293b;

}


.message-error p {

    max-width: 450px;

    margin: 0 0 20px;

    color: #64748b;

    line-height: 1.6;

}


.retry-btn {

    border: none;

    padding: 12px 20px;

    border-radius: 10px;

    background: #145a86;

    color: white;

    cursor: pointer;

.retry-btn:hover {

/* ============================================================

============================================================ */

.messages-starting {

    min-height: 220px;

.messages-starting h3 {

    </style>
</head>

<body>

<header class="topbar">

    <div class="brand">
        <div class="brand-icon">
            <i class="fa-solid fa-envelope"></i>
        </div>

        <span>BMJ SERVICE</span>
    </div>

    <button class="back-btn" id="backButton">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Retour</span>
    </button>

</header>


<main class="page">

    <div class="page-header">
        <h1>Ma messagerie</h1>

        <p>
            Retrouvez ici les annonces de BMJ SERVICE et les messages qui vous sont personnellement destinés.
        </p>
    </div>


    <div class="messaging-layout">

        <!-- =================================================
             LISTE DES MESSAGES
        ================================================== -->

        <div class="card">

            <div class="messages-header">

                <h2>Messages</h2>

                <div class="message-count" id="messageCount">
                    0
                </div>

            </div>

            <div class="message-list" id="messageList">

                <div class="loading">
                    <div class="spinner"></div>
                    Chargement...
                </div>

            </div>

        </div>


        <!-- =================================================
             DETAIL
        ================================================== -->

        <div class="card message-detail" id="messageDetail">

            <div class="empty-state">

                <div class="empty-icon">
                    <i class="fa-regular fa-envelope-open"></i>
                </div>

                <h3>Sélectionnez un message</h3>

                <p>
                    Choisissez un message dans votre boîte de réception
                    pour afficher son contenu.
                </p>

            </div>

        </div>

    </div>

</main>


<div class="toast-container" id="toastContainer"></div>

<script>

document.addEventListener("DOMContentLoaded", function () {

    /* ============================================================
       BMJ SERVICE
       MESSAGERIE UTILISATEUR
       
       Compatible avec le serveur :
       
       GET   /api/utilisateurs/:id/messages
       PATCH /api/utilisateurs/:id/messages/:messageId/read
       POST  /api/utilisateurs/:id/messages/:messageId/repondre

       Optimisations :
       - affichage instantané du cache
       - cache propre à chaque utilisateur
       - aucune double synchronisation
       - synchronisation silencieuse
       - gestion du réveil Render
       - pas de loader interminable
    ============================================================ */


    /* ============================================================
       CONFIGURATION
    ============================================================ */

    const API_URL =
        "https://back-end-h602.onrender.com";


    /*
     * Timeout normal.
     *
     * Render peut parfois prendre quelques secondes
     * lorsqu'il réveille le serveur.
     */
    const API_TIMEOUT =
        9000;


    /*
     * Deuxième tentative si le serveur était endormi.
     */
    const RETRY_DELAY =
        1200;


    /*
     * Synchronisation automatique.
     */
    const REFRESH_INTERVAL =
        30000;


    /*
     * Durée maximale du cache.
     *
     * Le cache reste affichable même s'il est ancien.
     * Il sera simplement synchronisé avec le serveur.
     */
    const CACHE_DURATION =
        1000 * 60 * 60 * 24;


    let currentUser = null;

    let currentMessages = [];

    let currentMessage = null;

    let refreshTimer = null;

    let syncInProgress = false;

    let lastSyncTime = 0;


    /* ============================================================
       ELEMENTS
    ============================================================ */

    const messagesContainer =
        document.getElementById(
            "messagesContainer"
        );

    const messageDetail =
        document.getElementById(
            "messageDetail"
        );

    const toastContainer =
        document.getElementById(
            "toastContainer"
        );


    /* ============================================================
       UTILISATEUR
    ============================================================ */

    function getCurrentUser() {

        const keys = [
            "bmj_current_user",
            "currentUser",
            "bmj_user",
            "user"
        ];


        for (const key of keys) {

            const raw =
                localStorage.getItem(key);


            if (!raw) {
                continue;
            }


            try {

                const user =
                    JSON.parse(raw);


                if (
                    user &&
                    (
                        user.id ||
                        user.user_id
                    )
                ) {

                    return user;

                }

            } catch (error) {

                console.warn(
                    "Utilisateur local invalide :",
                    error
                );

            }

        }


        return null;
    }


    function getCurrentUserId() {

        if (!currentUser) {
            return null;
        }


        const id =
            Number(
                currentUser.id ||
                currentUser.user_id
            );


        if (
            !Number.isInteger(id) ||
            id <= 0
        ) {

            return null;

        }


        return id;
    }


    /* ============================================================
       CACHE PAR UTILISATEUR
       
       IMPORTANT :
       chaque utilisateur possède maintenant son propre cache.
    ============================================================ */

    function getCacheKey() {

        const userId =
            getCurrentUserId();


        if (!userId) {
            return null;
        }


        return (
            "bmj_messages_cache_" +
            userId
        );
    }


    function getCacheTimeKey() {

        const userId =
            getCurrentUserId();


        if (!userId) {
            return null;
        }


        return (
            "bmj_messages_cache_time_" +
            userId
        );
    }


    function getCachedMessages() {

        const cacheKey =
            getCacheKey();


        if (!cacheKey) {
            return [];
        }


        try {

            const raw =
                localStorage.getItem(
                    cacheKey
                );


            if (!raw) {
                return [];
            }


            const messages =
                JSON.parse(raw);


            if (
                !Array.isArray(messages)
            ) {

                return [];

            }


            return messages;

        } catch (error) {

            console.warn(
                "Erreur lecture cache messages :",
                error
            );


            return [];

        }

    }


    function getCacheAge() {

        const timeKey =
            getCacheTimeKey();


        if (!timeKey) {
            return Infinity;
        }


        const value =
            Number(
                localStorage.getItem(
                    timeKey
                ) || 0
            );


        if (!value) {
            return Infinity;
        }


        return (
            Date.now() -
            value
        );

    }


    function saveMessagesToCache(
        messages
    ) {

        const cacheKey =
            getCacheKey();

        const timeKey =
            getCacheTimeKey();


        if (
            !cacheKey ||
            !timeKey
        ) {

            return;

        }


        try {

            localStorage.setItem(
                cacheKey,
                JSON.stringify(
                    Array.isArray(messages)
                        ? messages
                        : []
                )
            );


            localStorage.setItem(
                timeKey,
                String(
                    Date.now()
                )
            );

        } catch (error) {

            console.warn(
                "Impossible de sauvegarder le cache :",
                error
            );

        }

    }


    /* ============================================================
       SECURITE HTML
    ============================================================ */

    function escapeHTML(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* ============================================================
       DATES
    ============================================================ */

    function formatDate(value) {

        if (!value) {
            return "";
        }


        const date =
            new Date(value);


        if (
            isNaN(
                date.getTime()
            )
        ) {

            return "";

        }


        return date.toLocaleDateString(
            "fr-FR",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }
        );

    }


    function formatDateTime(value) {

        if (!value) {
            return "";
        }


        const date =
            new Date(value);


        if (
            isNaN(
                date.getTime()
            )
        ) {

            return "";

        }


        return date.toLocaleDateString(
            "fr-FR",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }


    /* ============================================================
       TYPES DE MESSAGES
    ============================================================ */

    function isOfficial(message) {

        return (
            message &&
            String(
                message.type || ""
            ).toLowerCase() ===
            "official"
        );

    }


    function isUserReply(message) {

        return (
            message &&
            String(
                message.type || ""
            ).toLowerCase() ===
            "user_reply"
        );

    }


    function isIndividual(message) {

        return (
            message &&
            String(
                message.type || ""
            ).toLowerCase() ===
            "user"
        );

    }


    /* ============================================================
       PEUT REPONDRE ?
    ============================================================ */

    function canReplyToMessage(message) {

        if (!message) {
            return false;
        }


        /*
         * Les annonces officielles
         * ne peuvent jamais recevoir de réponse.
         */

        if (
            isOfficial(message)
        ) {

            return false;

        }


        /*
         * Une réponse de l'utilisateur
         * ne reçoit pas une deuxième réponse.
         */

        if (
            isUserReply(message)
        ) {

            return false;

        }


        /*
         * Seuls les messages individuels
         * peuvent recevoir une réponse.
         */

        if (
            !isIndividual(message)
        ) {

            return false;

        }


        /*
         * Le message doit provenir de l'administration.
         */

        if (
            message.sender_type &&
            String(
                message.sender_type
            ).toLowerCase() !==
            "admin"
        ) {

            return false;

        }


        const userId =
            getCurrentUserId();


        if (!userId) {
            return false;
        }


        /*
         * Le destinataire doit être
         * l'utilisateur actuellement connecté.
         */

        return (
            Number(
                message.recipient_user_id
            ) ===
            Number(userId)
        );

    }


    /* ============================================================
       TOAST
    ============================================================ */

    function showToast(

    ) {

        if (!toastContainer) {

            );

        }


        if (

        ) {

        }


        if (

        ) {

        }


        toast.innerHTML = `

        );

    /* ============================================================
       API RAPIDE ET STABLE
    ============================================================ */

    async function apiRequest(
        endpoint,
        options = {},
        timeoutMs = API_TIMEOUT
    ) {

        const controller =
            new AbortController();


        const timeout =
            setTimeout(
                function () {

                    controller.abort();

                },
                timeoutMs
            );


        try {

            const headers = {

                "Accept":
                    "application/json"

            };


            if (
                options.body
            ) {

                headers[
                    "Content-Type"
                ] =
                    "application/json";

            }


            const response =
                await fetch(
                    `${API_URL}${endpoint}`,
                    {
                        ...options,

                        headers: {
                            ...headers,
                            ...(options.headers || {})
                        },

                        cache:
                            "no-store",

                        signal:
                            controller.signal
                    }
                );


            const text =
                await response.text();


            let data =
                null;


            if (text) {

                try {

                    data =
                        JSON.parse(
                            text
                        );

                } catch (error) {

                    throw new Error(
                        "Réponse serveur invalide."
                    );

                }

            }


            if (
                !response.ok
            ) {

                throw new Error(
                    data?.message ||
                    data?.error ||
                    `Erreur HTTP ${response.status}`
                );

            }


            return data;


        } catch (error) {

            if (
                error?.name ===
                "AbortError"
            ) {

                throw new Error(
                    "Le serveur met trop de temps à répondre."
                );

            }


            throw error;

        } finally {

            clearTimeout(
                timeout
            );

        }

    }


    /* ============================================================
       AFFICHAGE IMMÉDIAT DU CACHE
    ============================================================ */

    function showInstantMessages() {

        const cached =
            getCachedMessages();


        if (
            Array.isArray(cached) &&
            cached.length > 0
        ) {

            currentMessages =
                cached;


            renderMessages(
                currentMessages
            );


            return true;

        }


        /*
         * Aucun cache :
         * on affiche une interface légère.
         * Pas de gros loader interminable.
         */

        if (
            messagesContainer
        ) {

            messagesContainer.innerHTML = `

                <div class="messages-starting">

                    <div class="starting-icon">

                        <i class="fa-regular fa-envelope"></i>

                    </div>

                    <h3>
                        Votre messagerie
                    </h3>

                    <p>
                        Recherche de vos messages...
                    </p>

                    <div class="starting-spinner"></div>

                </div>

            `;

        }


        return false;

    }


    /* ============================================================
       INDICATEUR SYNCHRONISATION
    ============================================================ */

    function showRefreshing() {

        if (
            document.getElementById(
                "messageRefreshing"
            )
        ) {

            return;

        }


        const element =
            document.createElement(
                "div"
            );


        element.id =
            "messageRefreshing";


        element.innerHTML = `

            <i class="fa-solid fa-rotate fa-spin"></i>

            Mise à jour...

        `;


        document.body.appendChild(
            element
        );

    }


    function hideRefreshing() {

        const element =
            document.getElementById(
                "messageRefreshing"
            );


        if (element) {

            element.remove();

        }

    }


    /* ============================================================
       SYNCHRONISATION SERVEUR
    ============================================================ */

    async function syncMessages(
        options = {}
    ) {

        const silent =
            options.silent !== false;


        const force =
            options.force === true;


        const userId =
            getCurrentUserId();


        if (!userId) {

            return false;

        }


        /*
         * Empêche plusieurs requêtes simultanées.
         */

        if (
            syncInProgress
        ) {

            return false;

        }


        /*
         * Petite protection contre les appels
         * trop rapprochés.
         */

        if (
            !force &&
            Date.now() -
            lastSyncTime <
            3000
        ) {

            return false;

        }


        syncInProgress =
            true;


        lastSyncTime =
            Date.now();


        if (
            silent &&
            currentMessages.length > 0
        ) {

            showRefreshing();

        }


        try {

            let data;


            /*
             * PREMIÈRE TENTATIVE
             */

            try {

                data =
                    await apiRequest(

                        `/api/utilisateurs/${encodeURIComponent(userId)}/messages`,

                        {
                            method: "GET"
                        },

                        API_TIMEOUT

                    );

            } catch (firstError) {

                /*
                 * Si Render était endormi,
                 * on attend très peu puis on réessaie.
                 */

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            RETRY_DELAY
                        )
                );


                data =
                    await apiRequest(

                        `/api/utilisateurs/${encodeURIComponent(userId)}/messages`,

                        {
                            method: "GET"
                        },

                        API_TIMEOUT

                    );

            }


            if (
                !data ||
                data.success !== true
            ) {

                throw new Error(
                    data?.message ||
                    "Impossible de récupérer les messages."
                );

            }


            if (
                !Array.isArray(
                    data.messages
                )
            ) {

                throw new Error(
                    "Les données de messagerie sont invalides."
                );

            }


            /*
             * Mise à jour.
             */

            currentMessages =
                data.messages;


            saveMessagesToCache(
                currentMessages
            );


            renderMessages(
                currentMessages
            );


            hideRefreshing();


            return true;


        } catch (error) {

            console.warn(
                "Synchronisation messagerie :",
                error
            );


            hideRefreshing();


            /*
             * Très important :
             * si nous avons déjà des messages,
             * on ne les efface jamais.
             */

            if (
                currentMessages.length > 0
            ) {

                return false;

            }


            /*
             * Si aucun message n'est encore affiché,
             * on affiche un état léger.
             */

            if (
                messagesContainer
            ) {

                messagesContainer.innerHTML = `

                    <div class="message-error">

                        <div class="error-icon">

                            <i class="fa-solid fa-cloud-arrow-down"></i>

                        </div>

                        <h3>
                            Messagerie momentanément indisponible
                        </h3>

                        <p>
                            Nous n'avons pas pu contacter le serveur.
                            Réessayez dans quelques instants.
                        </p>

                        <button
                            type="button"
                            id="retryMessages"
                            class="retry-btn"
                        >

                            <i class="fa-solid fa-rotate-right"></i>

                            Réessayer

                        </button>

                    </div>

                `;


                const retry =
                    document.getElementById(
                        "retryMessages"
                    );


                if (retry) {

                    retry.onclick =
                        function () {

                            loadMessages(
                                true
                            );

                        };

                }

            }


            return false;

        } finally {

            syncInProgress =
                false;

        }

    }


    /* ============================================================
       CHARGEMENT PRINCIPAL
    ============================================================ */

    async function loadMessages(
        force = false
    ) {

        currentUser =
            getCurrentUser();


        const userId =
            getCurrentUserId();


        if (!userId) {

            if (
                messagesContainer
            ) {

                messagesContainer.innerHTML = `

                    <div class="message-error">

                        <div class="error-icon">

                            <i class="fa-solid fa-user-lock"></i>

                        </div>

                        <h3>
                            Connexion requise
                        </h3>

                        <p>
                            Veuillez vous connecter pour accéder
                            à votre messagerie.
                        </p>

                    </div>

                `;

            }


            return;

        }


        /*
         * 1. CACHE IMMÉDIAT
         */

        const hasCache =
            showInstantMessages();


        /*
         * 2. SYNCHRONISATION SERVEUR
         *
         * Même avec un cache récent,
         * on vérifie discrètement le serveur.
         */

        const cacheAge =
            getCacheAge();


        /*
         * Si le cache est très récent,
         * on laisse quand même une vérification légère.
         *
         * force=true permet le bouton Réessayer.
         */

        if (
            force ||
            !hasCache ||
            cacheAge >
            CACHE_DURATION
        ) {

            await syncMessages({
                silent: hasCache,
                force: force
            });

        } else {

            /*
             * Cache récent :
             * synchronisation en arrière-plan.
             */

            syncMessages({
                silent: true,
                force: false
            });

        }

    }


    /* ============================================================
       AFFICHER LES MESSAGES
    ============================================================ */

    function renderMessages(
        messages
    ) {

        if (!messagesContainer) {
            return;
        }


        if (
            !Array.isArray(messages) ||
            messages.length === 0
        ) {

            messagesContainer.innerHTML = `

                <div class="messages-empty">

                    <div class="empty-icon">

                        <i class="fa-regular fa-envelope-open"></i>

                    </div>

                    <h3>
                        Aucun message
                    </h3>

                    <p>
                        Vous n'avez actuellement aucun message.
                    </p>

                </div>

            `;

            return;

        }


        const sorted =
            [...messages].sort(
                function (a, b) {

                    return (
                        new Date(
                            b.created_at || 0
                        ) -
                        new Date(
                            a.created_at || 0
                        )
                    );

                }
            );


        messagesContainer.innerHTML =
            sorted
                .map(
                    createMessageCard
                )
                .join("");


        messagesContainer
            .querySelectorAll(
                "[data-message-id]"
            )
            .forEach(
                function (card) {

                    card.onclick =
                        function () {

                            openMessage(
                                Number(
                                    card.dataset.messageId
                                )
                            );

                        };

                }
            );

    }


    /* ============================================================
       CARTE MESSAGE
    ============================================================ */

    function createMessageCard(
        message
    ) {

        const official =
            isOfficial(message);


        const reply =
            isUserReply(message);


        const unread =
            String(
                message.status || ""
            ).toLowerCase() !==
            "read";


        let icon =
            "fa-user";


        let label =
            "Message personnel";


        if (official) {

            icon =
                "fa-bullhorn";

            label =
                "Annonce officielle";

        }


        if (reply) {

            icon =
                "fa-reply";

            label =
                "Votre réponse";

        }


        const priority =
            String(
                message.priority ||
                "normal"
            ).toLowerCase();


        let priorityLabel =
            "Normal";


        if (
            priority === "important" ||
            priority === "high"
        ) {

            priorityLabel =
                "Important";

        }


        if (
            priority === "urgent"
        ) {

            priorityLabel =
                "Urgent";

        }


        return `

            <article
                class="
                    message-card
                    ${unread ? "unread" : ""}
                    ${official ? "official" : ""}
                    ${reply ? "user-reply" : ""}
                "
                data-message-id="${Number(
                    message.id
                )}"
            >

                <div class="message-card-icon">

                    <i class="fa-solid ${icon}"></i>

                </div>


                <div class="message-card-content">

                    <div class="message-card-top">

                        <span class="message-type">

                            ${escapeHTML(label)}

                        </span>


                        ${
                            unread
                                ? `
                                    <span class="unread-dot">
                                        Nouveau
                                    </span>
                                `
                                : ""
                        }

                    </div>


                    <h3 class="message-subject">

                        ${escapeHTML(
                            message.subject ||
                            "Sans objet"
                        )}

                    </h3>


                    <p class="message-preview">

                        ${escapeHTML(
                            truncate(
                                message.content || "",
                                120
                            )
                        )}

                    </p>


                    <div class="message-card-bottom">

                        <span class="message-date">

                            <i class="fa-regular fa-clock"></i>

                            ${formatDate(
                                message.created_at
                            )}

                        </span>


                        <span
                            class="
                                priority-badge
                                ${escapeHTML(
                                    priority
                                )}
                            "
                        >

                            ${escapeHTML(
                                priorityLabel
                            )}

                        </span>

                    </div>

                </div>


                <div class="message-card-arrow">

                    <i class="fa-solid fa-chevron-right"></i>

                </div>

            </article>

        `;

    }


    /* ============================================================
       TRONQUER
    ============================================================ */

    function truncate(
        text,
        length
    ) {

        text =
            String(
                text || ""
            );


        if (
            text.length <= length
        ) {

            return text;

        }


        return (
            text.substring(
                0,
                length
            ) +
            "..."
        );

    }


    /* ============================================================
       OUVRIR MESSAGE
    ============================================================ */

    function openMessage(
        messageId
    ) {

        const message =
            currentMessages.find(
                function (item) {

                    return (
                        Number(item.id) ===
                        Number(messageId)
                    );

                }
            );


        if (!message) {

            showToast(
                "Message introuvable.",
                "error"
            );

            return;

        }


        currentMessage =
            message;


        renderMessageDetail(
            message
        );


        if (
            String(
                message.status || ""
            ).toLowerCase() !==
            "read"
        ) {

            markAsRead(
                message.id
            );

        }

    }

    /* ============================================================
       REPONDRE
    ============================================================ */

    async function handleReply(
        event
    ) {

        event.preventDefault();


        if (!currentMessage) {
            return;
        }


        const userId =
            getCurrentUserId();


        if (!userId) {

            showToast(
                "Utilisateur non connecté.",
                "error"
            );

            return;

        }


        if (
            !canReplyToMessage(
                currentMessage
            )
        ) {

            showToast(
                "Vous ne pouvez pas répondre à ce message.",
                "warning"
            );

            return;

        }


        const textarea =
            document.getElementById(
                "replyContent"
            );


        const button =
            document.getElementById(
                "sendReplyBtn"
            );


        if (!textarea) {
            return;
        }


        const content =
            textarea.value.trim();


        if (!content) {

            showToast(
                "Écrivez votre réponse.",
                "warning"
            );

            textarea.focus();

            return;

        }


        if (
            content.length > 5000
        ) {

            showToast(
                "Votre réponse est trop longue.",
                "warning"
            );

            return;

        }


        if (button) {

            button.disabled =
                true;


            button.innerHTML = `

                <i class="fa-solid fa-spinner fa-spin"></i>

                Envoi...

            `;

        }


        try {

            const data =
                await apiRequest(

                    `/api/utilisateurs/${encodeURIComponent(
                        userId
                    )}/messages/${encodeURIComponent(
                        currentMessage.id
                    )}/repondre`,

                    {
                        method: "POST",

                        body:
                            JSON.stringify({
                                content:
                                    content
                            })
                    },

                    10000

                );


            if (
                !data ||
                data.success !== true
            ) {

                throw new Error(
                    data?.message ||
                    "Impossible d'envoyer la réponse."
                );

            }


            showToast(
                "Votre réponse a été envoyée.",
                "success"
            );


            /*
             * On ferme immédiatement.
             */

            closeMessageDetail();


            /*
             * Synchronisation discrète.
             */

            await syncMessages({
                silent: true,
                force: true
            });


        } catch (error) {

            console.error(
                "Erreur réponse :",
                error
            );


            showToast(
                error.message ||
                "Impossible d'envoyer la réponse.",
                "error"
            );


            if (button) {

                button.disabled =
                    false;


                button.innerHTML = `

                    <i class="fa-solid fa-paper-plane"></i>

                    Envoyer

                `;

            }

        }

    }


    /* ============================================================
       MARQUER COMME LU
       
       Modification locale immédiate,
       puis serveur en arrière-plan.
    ============================================================ */

    async function markAsRead(
        messageId
    ) {

        const userId =
            getCurrentUserId();


        if (!userId) {
            return;
        }


        const message =
            currentMessages.find(
                function (item) {

                    return (
                        Number(item.id) ===
                        Number(messageId)
                    );

                }
            );


        if (!message) {
            return;
        }


        /*
         * LU IMMÉDIATEMENT côté interface.
         */

        message.status =
            "read";


        message.read_at =
            new Date().toISOString();


        saveMessagesToCache(
            currentMessages
        );


        renderMessages(
            currentMessages
        );


        /*
         * SERVEUR EN ARRIÈRE-PLAN
         */

        try {

            await apiRequest(

                `/api/utilisateurs/${encodeURIComponent(
                    userId
                )}/messages/${encodeURIComponent(
                    messageId
                )}/read`,

                {
                    method: "PATCH"
                },

                6000

            );

        } catch (error) {

            console.warn(
                "Lecture serveur :",
                error
            );

        }

    }


    /* ============================================================
       FERMER DETAIL
    ============================================================ */

    function closeMessageDetail() {

        if (!messageDetail) {
            return;
        }


        messageDetail.classList.remove(
            "active"
        );


        currentMessage =
            null;

    }


    /* ============================================================
       BOUTON RETOUR
    ============================================================ */

    const backButton =
        document.getElementById(
            "backButton"
        );


    if (backButton) {

        backButton.onclick =
            function () {

                if (
                    window.history.length > 1
                ) {

                    window.history.back();

                } else {

                    window.location.href =
                        "index.html";

                }

            };

    }


    /* ============================================================
       INITIALISATION
    ============================================================ */

    currentUser =
        getCurrentUser();


    if (!currentUser) {

        if (
            messagesContainer
        ) {

            messagesContainer.innerHTML = `

                <div class="message-error">

                    <div class="error-icon">

                        <i class="fa-solid fa-user-lock"></i>

                    </div>

                    <h3>
                        Connexion requise
                    </h3>

                    <p>
                        Veuillez vous connecter pour accéder
                        à votre messagerie.
                    </p>

                </div>

            `;

        }


        return;

    }


    if (
        !getCurrentUserId()
    ) {

        if (
            messagesContainer
        ) {

            messagesContainer.innerHTML = `

                <div class="message-error">

                    <div class="error-icon">

                        <i class="fa-solid fa-user-lock"></i>

                    </div>

                    <h3>
                        Session invalide
                    </h3>

                    <p>
                        Impossible d'identifier votre compte.
                    </p>

                </div>

            `;

        }


        return;

    }


    /* ============================================================
       PREMIER CHARGEMENT
       
       Le cache est affiché immédiatement.
       Le serveur travaille ensuite en arrière-plan.
    ============================================================ */

    loadMessages();


    /* ============================================================
       ACTUALISATION AUTOMATIQUE
    ============================================================ */

    refreshTimer =
        setInterval(
            function () {

                if (
                    document.visibilityState !==
                    "visible"
                ) {

                    return;

                }


                syncMessages({
                    silent: true,
                    force: false
                });

            },
            REFRESH_INTERVAL
        );


    /* ============================================================
       RETOUR SUR LA PAGE
    ============================================================ */

    document.addEventListener(
        "visibilitychange",
        function () {

            if (
                document.visibilityState ===
                "visible"
            ) {

                syncMessages({
                    silent: true,
                    force: true
                });

            }

        }
    );


    /* ============================================================
       NETTOYAGE
    ============================================================ */

    window.addEventListener(
        "beforeunload",
        function () {

            if (
                refreshTimer
            ) {

                clearInterval(
                    refreshTimer
                );

            }

        }
    );


    /* ============================================================
       API PUBLIQUE POUR TEST
    ============================================================ */

    window.BMJMessages = {

        loadMessages:
            loadMessages,

        syncMessages:
            syncMessages,

        getCurrentUser:
            getCurrentUser,

        getCurrentUserId:
            getCurrentUserId,

        openMessage:
            openMessage,

        closeMessageDetail:
            closeMessageDetail,

        getCachedMessages:
            getCachedMessages

    };

});
</script>

</body>
</html>
