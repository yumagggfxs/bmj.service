<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messagerie | BMJ SERVICE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .topbar {
            height: 70px;
            background: #145a86;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 28px;

            box-shadow: 0 3px 15px rgba(0, 0, 0, .08);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255, 255, 255, .15);
        }

        .back-btn {
            border: none;
            background: rgba(255, 255, 255, .12);
            color: white;

            padding: 10px 15px;
            border-radius: 10px;

            display: flex;
            align-items: center;
            gap: 8px;

            transition: .2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, .22);
        }

        /* =====================================================
           PAGE
        ===================================================== */

        .page {
            width: min(1200px, calc(100% - 30px));
            margin: 30px auto;
        }

        .page-header {
            margin-bottom: 22px;
        }

        .page-header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .page-header p {
            color: #697586;
            font-size: 14px;
        }

        /* =====================================================
           LAYOUT
        ===================================================== */

        .messaging-layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;

            min-height: 650px;
        }

        .card {
            background: white;
            border-radius: 18px;

            box-shadow: 0 8px 30px rgba(20, 40, 70, .07);

            overflow: hidden;
        }

        /* =====================================================
           LISTE
        ===================================================== */

        .messages-header {
            padding: 20px;

            border-bottom: 1px solid #edf0f5;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .messages-header h2 {
            font-size: 17px;
        }

        .message-count {
            min-width: 26px;
            height: 26px;

            padding: 0 8px;

            border-radius: 20px;

            background: #145a86;
            color: white;

            font-size: 12px;
            font-weight: 700;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message-list {
            max-height: 590px;
            overflow-y: auto;
        }

        .message-item {
            padding: 17px 18px;

            border-bottom: 1px solid #edf0f5;

            cursor: pointer;

            transition: .2s;

            position: relative;
        }

        .message-item:hover {
            background: #f8fbff;
        }

        .message-item.active {
            background: #eef7ff;
            border-left: 4px solid #145a86;
        }

        .message-item.unread {
            background: #f7fbff;
        }

        .message-item.unread::after {
            content: "";

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #145a86;

            position: absolute;
            top: 20px;
            right: 18px;
        }

        .message-item-top {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 7px;
        }

        .message-icon {
            width: 36px;
            height: 36px;

            flex-shrink: 0;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #edf5fb;
            color: #145a86;
        }

        .message-item.unread .message-icon {
            background: #145a86;
            color: white;
        }

        .message-item-title {
            flex: 1;

            font-size: 13px;
            font-weight: 700;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message-date {
            color: #8993a4;
            font-size: 10px;
        }

        .message-preview {
            color: #697586;

            font-size: 12px;
            line-height: 1.5;

            margin-left: 46px;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;
        }

        .official-label {
            display: inline-flex;
            align-items: center;
            gap: 5px;

            margin-top: 8px;
            margin-left: 46px;

            padding: 4px 8px;

            border-radius: 6px;

            background: #fff5df;
            color: #a56b00;

            font-size: 9px;
            font-weight: 700;
        }

        .individual-label {
            display: inline-flex;
            align-items: center;
            gap: 5px;

            margin-top: 8px;
            margin-left: 46px;

            padding: 4px 8px;

            border-radius: 6px;

            background: #eaf7ef;
            color: #19713d;

            font-size: 9px;
            font-weight: 700;
        }

        /* =====================================================
           DETAIL
        ===================================================== */

        .message-detail {
            display: flex;
            flex-direction: column;

            min-width: 0;
        }

        .empty-state {
            flex: 1;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 40px;
        }

        .empty-icon {
            width: 85px;
            height: 85px;

            border-radius: 50%;

            background: #edf5fb;
            color: #145a86;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;

            margin-bottom: 18px;
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: #7b8797;
            font-size: 13px;
            max-width: 400px;
        }

        .detail-header {
            padding: 24px;

            border-bottom: 1px solid #edf0f5;
        }

        .detail-type {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 6px 10px;

            border-radius: 8px;

            font-size: 10px;
            font-weight: 700;

            margin-bottom: 13px;
        }

        .detail-type.official {
            background: #fff5df;
            color: #a56b00;
        }

        .detail-type.individual {
            background: #eaf7ef;
            color: #19713d;
        }

        .detail-header h2 {
            font-size: 21px;
            line-height: 1.35;

            margin-bottom: 10px;
        }

        .detail-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;

            color: #8993a4;

            font-size: 11px;
        }

        .detail-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .priority {
            padding: 4px 8px;
            border-radius: 6px;

            font-size: 9px;
            font-weight: 700;
        }

        .priority.normal {
            background: #edf1f5;
            color: #657182;
        }

        .priority.important {
            background: #fff4d7;
            color: #9a6800;
        }

        .priority.urgent {
            background: #ffe5e5;
            color: #c53030;
        }

        /* =====================================================
           CONTENU
        ===================================================== */

        .detail-body {
            flex: 1;

            padding: 28px;

            overflow-y: auto;

            background: #fbfcfe;
        }

        .message-content {
            background: white;

            border: 1px solid #edf0f5;

            border-radius: 14px;

            padding: 22px;

            font-size: 14px;
            line-height: 1.8;

            color: #374151;

            white-space: pre-wrap;

            word-break: break-word;
        }

        /* =====================================================
           REPONSE
        ===================================================== */

        .reply-box {
            padding: 18px 22px;

            background: white;

            border-top: 1px solid #edf0f5;
        }

        .reply-info {
            display: flex;
            align-items: center;
            gap: 8px;

            color: #697586;

            font-size: 11px;

            margin-bottom: 10px;
        }

        .reply-form {
            display: flex;
            gap: 10px;
        }

        .reply-form textarea {
            flex: 1;

            min-height: 48px;
            max-height: 130px;

            resize: vertical;

            border: 1px solid #dce2ea;
            border-radius: 11px;

            padding: 13px 15px;

            outline: none;

            font-size: 12px;

            transition: .2s;
        }

        .reply-form textarea:focus {
            border-color: #145a86;
            box-shadow: 0 0 0 3px rgba(20, 90, 134, .08);
        }

        .reply-btn {
            width: 50px;
            height: 48px;

            flex-shrink: 0;

            border: none;
            border-radius: 11px;

            background: #145a86;
            color: white;

            font-size: 17px;

            transition: .2s;
        }

        .reply-btn:hover {
            background: #0f4c73;
            transform: translateY(-1px);
        }

        .reply-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        /* =====================================================
           OFFICIAL NO REPLY
        ===================================================== */

        .no-reply {
            padding: 15px 22px;

            background: #fafbfc;

            border-top: 1px solid #edf0f5;

            color: #7b8797;

            font-size: 11px;

            display: flex;
            align-items: center;
            gap: 9px;
        }

        .no-reply i {
            color: #a56b00;
        }

        /* =====================================================
           LOADING
        ===================================================== */

        .loading {
            min-height: 250px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            color: #7b8797;

            font-size: 13px;
        }

        .spinner {
            width: 22px;
            height: 22px;

            border: 3px solid #e4e9ef;
            border-top-color: #145a86;

            border-radius: 50%;

            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =====================================================
           TOAST
        ===================================================== */

        .toast-container {
            position: fixed;

            right: 20px;
            bottom: 20px;

            z-index: 9999;

            display: flex;
            flex-direction: column;

            gap: 10px;
        }

        .toast {
            min-width: 280px;

            background: #172033;
            color: white;

            padding: 14px 17px;

            border-radius: 11px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, .18);

            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 12px;

            animation: toastIn .25s ease;
        }

        .toast.success i {
            color: #52d98b;
        }

        .toast.error i {
            color: #ff7777;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 850px) {

            .topbar {
                padding: 0 15px;
            }

            .brand {
                font-size: 16px;
            }

            .messaging-layout {
                grid-template-columns: 1fr;
            }

            .message-list {
                max-height: 400px;
            }

            .message-detail {
                min-height: 550px;
            }

            .page {
                width: calc(100% - 20px);
                margin: 20px auto;
            }

            .page-header h1 {
                font-size: 23px;
            }

            .detail-header {
                padding: 20px;
            }

            .detail-body {
                padding: 18px;
            }

            .reply-box {
                padding: 15px;
            }

            .back-btn span {
                display: none;
            }
        }
        /* ============================================================
   CHARGEMENT MESSAGES
============================================================ */

.message-loading {

    min-height: 220px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 10px;

    color: #64748b;

    text-align: center;

}


.message-loading strong {

    color: #145a86;

    font-size: 15px;

}


.message-loading small {

    color: #94a3b8;

    font-size: 12px;

}


.loading-spinner {

    width: 34px;

    height: 34px;

    border-radius: 50%;

    border: 3px solid #e2e8f0;

    border-top-color: #145a86;

    animation:
        bmjMessageSpin .7s linear infinite;

}


@keyframes bmjMessageSpin {

    to {

        transform:
            rotate(360deg);

    }

}


/* ============================================================
   ACTUALISATION
============================================================ */

#messageRefreshing {

    position: fixed;

    top: 18px;

    right: 18px;

    z-index: 99999;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 10px 15px;

    border-radius: 30px;

    background: #ffffff;

    color: #145a86;

    font-size: 13px;

    font-weight: 600;

    box-shadow:
        0 8px 25px rgba(
            0,
            0,
            0,
            .12
        );

}


/* ============================================================
   ERREUR
============================================================ */

.message-error {

    min-height: 250px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 30px;

}


.message-error .error-icon {

    width: 65px;

    height: 65px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background: #fff1f2;

    color: #e11d48;

    font-size: 28px;

    margin-bottom: 15px;

}


.message-error h3 {

    margin: 0 0 8px;

    color: #1e293b;

}


.message-error p {

    max-width: 450px;

    margin: 0 0 20px;

    color: #64748b;

    line-height: 1.6;

}


.retry-btn {

    border: none;

    padding: 12px 20px;

    border-radius: 10px;

    background: #145a86;

    color: white;

    cursor: pointer;

    font-weight: 600;

}


.retry-btn:hover {

    opacity: .9;

}
    </style>
</head>

<body>

<header class="topbar">

    <div class="brand">
        <div class="brand-icon">
            <i class="fa-solid fa-envelope"></i>
        </div>

        <span>BMJ SERVICE</span>
    </div>

    <button class="back-btn" id="backButton">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Retour</span>
    </button>

</header>


<main class="page">

    <div class="page-header">
        <h1>Ma messagerie</h1>

        <p>
            Retrouvez ici les annonces de BMJ SERVICE et les messages qui vous sont personnellement destinés.
        </p>
    </div>


    <div class="messaging-layout">

        <!-- =================================================
             LISTE DES MESSAGES
        ================================================== -->

        <div class="card">

            <div class="messages-header">

                <h2>Messages</h2>

                <div class="message-count" id="messageCount">
                    0
                </div>

            </div>

            <div class="message-list" id="messageList">

                <div class="loading">
                    <div class="spinner"></div>
                    Chargement...
                </div>

            </div>

        </div>


        <!-- =================================================
             DETAIL
        ================================================== -->

        <div class="card message-detail" id="messageDetail">

            <div class="empty-state">

                <div class="empty-icon">
                    <i class="fa-regular fa-envelope-open"></i>
                </div>

                <h3>Sélectionnez un message</h3>

                <p>
                    Choisissez un message dans votre boîte de réception
                    pour afficher son contenu.
                </p>

            </div>

        </div>

    </div>

</main>


<div class="toast-container" id="toastContainer"></div>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =====================================================
           CONFIGURATION
        ===================================================== */

        const API_URL =
            "https://back-end-h602.onrender.com";


        let currentUser = null;

        let currentMessages = [];

        let currentMessage = null;

        let refreshTimer = null;


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const messagesContainer =
            document.getElementById(
                "messagesContainer"
            );


        const messageDetail =
            document.getElementById(
                "messageDetail"
            );


        const toastContainer =
            document.getElementById(
                "toastContainer"
            );


        /* =====================================================
           UTILISATEUR
        ===================================================== */

        function getCurrentUser() {

            const keys = [

                "bmj_current_user",

                "currentUser",

                "bmj_user",

                "user"

            ];


            for (
                const key of keys
            ) {

                const raw =
                    localStorage.getItem(
                        key
                    );


                if (!raw) {
                    continue;
                }


                try {

                    const user =
                        JSON.parse(raw);


                    if (
                        user &&
                        (
                            user.id ||
                            user.user_id
                        )
                    ) {

                        return user;

                    }

                } catch (error) {

                    console.error(
                        "Erreur utilisateur :",
                        error
                    );

                }

            }


            return null;
        }


        /* =====================================================
           ID UTILISATEUR
        ===================================================== */

        function getCurrentUserId() {

            if (!currentUser) {
                return null;
            }


            const id =
                Number(
                    currentUser.id ||
                    currentUser.user_id
                );


            if (
                !Number.isInteger(id) ||
                id <= 0
            ) {

                return null;

            }


            return id;
        }


        /* =====================================================
           ECHAPPEMENT HTML
        ===================================================== */

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =====================================================
           DATE
        ===================================================== */

        function formatDate(value) {

            if (!value) {
                return "";
            }


            const date =
                new Date(value);


            if (
                isNaN(
                    date.getTime()
                )
            ) {

                return "";

            }


            return date.toLocaleDateString(
                "fr-FR",
                {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric"
                }
            );
        }


        /* =====================================================
           DATE + HEURE
        ===================================================== */

        function formatDateTime(value) {

            if (!value) {
                return "";
            }


            const date =
                new Date(value);


            if (
                isNaN(
                    date.getTime()
                )
            ) {

                return "";

            }


            return date.toLocaleDateString(
                "fr-FR",
                {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );
        }


        /* =====================================================
           TYPE
        ===================================================== */

        function isOfficial(message) {

            return (
                message &&
                message.type ===
                "official"
            );
        }


        function isUserReply(message) {

            return (
                message &&
                message.type ===
                "user_reply"
            );
        }


        function isIndividual(message) {

            return (
                message &&
                message.type ===
                "user"
            );
        }


        /* =====================================================
           AUTORISATION RÉPONSE
        ===================================================== */

        function canReplyToMessage(
            message
        ) {

            if (!message) {
                return false;
            }


            if (
                isOfficial(message)
            ) {

                return false;

            }


            if (
                isUserReply(message)
            ) {

                return false;

            }


            if (
                !isIndividual(message)
            ) {

                return false;

            }


            if (
                message.sender_type &&
                message.sender_type !==
                "admin"
            ) {

                return false;

            }


            const userId =
                getCurrentUserId();


            if (!userId) {
                return false;
            }


            return (
                Number(
                    message.recipient_user_id
                ) ===
                Number(userId)
            );

        }


        /* =====================================================
           API
        ===================================================== */

        async function apiRequest(
            endpoint,
            options = {}
        ) {

            const controller =
                new AbortController();


            const timeout =
                setTimeout(
                    function () {

                        controller.abort();

                    },
                    20000
                );


            try {

                const headers = {

                    "Accept":
                        "application/json"

                };


                if (options.body) {

                    headers[
                        "Content-Type"
                    ] =
                        "application/json";

                }


                const response =
                    await fetch(
                        `${API_URL}${endpoint}`,
                        {
                            ...options,

                            headers: {
                                ...headers,
                                ...(options.headers || {})
                            },

                            cache:
                                "no-store",

                            signal:
                                controller.signal
                        }
                    );


                let data = null;


                try {

                    data =
                        await response.json();

                } catch (error) {

                    throw new Error(
                        "Réponse invalide du serveur."
                    );

                }


                if (!response.ok) {

                    throw new Error(

                        data?.message ||
                        data?.error ||
                        `Erreur HTTP ${response.status}`

                    );

                }


                return data;


            } finally {

                clearTimeout(timeout);

            }

        }


        /* =====================================================
           TOAST
        ===================================================== */

        function showToast(
            message,
            type = "info"
        ) {

            if (!toastContainer) {

                console.log(message);

                return;

            }


            const toast =
                document.createElement(
                    "div"
                );


            toast.className =
                `bmj-toast ${type}`;


            let icon =
                "fa-circle-info";


            if (
                type === "success"
            ) {

                icon =
                    "fa-circle-check";

            }


            if (
                type === "error"
            ) {

                icon =
                    "fa-circle-xmark";

            }


            if (
                type === "warning"
            ) {

                icon =
                    "fa-triangle-exclamation";

            }


            toast.innerHTML = `

                <div class="toast-icon">

                    <i class="fa-solid ${icon}"></i>

                </div>

                <div class="toast-text">

                    ${escapeHTML(message)}

                </div>

                <button
                    type="button"
                    class="toast-close"
                >

                    <i class="fa-solid fa-xmark"></i>

                </button>

            `;


            toastContainer.appendChild(
                toast
            );


            requestAnimationFrame(
                function () {

                    toast.classList.add(
                        "show"
                    );

                }
            );


            const close =
                toast.querySelector(
                    ".toast-close"
                );


            if (close) {

                close.onclick =
                    function () {

                        toast.remove();

                    };

            }


            setTimeout(
                function () {

                    if (
                        toast.parentNode
                    ) {

                        toast.remove();

                    }

                },
                4500
            );

        }


        /* =====================================================
           CHARGEMENT
        ===================================================== */

        function showLoading() {

            if (!messagesContainer) {
                return;
            }


            messagesContainer.innerHTML = `

                <div class="message-loading">

                    <div class="loading-spinner"></div>

                    <strong>
                        Chargement...
                    </strong>

                    <small>
                        Connexion au serveur
                    </small>

                </div>

            `;

        }


        /* =====================================================
           ERREUR
        ===================================================== */

        function showError(
            message
        ) {

            if (!messagesContainer) {
                return;
            }


            messagesContainer.innerHTML = `

                <div class="message-error">

                    <div class="error-icon">

                        <i class="fa-solid fa-envelope-circle-xmark"></i>

                    </div>

                    <h3>
                        Impossible de charger les messages
                    </h3>

                    <p>
                        ${escapeHTML(
                            message ||
                            "Une erreur est survenue."
                        )}
                    </p>

                    <button
                        type="button"
                        id="retryMessages"
                        class="retry-btn"
                    >

                        <i class="fa-solid fa-rotate-right"></i>

                        Réessayer

                    </button>

                </div>

            `;


            const retry =
                document.getElementById(
                    "retryMessages"
                );


            if (retry) {

                retry.onclick =
                    function () {

                        loadMessages();

                    };

            }

        }


        /* =====================================================
           INDICATEUR ACTUALISATION
        ===================================================== */

        function showRefreshing() {

            if (
                document.getElementById(
                    "messageRefreshing"
                )
            ) {

                return;

            }


            const element =
                document.createElement(
                    "div"
                );


            element.id =
                "messageRefreshing";


            element.innerHTML = `

                <i class="fa-solid fa-rotate fa-spin"></i>

                Actualisation

            `;


            document.body.appendChild(
                element
            );

        }


        function hideRefreshing() {

            const element =
                document.getElementById(
                    "messageRefreshing"
                );


            if (element) {

                element.remove();

            }

        }


        /* =====================================================
           CHARGER LES MESSAGES
        ===================================================== */

        async function loadMessages() {

            currentUser =
                getCurrentUser();


            const userId =
                getCurrentUserId();


            console.log(
                "Utilisateur actuel :",
                currentUser
            );


            console.log(
                "ID utilisateur :",
                userId
            );


            if (!userId) {

                showError(
                    "Utilisateur non connecté."
                );

                return;

            }


            /*
             * Seulement au premier chargement.
             */

            if (
                currentMessages.length === 0
            ) {

                showLoading();

            } else {

                /*
                 * On garde les messages
                 * visibles.
                 */

                showRefreshing();

            }


            try {

                console.log(
                    "Chargement :",
                    `${API_URL}/api/utilisateurs/${userId}/messages`
                );


                const data =
                    await apiRequest(
                        `/api/utilisateurs/${encodeURIComponent(userId)}/messages`,
                        {
                            method: "GET"
                        }
                    );


                console.log(
                    "Réponse serveur :",
                    data
                );


                /*
                 * FORMAT ATTENDU :
                 *
                 * {
                 *   success: true,
                 *   messages: [...]
                 * }
                 */

                if (
                    !data ||
                    data.success !== true
                ) {

                    throw new Error(

                        data?.message ||
                        "Le serveur n'a pas pu charger les messages."

                    );

                }


                if (
                    !Array.isArray(
                        data.messages
                    )
                ) {

                    throw new Error(
                        "Le serveur n'a pas retourné une liste de messages."
                    );

                }


                currentMessages =
                    data.messages;


                renderMessages(
                    currentMessages
                );


                hideRefreshing();


            } catch (error) {

                console.error(
                    "ERREUR MESSAGES :",
                    error
                );


                hideRefreshing();


                /*
                 * Ne pas supprimer les
                 * anciens messages.
                 */

                if (
                    currentMessages.length > 0
                ) {

                    showToast(
                        "Actualisation impossible. Vos messages restent disponibles.",
                        "warning"
                    );

                    return;

                }


                if (
                    error.name ===
                    "AbortError"
                ) {

                    showError(
                        "Le serveur met trop de temps à répondre. Réessayez dans quelques instants."
                    );

                    return;

                }


                showError(
                    error.message
                );

            }

        }


        /* =====================================================
           AFFICHER LES MESSAGES
        ===================================================== */

        function renderMessages(
            messages
        ) {

            if (!messagesContainer) {
                return;
            }


            if (
                !messages ||
                messages.length === 0
            ) {

                messagesContainer.innerHTML = `

                    <div class="messages-empty">

                        <div class="empty-icon">

                            <i class="fa-regular fa-envelope-open"></i>

                        </div>

                        <h3>
                            Aucun message
                        </h3>

                        <p>
                            Vous n'avez actuellement
                            aucun message.
                        </p>

                    </div>

                `;

                return;

            }


            const sorted =
                [...messages].sort(
                    function (a, b) {

                        return (
                            new Date(
                                b.created_at || 0
                            ) -
                            new Date(
                                a.created_at || 0
                            )
                        );

                    }
                );


            messagesContainer.innerHTML =
                sorted
                    .map(
                        createMessageCard
                    )
                    .join("");


            messagesContainer
                .querySelectorAll(
                    "[data-message-id]"
                )
                .forEach(
                    function (card) {

                        card.onclick =
                            function () {

                                openMessage(
                                    Number(
                                        card.dataset.messageId
                                    )
                                );

                            };

                    }
                );

        }


        /* =====================================================
           CARTE
        ===================================================== */

        function createMessageCard(
            message
        ) {

            const official =
                isOfficial(message);


            const reply =
                isUserReply(message);


            const unread =
                message.status !==
                "read";


            let icon =
                "fa-user";


            let label =
                "Message personnel";


            if (official) {

                icon =
                    "fa-bullhorn";

                label =
                    "Annonce officielle";

            }


            if (reply) {

                icon =
                    "fa-reply";

                label =
                    "Votre réponse";

            }


            let priority =
                message.priority ||
                "normal";


            let priorityLabel =
                "Normal";


            if (
                priority ===
                "important"
            ) {

                priorityLabel =
                    "Important";

            }


            if (
                priority ===
                "urgent"
            ) {

                priorityLabel =
                    "Urgent";

            }


            return `

                <article
                    class="
                        message-card
                        ${unread ? "unread" : ""}
                        ${official ? "official" : ""}
                        ${reply ? "user-reply" : ""}
                    "
                    data-message-id="${Number(message.id)}"
                >

                    <div class="message-card-icon">

                        <i class="fa-solid ${icon}"></i>

                    </div>


                    <div class="message-card-content">

                        <div class="message-card-top">

                            <span class="message-type">

                                ${escapeHTML(label)}

                            </span>


                            ${
                                unread
                                ? `
                                    <span class="unread-dot">
                                        Nouveau
                                    </span>
                                `
                                : ""
                            }

                        </div>


                        <h3 class="message-subject">

                            ${escapeHTML(
                                message.subject ||
                                "Sans objet"
                            )}

                        </h3>


                        <p class="message-preview">

                            ${escapeHTML(
                                truncate(
                                    message.content ||
                                    "",
                                    120
                                )
                            )}

                        </p>


                        <div class="message-card-bottom">

                            <span class="message-date">

                                <i class="fa-regular fa-clock"></i>

                                ${formatDate(
                                    message.created_at
                                )}

                            </span>


                            <span
                                class="
                                    priority-badge
                                    ${escapeHTML(priority)}
                                "
                            >

                                ${escapeHTML(
                                    priorityLabel
                                )}

                            </span>

                        </div>

                    </div>


                    <div class="message-card-arrow">

                        <i class="fa-solid fa-chevron-right"></i>

                    </div>

                </article>

            `;

        }


        /* =====================================================
           TRONQUER
        ===================================================== */

        function truncate(
            text,
            length
        ) {

            text =
                String(text || "");


            if (
                text.length <= length
            ) {

                return text;

            }


            return (
                text.substring(
                    0,
                    length
                ) + "..."
            );

        }


        /* =====================================================
           OUVRIR
        ===================================================== */

        async function openMessage(
            messageId
        ) {

            const message =
                currentMessages.find(
                    function (item) {

                        return (
                            Number(item.id) ===
                            Number(messageId)
                        );

                    }
                );


            if (!message) {

                showToast(
                    "Message introuvable.",
                    "error"
                );

                return;

            }


            currentMessage =
                message;


            renderMessageDetail(
                message
            );


            if (
                message.status !==
                "read"
            ) {

                await markAsRead(
                    message.id
                );

            }

        }


        /* =====================================================
           DETAIL
        ===================================================== */

        function renderMessageDetail(
            message
        ) {

            if (!messageDetail) {
                return;
            }


            const official =
                isOfficial(message);


            const reply =
                isUserReply(message);


            const canReply =
                canReplyToMessage(
                    message
                );


            let icon =
                "fa-user";


            let label =
                "Message personnel";


            if (official) {

                icon =
                    "fa-bullhorn";

                label =
                    "Communication officielle";

            }


            if (reply) {

                icon =
                    "fa-reply";

                label =
                    "Votre réponse";

            }


            messageDetail.innerHTML = `

                <div class="message-detail-header">

                    <button
                        type="button"
                        id="closeMessageDetail"
                        class="message-back-btn"
                    >

                        <i class="fa-solid fa-arrow-left"></i>

                        Retour

                    </button>


                    <div class="message-detail-type">

                        <i class="fa-solid ${icon}"></i>

                        ${escapeHTML(label)}

                    </div>

                </div>


                <div class="message-detail-body">

                    <div class="message-detail-icon">

                        <i class="fa-solid ${icon}"></i>

                    </div>


                    <div class="message-detail-meta">

                        <span>

                            <i class="fa-regular fa-calendar"></i>

                            ${formatDateTime(
                                message.created_at
                            )}

                        </span>

                    </div>


                    <h2 class="detail-subject">

                        ${escapeHTML(
                            message.subject ||
                            "Sans objet"
                        )}

                    </h2>


                    <div class="detail-content">

                        ${escapeHTML(
                            message.content ||
                            ""
                        ).replace(
                            /\n/g,
                            "<br>"
                        )}

                    </div>


                    ${
                        official
                        ? `

                            <div class="no-reply-box official-box">

                                <i class="fa-solid fa-bullhorn"></i>

                                <div>

                                    <strong>
                                        Communication officielle
                                    </strong>

                                    <p>
                                        Ce message est une
                                        communication officielle
                                        de BMJ SERVICE.
                                        Les annonces officielles
                                        ne peuvent pas recevoir
                                        de réponse.
                                    </p>

                                </div>

                            </div>

                        `
                        : ""
                    }


                    ${
                        reply
                        ? `

                            <div class="no-reply-box reply-box">

                                <i class="fa-solid fa-check"></i>

                                <div>

                                    <strong>
                                        Votre réponse
                                    </strong>

                                    <p>
                                        Cette réponse a été
                                        envoyée à
                                        l'administration.
                                    </p>

                                </div>

                            </div>

                        `
                        : ""
                    }


                    ${
                        canReply
                        ? createReplyForm()
                        : ""
                    }

                </div>

            `;


            messageDetail.classList.add(
                "active"
            );


            const close =
                document.getElementById(
                    "closeMessageDetail"
                );


            if (close) {

                close.onclick =
                    closeMessageDetail;

            }


            if (canReply) {

                const form =
                    document.getElementById(
                        "messageReplyForm"
                    );


                if (form) {

                    form.onsubmit =
                        handleReply;

                }

            }

        }


        /* =====================================================
           FORMULAIRE RÉPONSE
        ===================================================== */

        function createReplyForm() {

            return `

                <div class="reply-section">

                    <div class="reply-title">

                        <i class="fa-solid fa-reply"></i>

                        Répondre à ce message

                    </div>


                    <form
                        id="messageReplyForm"
                        class="reply-form"
                    >

                        <textarea
                            id="replyContent"
                            maxlength="5000"
                            rows="5"
                            placeholder="Écrivez votre réponse..."
                            required
                        ></textarea>


                        <div class="reply-bottom">

                            <span class="reply-limit">

                                Maximum 5000 caractères

                            </span>


                            <button
                                type="submit"
                                id="sendReplyBtn"
                                class="send-reply-btn"
                            >

                                <i class="fa-solid fa-paper-plane"></i>

                                Envoyer

                            </button>

                        </div>

                    </form>

                </div>

            `;

        }


        /* =====================================================
           ENVOYER RÉPONSE
        ===================================================== */

        async function handleReply(
            event
        ) {

            event.preventDefault();


            if (!currentMessage) {
                return;
            }


            const userId =
                getCurrentUserId();


            if (!userId) {

                showToast(
                    "Utilisateur non connecté.",
                    "error"
                );

                return;

            }


            if (
                !canReplyToMessage(
                    currentMessage
                )
            ) {

                showToast(
                    "Vous ne pouvez pas répondre à ce message.",
                    "warning"
                );

                return;

            }


            const textarea =
                document.getElementById(
                    "replyContent"
                );


            const button =
                document.getElementById(
                    "sendReplyBtn"
                );


            if (!textarea) {
                return;
            }


            const content =
                textarea.value.trim();


            if (!content) {

                showToast(
                    "Écrivez votre réponse.",
                    "warning"
                );

                textarea.focus();

                return;

            }


            if (
                content.length > 5000
            ) {

                showToast(
                    "Votre réponse est trop longue.",
                    "warning"
                );

                return;

            }


            if (button) {

                button.disabled =
                    true;


                button.innerHTML = `

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    Envoi...

                `;

            }


            try {

                await apiRequest(

                    `/api/utilisateurs/${encodeURIComponent(userId)}/messages/${encodeURIComponent(currentMessage.id)}/repondre`,

                    {

                        method:
                            "POST",

                        body:
                            JSON.stringify({

                                content:
                                    content

                            })

                    }

                );


                showToast(
                    "Votre réponse a été envoyée.",
                    "success"
                );


                closeMessageDetail();


                /*
                 * Rechargement après réponse.
                 */

                await loadMessages();


            } catch (error) {

                console.error(
                    "Erreur réponse :",
                    error
                );


                showToast(
                    error.message ||
                    "Impossible d'envoyer la réponse.",
                    "error"
                );


                if (button) {

                    button.disabled =
                        false;


                    button.innerHTML = `

                        <i class="fa-solid fa-paper-plane"></i>

                        Envoyer

                    `;

                }

            }

        }


        /* =====================================================
           MARQUER COMME LU
        ===================================================== */

        async function markAsRead(
            messageId
        ) {

            const userId =
                getCurrentUserId();


            if (!userId) {
                return;
            }


            try {

                await apiRequest(

                    `/api/utilisateurs/${encodeURIComponent(userId)}/messages/${encodeURIComponent(messageId)}/read`,

                    {
                        method:
                            "PATCH"
                    }

                );


                const message =
                    currentMessages.find(
                        function (item) {

                            return (
                                Number(item.id) ===
                                Number(messageId)
                            );

                        }
                    );


                if (message) {

                    message.status =
                        "read";

                }


            } catch (error) {

                console.error(
                    "Erreur lecture :",
                    error
                );

            }

        }


        /* =====================================================
           FERMER DETAIL
        ===================================================== */

        function closeMessageDetail() {

            if (!messageDetail) {
                return;
            }


            messageDetail.classList.remove(
                "active"
            );


            currentMessage =
                null;

        }


        /* =====================================================
           RETOUR
        ===================================================== */

        const backButton =
            document.getElementById(
                "backButton"
            );


        if (backButton) {

            backButton.onclick =
                function () {

                    if (
                        window.history.length >
                        1
                    ) {

                        window.history.back();

                    } else {

                        window.location.href =
                            "index.html";

                    }

                };

        }


        /* =====================================================
           INITIALISATION
        ===================================================== */

        currentUser =
            getCurrentUser();


        if (!currentUser) {

            showError(
                "Veuillez vous connecter pour accéder à votre messagerie."
            );

            return;

        }


        if (
            !getCurrentUserId()
        ) {

            showError(
                "Votre session utilisateur est invalide."
            );

            return;

        }


        /*
         * Premier chargement.
         */

        loadMessages();


        /* =====================================================
           ACTUALISATION TOUTES LES 60 SECONDES
        ===================================================== */

        refreshTimer =
            setInterval(
                function () {

                    if (
                        document.visibilityState ===
                        "visible"
                    ) {

                        loadMessages();

                    }

                },
                60000
            );


        /* =====================================================
           RETOUR SUR LA PAGE
        ===================================================== */

        document.addEventListener(
            "visibilitychange",
            function () {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    loadMessages();

                }

            }
        );


        /* =====================================================
           EXPOSER POUR TEST
        ===================================================== */

        window.BMJMessages = {

            loadMessages:
                loadMessages,

            getCurrentUser:
                getCurrentUser,

            getCurrentUserId:
                getCurrentUserId,

            openMessage:
                openMessage,

            closeMessageDetail:
                closeMessageDetail

        };


    }
);

</script>
</body>
</html>
