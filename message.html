<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messagerie | BMJ SERVICE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .topbar {
            height: 70px;
            background: #145a86;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 28px;

            box-shadow: 0 3px 15px rgba(0, 0, 0, .08);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255, 255, 255, .15);
        }

        .back-btn {
            border: none;
            background: rgba(255, 255, 255, .12);
            color: white;

            padding: 10px 15px;
            border-radius: 10px;

            display: flex;
            align-items: center;
            gap: 8px;

            transition: .2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, .22);
        }

        /* =====================================================
           PAGE
        ===================================================== */

        .page {
            width: min(1200px, calc(100% - 30px));
            margin: 30px auto;
        }

        .page-header {
            margin-bottom: 22px;
        }

        .page-header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .page-header p {
            color: #697586;
            font-size: 14px;
        }

        /* =====================================================
           LAYOUT
        ===================================================== */

        .messaging-layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;

            min-height: 650px;
        }

        .card {
            background: white;
            border-radius: 18px;

            box-shadow: 0 8px 30px rgba(20, 40, 70, .07);

            overflow: hidden;
        }

        /* =====================================================
           LISTE
        ===================================================== */

        .messages-header {
            padding: 20px;

            border-bottom: 1px solid #edf0f5;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .messages-header h2 {
            font-size: 17px;
        }

        .message-count {
            min-width: 26px;
            height: 26px;

            padding: 0 8px;

            border-radius: 20px;

            background: #145a86;
            color: white;

            font-size: 12px;
            font-weight: 700;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message-list {
            max-height: 590px;
            overflow-y: auto;
        }

        .message-item {
            padding: 17px 18px;

            border-bottom: 1px solid #edf0f5;

            cursor: pointer;

            transition: .2s;

            position: relative;
        }

        .message-item:hover {
            background: #f8fbff;
        }

        .message-item.active {
            background: #eef7ff;
            border-left: 4px solid #145a86;
        }

        .message-item.unread {
            background: #f7fbff;
        }

        .message-item.unread::after {
            content: "";

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #145a86;

            position: absolute;
            top: 20px;
            right: 18px;
        }

        .message-item-top {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 7px;
        }

        .message-icon {
            width: 36px;
            height: 36px;

            flex-shrink: 0;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #edf5fb;
            color: #145a86;
        }

        .message-item.unread .message-icon {
            background: #145a86;
            color: white;
        }

        .message-item-title {
            flex: 1;

            font-size: 13px;
            font-weight: 700;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message-date {
            color: #8993a4;
            font-size: 10px;
        }

        .message-preview {
            color: #697586;

            font-size: 12px;
            line-height: 1.5;

            margin-left: 46px;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;
        }

        .official-label {
            display: inline-flex;
            align-items: center;
            gap: 5px;

            margin-top: 8px;
            margin-left: 46px;

            padding: 4px 8px;

            border-radius: 6px;

            background: #fff5df;
            color: #a56b00;

            font-size: 9px;
            font-weight: 700;
        }

        .individual-label {
            display: inline-flex;
            align-items: center;
            gap: 5px;

            margin-top: 8px;
            margin-left: 46px;

            padding: 4px 8px;

            border-radius: 6px;

            background: #eaf7ef;
            color: #19713d;

            font-size: 9px;
            font-weight: 700;
        }

        /* =====================================================
           DETAIL
        ===================================================== */

        .message-detail {
            display: flex;
            flex-direction: column;

            min-width: 0;
        }

        .empty-state {
            flex: 1;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 40px;
        }

        .empty-icon {
            width: 85px;
            height: 85px;

            border-radius: 50%;

            background: #edf5fb;
            color: #145a86;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;

            margin-bottom: 18px;
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: #7b8797;
            font-size: 13px;
            max-width: 400px;
        }

        .detail-header {
            padding: 24px;

            border-bottom: 1px solid #edf0f5;
        }

        .detail-type {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 6px 10px;

            border-radius: 8px;

            font-size: 10px;
            font-weight: 700;

            margin-bottom: 13px;
        }

        .detail-type.official {
            background: #fff5df;
            color: #a56b00;
        }

        .detail-type.individual {
            background: #eaf7ef;
            color: #19713d;
        }

        .detail-header h2 {
            font-size: 21px;
            line-height: 1.35;

            margin-bottom: 10px;
        }

        .detail-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;

            color: #8993a4;

            font-size: 11px;
        }

        .detail-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .priority {
            padding: 4px 8px;
            border-radius: 6px;

            font-size: 9px;
            font-weight: 700;
        }

        .priority.normal {
            background: #edf1f5;
            color: #657182;
        }

        .priority.important {
            background: #fff4d7;
            color: #9a6800;
        }

        .priority.urgent {
            background: #ffe5e5;
            color: #c53030;
        }

        /* =====================================================
           CONTENU
        ===================================================== */

        .detail-body {
            flex: 1;

            padding: 28px;

            overflow-y: auto;

            background: #fbfcfe;
        }

        .message-content {
            background: white;

            border: 1px solid #edf0f5;

            border-radius: 14px;

            padding: 22px;

            font-size: 14px;
            line-height: 1.8;

            color: #374151;

            white-space: pre-wrap;

            word-break: break-word;
        }

        /* =====================================================
           REPONSE
        ===================================================== */

        .reply-box {
            padding: 18px 22px;

            background: white;

            border-top: 1px solid #edf0f5;
        }

        .reply-info {
            display: flex;
            align-items: center;
            gap: 8px;

            color: #697586;

            font-size: 11px;

            margin-bottom: 10px;
        }

        .reply-form {
            display: flex;
            gap: 10px;
        }

        .reply-form textarea {
            flex: 1;

            min-height: 48px;
            max-height: 130px;

            resize: vertical;

            border: 1px solid #dce2ea;
            border-radius: 11px;

            padding: 13px 15px;

            outline: none;

            font-size: 12px;

            transition: .2s;
        }

        .reply-form textarea:focus {
            border-color: #145a86;
            box-shadow: 0 0 0 3px rgba(20, 90, 134, .08);
        }

        .reply-btn {
            width: 50px;
            height: 48px;

            flex-shrink: 0;

            border: none;
            border-radius: 11px;

            background: #145a86;
            color: white;

            font-size: 17px;

            transition: .2s;
        }

        .reply-btn:hover {
            background: #0f4c73;
            transform: translateY(-1px);
        }

        .reply-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        /* =====================================================
           OFFICIAL NO REPLY
        ===================================================== */

        .no-reply {
            padding: 15px 22px;

            background: #fafbfc;

            border-top: 1px solid #edf0f5;

            color: #7b8797;

            font-size: 11px;

            display: flex;
            align-items: center;
            gap: 9px;
        }

        .no-reply i {
            color: #a56b00;
        }

        /* =====================================================
           LOADING
        ===================================================== */

        .loading {
            min-height: 250px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            color: #7b8797;

            font-size: 13px;
        }

        .spinner {
            width: 22px;
            height: 22px;

            border: 3px solid #e4e9ef;
            border-top-color: #145a86;

            border-radius: 50%;

            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =====================================================
           TOAST
        ===================================================== */

        .toast-container {
            position: fixed;

            right: 20px;
            bottom: 20px;

            z-index: 9999;

            display: flex;
            flex-direction: column;

            gap: 10px;
        }

        .toast {
            min-width: 280px;

            background: #172033;
            color: white;

            padding: 14px 17px;

            border-radius: 11px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, .18);

            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 12px;

            animation: toastIn .25s ease;
        }

        .toast.success i {
            color: #52d98b;
        }

        .toast.error i {
            color: #ff7777;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 850px) {

            .topbar {
                padding: 0 15px;
            }

            .brand {
                font-size: 16px;
            }

            .messaging-layout {
                grid-template-columns: 1fr;
            }

            .message-list {
                max-height: 400px;
            }

            .message-detail {
                min-height: 550px;
            }

            .page {
                width: calc(100% - 20px);
                margin: 20px auto;
            }

            .page-header h1 {
                font-size: 23px;
            }

            .detail-header {
                padding: 20px;
            }

            .detail-body {
                padding: 18px;
            }

            .reply-box {
                padding: 15px;
            }

            .back-btn span {
                display: none;
            }
        }

    </style>
</head>

<body>

<header class="topbar">

    <div class="brand">
        <div class="brand-icon">
            <i class="fa-solid fa-envelope"></i>
        </div>

        <span>BMJ SERVICE</span>
    </div>

    <button class="back-btn" id="backButton">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Retour</span>
    </button>

</header>


<main class="page">

    <div class="page-header">
        <h1>Ma messagerie</h1>

        <p>
            Retrouvez ici les annonces de BMJ SERVICE et les messages qui vous sont personnellement destinés.
        </p>
    </div>


    <div class="messaging-layout">

        <!-- =================================================
             LISTE DES MESSAGES
        ================================================== -->

        <div class="card">

            <div class="messages-header">

                <h2>Messages</h2>

                <div class="message-count" id="messageCount">
                    0
                </div>

            </div>

            <div class="message-list" id="messageList">

                <div class="loading">
                    <div class="spinner"></div>
                    Chargement...
                </div>

            </div>

        </div>


        <!-- =================================================
             DETAIL
        ================================================== -->

        <div class="card message-detail" id="messageDetail">

            <div class="empty-state">

                <div class="empty-icon">
                    <i class="fa-regular fa-envelope-open"></i>
                </div>

                <h3>Sélectionnez un message</h3>

                <p>
                    Choisissez un message dans votre boîte de réception
                    pour afficher son contenu.
                </p>

            </div>

        </div>

    </div>

</main>


<div class="toast-container" id="toastContainer"></div>


<script>

document.addEventListener("DOMContentLoaded", function () {

    /* =====================================================
       CONFIGURATION
    ===================================================== */

    const API_URL =
        "https://back-end-h602.onrender.com";

    let currentUser = null;
    let messages = [];
    let selectedMessage = null;

    let refreshTimer = null;


    /* =====================================================
       UTILITAIRES
    ===================================================== */

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function formatDate(date) {

        if (!date) {
            return "-";
        }

        const d = new Date(date);

        if (Number.isNaN(d.getTime())) {
            return "-";
        }

        return d.toLocaleDateString("fr-FR", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }) + " à " +
        d.toLocaleTimeString("fr-FR", {
            hour: "2-digit",
            minute: "2-digit"
        });
    }


    function showToast(
        message,
        type = "success"
    ) {

        const container =
            document.getElementById(
                "toastContainer"
            );

        if (!container) {
            return;
        }

        const toast =
            document.createElement("div");

        toast.className =
            `toast ${type}`;

        toast.innerHTML = `
            <i class="fa-solid ${
                type === "success"
                    ? "fa-circle-check"
                    : "fa-circle-exclamation"
            }"></i>

            <span>
                ${escapeHtml(message)}
            </span>
        `;

        container.appendChild(toast);

        setTimeout(function () {

            toast.remove();

        }, 4000);
    }


    function getApiError(
        error,
        fallback
    ) {

        return (
            error?.message ||
            fallback
        );
    }


    /* =====================================================
       UTILISATEUR CONNECTÉ
    ===================================================== */

    function getCurrentUser() {

        const possibleKeys = [
            "bmj_current_user",
            "currentUser",
            "bmj_user",
            "user"
        ];


        for (
            const key of possibleKeys
        ) {

            try {

                const raw =
                    localStorage.getItem(
                        key
                    );

                if (!raw) {
                    continue;
                }


                const user =
                    JSON.parse(raw);


                if (
                    user &&
                    (
                        user.id ||
                        user.user_id
                    )
                ) {

                    return user;
                }

            } catch (error) {

                console.warn(
                    "Erreur lecture utilisateur :",
                    error
                );
            }
        }


        return null;
    }


    /* =====================================================
       ID UTILISATEUR
    ===================================================== */

    function getCurrentUserId() {

        if (!currentUser) {
            return null;
        }

        const id = Number(
            currentUser.id ||
            currentUser.user_id
        );

        return (
            Number.isInteger(id) &&
            id > 0
        )
            ? id
            : null;
    }


    /* =====================================================
       REQUÊTE API
    ===================================================== */

    async function apiRequest(
        endpoint,
        options = {}
    ) {

        const response =
            await fetch(
                API_URL + endpoint,
                {
                    ...options,

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json",

                        ...(options.headers || {})
                    }
                }
            );


        let data = null;


        try {

            data =
                await response.json();

        } catch {

            data = null;
        }


        if (!response.ok) {

            throw new Error(
                data?.message ||
                data?.error ||
                `Erreur HTTP ${response.status}`
            );
        }


        if (
            data &&
            data.success === false
        ) {

            throw new Error(
                data.message ||
                data.error ||
                "Erreur serveur"
            );
        }


        return data;
    }


    /* =====================================================
       EXTRACTION DES MESSAGES
    ===================================================== */

    function extractMessages(data) {

        if (Array.isArray(data)) {
            return data;
        }


        if (
            Array.isArray(data?.data)
        ) {
            return data.data;
        }


        if (
            Array.isArray(data?.messages)
        ) {
            return data.messages;
        }


        if (
            Array.isArray(
                data?.data?.messages
            )
        ) {
            return data.data.messages;
        }


        return [];
    }


    /* =====================================================
       TYPE DE MESSAGE
    ===================================================== */

    function isOfficial(message) {

        return (
            message?.type === "official"
        );
    }


    function isUserReply(message) {

        return (
            message?.type === "user_reply" ||
            message?.sender_type === "user"
        );
    }


    function isIndividual(message) {

        return (
            !isOfficial(message) &&
            !isUserReply(message) &&
            message?.type === "user"
        );
    }


    /* =====================================================
       MESSAGE RÉPONDABLE
    ===================================================== */

    function canReplyToMessage(message) {

        if (!message) {
            return false;
        }


        /*
         * Une annonce officielle
         * ne peut jamais recevoir
         * de réponse.
         */

        if (
            isOfficial(message)
        ) {
            return false;
        }


        /*
         * Une réponse utilisateur
         * ne peut pas recevoir
         * une nouvelle réponse.
         */

        if (
            isUserReply(message)
        ) {
            return false;
        }


        /*
         * Seuls les messages individuels
         * envoyés par l'administration
         * peuvent recevoir une réponse.
         */

        if (
            message.type !== "user"
        ) {
            return false;
        }


        if (
            message.sender_type &&
            message.sender_type !== "admin"
        ) {
            return false;
        }


        const userId =
            getCurrentUserId();


        if (!userId) {
            return false;
        }


        /*
         * Sécurité supplémentaire :
         * le message doit appartenir
         * à l'utilisateur connecté.
         */

        if (
            Number(
                message.recipient_user_id
            ) !== Number(userId)
        ) {
            return false;
        }


        return true;
    }


    /* =====================================================
       PRIORITÉ
    ===================================================== */

    function priorityClass(priority) {

        const value =
            String(
                priority || "normal"
            ).toLowerCase();


        if (
            value === "urgent" ||
            value === "important"
        ) {

            return value;
        }


        return "normal";
    }


    function priorityLabel(priority) {

        switch (
            String(
                priority || "normal"
            ).toLowerCase()
        ) {

            case "urgent":
                return "Urgente";

            case "important":
                return "Importante";

            default:
                return "Normale";
        }
    }


    /* =====================================================
       MESSAGE NON LU
    ===================================================== */

    function isUnread(message) {

        const status =
            String(
                message?.status || ""
            ).toLowerCase();


        return (
            status !== "read" &&
            !message?.read_at
        );
    }


    /* =====================================================
       CHARGEMENT DES MESSAGES
    ===================================================== */

    async function loadMessages(
        selectFirst = false
    ) {

        const list =
            document.getElementById(
                "messageList"
            );


        if (!list) {
            return;
        }


        try {

            if (!currentUser) {

                list.innerHTML = `
                    <div class="empty-state"
                         style="min-height:350px;">

                        <div class="empty-icon">
                            <i class="fa-solid fa-user-lock"></i>
                        </div>

                        <h3>
                            Connexion requise
                        </h3>

                        <p>
                            Connectez-vous pour accéder
                            à votre messagerie.
                        </p>

                    </div>
                `;

                return;
            }


            const userId =
                getCurrentUserId();


            if (!userId) {

                throw new Error(
                    "Utilisateur invalide."
                );
            }


            const result =
                await apiRequest(
                    `/api/utilisateurs/${encodeURIComponent(userId)}/messages`
                );


            messages =
                extractMessages(result);


            messages =
                messages.filter(
                    message =>
                        message &&
                        message.id
                );


            messages.sort(
                (a, b) =>
                    new Date(
                        b.created_at || 0
                    ) -
                    new Date(
                        a.created_at || 0
                    )
            );


            renderMessageList();


            if (
                selectFirst &&
                messages.length > 0
            ) {

                openMessage(
                    messages[0].id
                );

            } else if (
                selectedMessage
            ) {

                const exists =
                    messages.find(
                        message =>
                            String(
                                message.id
                            ) ===
                            String(
                                selectedMessage.id
                            )
                    );


                if (exists) {

                    selectedMessage =
                        exists;

                    renderMessageDetail(
                        exists
                    );
                }
            }

        } catch (error) {

            console.error(
                "Erreur chargement messages :",
                error
            );


            list.innerHTML = `
                <div class="empty-state"
                     style="min-height:350px;">

                    <div class="empty-icon">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>

                    <h3>
                        Impossible de charger
                    </h3>

                    <p>
                        ${escapeHtml(
                            getApiError(
                                error,
                                "Une erreur est survenue."
                            )
                        )}
                    </p>

                    <button
                        type="button"
                        id="retryMessagesButton"
                        style="
                            margin-top:18px;
                            border:0;
                            background:#145a86;
                            color:white;
                            padding:10px 15px;
                            border-radius:9px;
                            cursor:pointer;
                        "
                    >
                        Réessayer
                    </button>

                </div>
            `;


            const retry =
                document.getElementById(
                    "retryMessagesButton"
                );


            if (retry) {

                retry.addEventListener(
                    "click",
                    function () {

                        loadMessages(
                            false
                        );

                    }
                );
            }
        }
    }


    /* =====================================================
       AFFICHAGE LISTE
    ===================================================== */

    function renderMessageList() {

        const list =
            document.getElementById(
                "messageList"
            );


        const count =
            document.getElementById(
                "messageCount"
            );


        if (!list) {
            return;
        }


        const unreadCount =
            messages.filter(
                isUnread
            ).length;


        if (count) {

            count.textContent =
                unreadCount;
        }


        if (!messages.length) {

            list.innerHTML = `
                <div class="empty-state"
                     style="min-height:350px;">

                    <div class="empty-icon">
                        <i class="fa-regular fa-envelope"></i>
                    </div>

                    <h3>
                        Aucun message
                    </h3>

                    <p>
                        Vous n'avez encore reçu
                        aucun message.
                    </p>

                </div>
            `;

            return;
        }


        list.innerHTML =
            messages
                .map(function(message) {

                    const official =
                        isOfficial(
                            message
                        );


                    const userReply =
                        isUserReply(
                            message
                        );


                    const unread =
                        isUnread(
                            message
                        );


                    const active =
                        selectedMessage &&
                        String(
                            selectedMessage.id
                        ) ===
                        String(
                            message.id
                        );


                    const title =
                        message.subject ||
                        "Sans objet";


                    const content =
                        message.content ||
                        message.message ||
                        "";


                    let icon =
                        "fa-user";


                    if (official) {

                        icon =
                            "fa-bullhorn";

                    } else if (userReply) {

                        icon =
                            "fa-reply";
                    }


                    let label = "";


                    if (official) {

                        label = `
                            <div class="official-label">
                                <i class="fa-solid fa-bullhorn"></i>
                                Annonce officielle
                            </div>
                        `;

                    } else if (userReply) {

                        label = `
                            <div class="individual-label">
                                <i class="fa-solid fa-reply"></i>
                                Votre réponse
                            </div>
                        `;

                    } else {

                        label = `
                            <div class="individual-label">
                                <i class="fa-solid fa-user"></i>
                                Message personnel
                            </div>
                        `;
                    }


                    return `

                        <div
                            class="
                                message-item
                                ${unread ? "unread" : ""}
                                ${active ? "active" : ""}
                            "

                            data-message-id="${escapeHtml(
                                message.id
                            )}"
                        >

                            <div class="message-item-top">

                                <div class="message-icon">

                                    <i class="fa-solid ${icon}"></i>

                                </div>


                                <div
                                    class="message-item-title"
                                >
                                    ${escapeHtml(
                                        title
                                    )}
                                </div>

                            </div>


                            <div class="message-date">

                                ${escapeHtml(
                                    formatDate(
                                        message.created_at
                                    )
                                )}

                            </div>


                            <div class="message-preview">

                                ${escapeHtml(
                                    content
                                )}

                            </div>


                            ${label}

                        </div>

                    `;

                })
                .join("");


        list
            .querySelectorAll(
                ".message-item"
            )
            .forEach(function(item) {

                item.addEventListener(
                    "click",
                    function() {

                        openMessage(
                            item.dataset.messageId
                        );

                    }
                );

            });
    }


    /* =====================================================
       OUVRIR MESSAGE
    ===================================================== */

    async function openMessage(id) {

        const message =
            messages.find(
                item =>
                    String(item.id) ===
                    String(id)
            );


        if (!message) {
            return;
        }


        selectedMessage =
            message;


        renderMessageList();

        renderMessageDetail(
            message
        );


        if (
            isUnread(message)
        ) {

            await markAsRead(
                message
            );
        }
    }


    /* =====================================================
       MARQUER COMME LU
    ===================================================== */

    async function markAsRead(
        message
    ) {

        const userId =
            getCurrentUserId();


        if (!userId) {
            return;
        }


        try {

            /*
             * Nouvelle route sécurisée
             * du serveur.
             */

            await apiRequest(
                `/api/utilisateurs/${encodeURIComponent(userId)}/messages/${encodeURIComponent(message.id)}/read`,
                {
                    method: "PATCH"
                }
            );


            message.status =
                "read";


            message.read_at =
                new Date().toISOString();


            renderMessageList();

        } catch (error) {

            console.warn(
                "Impossible de marquer le message comme lu :",
                error
            );
        }
    }


    /* =====================================================
       DÉTAIL MESSAGE
    ===================================================== */

    function renderMessageDetail(
        message
    ) {

        const detail =
            document.getElementById(
                "messageDetail"
            );


        if (!detail) {
            return;
        }


        const official =
            isOfficial(
                message
            );


        const userReply =
            isUserReply(
                message
            );


        const replyAllowed =
            canReplyToMessage(
                message
            );


        const priority =
            priorityClass(
                message.priority
            );


        const content =
            message.content ||
            message.message ||
            "";


        let sender = "Administration";


        if (official) {

            sender =
                "BMJ SERVICE";

        } else if (userReply) {

            sender =
                "Vous";

        } else {

            sender =
                message.sender_name ||
                message.sender_email ||
                "Administration";
        }


        let detailType =
            "MESSAGE PERSONNEL";


        let detailIcon =
            "fa-user";


        if (official) {

            detailType =
                "COMMUNICATION OFFICIELLE";

            detailIcon =
                "fa-bullhorn";

        } else if (userReply) {

            detailType =
                "VOTRE RÉPONSE";

            detailIcon =
                "fa-reply";
        }


        /* -------------------------------------------------
           BLOC BAS DE MESSAGE
        ------------------------------------------------- */

        let bottomContent = "";


        if (official) {

            bottomContent = `

                <div class="no-reply">

                    <i class="fa-solid fa-circle-info"></i>

                    <span>
                        Cette communication est officielle.
                        Vous ne pouvez pas répondre à cette annonce.
                    </span>

                </div>

            `;

        } else if (userReply) {

            bottomContent = `

                <div class="no-reply">

                    <i class="fa-solid fa-circle-check"></i>

                    <span>
                        Votre réponse a bien été envoyée
                        à l'administration.
                    </span>

                </div>

            `;

        } else if (replyAllowed) {

            bottomContent = `

                <div class="reply-box">

                    <div class="reply-info">

                        <i class="fa-solid fa-reply"></i>

                        <span>
                            Répondre à l'administration
                        </span>

                    </div>


                    <form
                        class="reply-form"
                        id="replyForm"
                    >

                        <textarea
                            id="replyContent"
                            placeholder="Écrivez votre réponse..."
                            maxlength="5000"
                            required
                        ></textarea>


                        <button
                            type="submit"
                            class="reply-btn"
                            id="replyButton"
                            title="Envoyer la réponse"
                        >

                            <i class="fa-solid fa-paper-plane"></i>

                        </button>

                    </form>

                </div>

            `;

        } else {

            bottomContent = `

                <div class="no-reply">

                    <i class="fa-solid fa-circle-info"></i>

                    <span>
                        Ce message ne peut pas recevoir de réponse.
                    </span>

                </div>

            `;
        }


        /* -------------------------------------------------
           AFFICHAGE
        ------------------------------------------------- */

        detail.innerHTML = `

            <div class="detail-header">

                <div class="detail-type ${
                    official
                        ? "official"
                        : "individual"
                }">

                    <i class="fa-solid ${detailIcon}"></i>

                    ${escapeHtml(
                        detailType
                    )}

                </div>


                <h2>

                    ${escapeHtml(
                        message.subject ||
                        "Sans objet"
                    )}

                </h2>


                <div class="detail-meta">

                    <span>

                        <i class="fa-solid fa-user"></i>

                        ${escapeHtml(
                            sender
                        )}

                    </span>


                    <span>

                        <i class="fa-regular fa-calendar"></i>

                        ${escapeHtml(
                            formatDate(
                                message.created_at
                            )
                        )}

                    </span>


                    <span
                        class="priority ${priority}"
                    >

                        ${escapeHtml(
                            priorityLabel(
                                message.priority
                            )
                        )}

                    </span>

                </div>

            </div>


            <div class="detail-body">

                <div class="message-content">

                    ${escapeHtml(
                        content
                    )}

                </div>

            </div>


            ${bottomContent}

        `;


        /* -------------------------------------------------
           FORMULAIRE DE RÉPONSE
        ------------------------------------------------- */

        if (replyAllowed) {

            const form =
                document.getElementById(
                    "replyForm"
                );


            if (form) {

                form.addEventListener(
                    "submit",
                    handleReply
                );
            }
        }
    }


    /* =====================================================
       RÉPONDRE À UN MESSAGE
    ===================================================== */

    async function handleReply(
        event
    ) {

        event.preventDefault();


        if (!selectedMessage) {

            showToast(
                "Aucun message sélectionné.",
                "error"
            );

            return;
        }


        /*
         * Vérification côté client.
         * Le serveur effectue également
         * ses propres vérifications.
         */

        if (
            !canReplyToMessage(
                selectedMessage
            )
        ) {

            showToast(
                isOfficial(
                    selectedMessage
                )
                    ? "Vous ne pouvez pas répondre à une annonce officielle."
                    : "Ce message ne peut pas recevoir de réponse.",
                "error"
            );

            return;
        }


        const textarea =
            document.getElementById(
                "replyContent"
            );


        const button =
            document.getElementById(
                "replyButton"
            );


        if (
            !textarea ||
            !button
        ) {

            return;
        }


        const content =
            textarea.value.trim();


        if (!content) {

            showToast(
                "Veuillez écrire votre réponse.",
                "error"
            );

            textarea.focus();

            return;
        }


        if (
            content.length > 5000
        ) {

            showToast(
                "Votre réponse est trop longue.",
                "error"
            );

            return;
        }


        const userId =
            getCurrentUserId();


        if (!userId) {

            showToast(
                "Utilisateur non identifié.",
                "error"
            );

            return;
        }


        const messageId =
            Number(
                selectedMessage.id
            );


        if (!messageId) {

            showToast(
                "Identifiant du message invalide.",
                "error"
            );

            return;
        }


        button.disabled =
            true;


        textarea.disabled =
            true;


        button.innerHTML =
            `
                <i class="fa-solid fa-spinner fa-spin"></i>
            `;


        try {

            /*
             * NOUVELLE ROUTE DU SERVEUR
             *
             * POST
             * /api/utilisateurs/:id/messages/:messageId/repondre
             */

            await apiRequest(
                `/api/utilisateurs/${encodeURIComponent(userId)}/messages/${encodeURIComponent(messageId)}/repondre`,
                {
                    method: "POST",

                    body: JSON.stringify({

                        content:
                            content

                    })
                }
            );


            textarea.value =
                "";


            showToast(
                "Votre réponse a été envoyée avec succès.",
                "success"
            );


            /*
             * Recharger les messages
             * pour afficher immédiatement
             * la réponse enregistrée.
             */

            await loadMessages(
                false
            );


        } catch (error) {

            console.error(
                "Erreur réponse message :",
                error
            );


            showToast(
                getApiError(
                    error,
                    "Impossible d'envoyer votre réponse."
                ),
                "error"
            );

        } finally {

            /*
             * Le formulaire peut avoir
             * disparu après le rechargement.
             */

            const newButton =
                document.getElementById(
                    "replyButton"
                );


            const newTextarea =
                document.getElementById(
                    "replyContent"
                );


            if (newButton) {

                newButton.disabled =
                    false;

                newButton.innerHTML =
                    `
                        <i class="fa-solid fa-paper-plane"></i>
                    `;
            }


            if (newTextarea) {

                newTextarea.disabled =
                    false;
            }
        }
    }


    /* =====================================================
       BOUTON RETOUR
    ===================================================== */

    const backButton =
        document.getElementById(
            "backButton"
        );


    if (backButton) {

        backButton.addEventListener(
            "click",
            function() {

                if (
                    history.length > 1
                ) {

                    history.back();

                } else {

                    window.location.href =
                        "index.html";
                }
            }
        );
    }


    /* =====================================================
       INITIALISATION
    ===================================================== */

    currentUser =
        getCurrentUser();


    if (!currentUser) {

        const list =
            document.getElementById(
                "messageList"
            );


        if (list) {

            list.innerHTML = `

                <div
                    class="empty-state"
                    style="min-height:350px;"
                >

                    <div class="empty-icon">

                        <i class="fa-solid fa-user-lock"></i>

                    </div>


                    <h3>
                        Connexion requise
                    </h3>


                    <p>
                        Connectez-vous à votre compte
                        pour consulter vos messages.
                    </p>

                </div>

            `;
        }

    } else {

        loadMessages(
            true
        );


        /* -------------------------------------------------
           ACTUALISATION AUTOMATIQUE
        ------------------------------------------------- */

        refreshTimer =
            setInterval(
                function() {

                    if (
                        document.visibilityState ===
                        "visible"
                    ) {

                        loadMessages(
                            false
                        );
                    }

                },
                60000
            );
    }


    /* =====================================================
       NETTOYAGE DU TIMER
    ===================================================== */

    window.addEventListener(
        "beforeunload",
        function() {

            if (refreshTimer) {

                clearInterval(
                    refreshTimer
                );

                refreshTimer =
                    null;
            }
        }
    );

});
</script>

</body>
</html>
