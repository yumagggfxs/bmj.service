<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messagerie | BMJ SERVICE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .topbar {
            height: 70px;
            background: #145a86;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 28px;

            box-shadow: 0 3px 15px rgba(0, 0, 0, .08);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255, 255, 255, .15);
        }

        .back-btn {
            border: none;
            background: rgba(255, 255, 255, .12);
            color: white;

            padding: 10px 15px;
            border-radius: 10px;

            display: flex;
            align-items: center;
            gap: 8px;

            transition: .2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, .22);
        }

        /* =====================================================
           PAGE
        ===================================================== */

        .page {
            width: min(1200px, calc(100% - 30px));
            margin: 30px auto;
        }

        .page-header {
            margin-bottom: 22px;
        }

        .page-header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .page-header p {
            color: #697586;
            font-size: 14px;
        }

        /* =====================================================
           LAYOUT
        ===================================================== */

        .messaging-layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;

            min-height: 650px;
        }

        .card {
            background: white;
            border-radius: 18px;

            box-shadow: 0 8px 30px rgba(20, 40, 70, .07);

            overflow: hidden;
        }

        /* =====================================================
           LISTE
        ===================================================== */

        .messages-header {
            padding: 20px;

            border-bottom: 1px solid #edf0f5;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .messages-header h2 {
            font-size: 17px;
        }

        .message-count {
            min-width: 26px;
            height: 26px;

            padding: 0 8px;

            border-radius: 20px;

            background: #145a86;
            color: white;

            font-size: 12px;
            font-weight: 700;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message-list {
            max-height: 590px;
            overflow-y: auto;
        }

        .message-item {
            padding: 17px 18px;

            border-bottom: 1px solid #edf0f5;

            cursor: pointer;

            transition: .2s;

            position: relative;
        }

        .message-item:hover {
            background: #f8fbff;
        }

        .message-item.active {
            background: #eef7ff;
            border-left: 4px solid #145a86;
        }

        .message-item.unread {
            background: #f7fbff;
        }

        .message-item.unread::after {
            content: "";

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #145a86;

            position: absolute;
            top: 20px;
            right: 18px;
        }

        .message-item-top {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 7px;
        }

        .message-icon {
            width: 36px;
            height: 36px;

            flex-shrink: 0;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #edf5fb;
            color: #145a86;
        }

        .message-item.unread .message-icon {
            background: #145a86;
            color: white;
        }

        .message-item-title {
            flex: 1;

            font-size: 13px;
            font-weight: 700;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message-date {
            color: #8993a4;
            font-size: 10px;
        }

        .message-preview {
            color: #697586;

            font-size: 12px;
            line-height: 1.5;

            margin-left: 46px;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;
        }

        .official-label {
            display: inline-flex;
            align-items: center;
            gap: 5px;

            margin-top: 8px;
            margin-left: 46px;

            padding: 4px 8px;

            border-radius: 6px;

            background: #fff5df;
            color: #a56b00;

            font-size: 9px;
            font-weight: 700;
        }

        .individual-label {
            display: inline-flex;
            align-items: center;
            gap: 5px;

            margin-top: 8px;
            margin-left: 46px;

            padding: 4px 8px;

            border-radius: 6px;

            background: #eaf7ef;
            color: #19713d;

            font-size: 9px;
            font-weight: 700;
        }

        /* =====================================================
           DETAIL
        ===================================================== */

        .message-detail {
            display: flex;
            flex-direction: column;

            min-width: 0;
        }

        .empty-state {
            flex: 1;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 40px;
        }

        .empty-icon {
            width: 85px;
            height: 85px;

            border-radius: 50%;

            background: #edf5fb;
            color: #145a86;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;

            margin-bottom: 18px;
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: #7b8797;
            font-size: 13px;
            max-width: 400px;
        }

        .detail-header {
            padding: 24px;

            border-bottom: 1px solid #edf0f5;
        }

        .detail-type {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 6px 10px;

            border-radius: 8px;

            font-size: 10px;
            font-weight: 700;

            margin-bottom: 13px;
        }

        .detail-type.official {
            background: #fff5df;
            color: #a56b00;
        }

        .detail-type.individual {
            background: #eaf7ef;
            color: #19713d;
        }

        .detail-header h2 {
            font-size: 21px;
            line-height: 1.35;

            margin-bottom: 10px;
        }

        .detail-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;

            color: #8993a4;

            font-size: 11px;
        }

        .detail-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .priority {
            padding: 4px 8px;
            border-radius: 6px;

            font-size: 9px;
            font-weight: 700;
        }

        .priority.normal {
            background: #edf1f5;
            color: #657182;
        }

        .priority.important {
            background: #fff4d7;
            color: #9a6800;
        }

        .priority.urgent {
            background: #ffe5e5;
            color: #c53030;
        }

        /* =====================================================
           CONTENU
        ===================================================== */

        .detail-body {
            flex: 1;

            padding: 28px;

            overflow-y: auto;

            background: #fbfcfe;
        }

        .message-content {
            background: white;

            border: 1px solid #edf0f5;

            border-radius: 14px;

            padding: 22px;

            font-size: 14px;
            line-height: 1.8;

            color: #374151;

            white-space: pre-wrap;

            word-break: break-word;
        }

        /* =====================================================
           REPONSE
        ===================================================== */

        .reply-box {
            padding: 18px 22px;

            background: white;

            border-top: 1px solid #edf0f5;
        }

        .reply-info {
            display: flex;
            align-items: center;
            gap: 8px;

            color: #697586;

            font-size: 11px;

            margin-bottom: 10px;
        }

        .reply-form {
            display: flex;
            gap: 10px;
        }

        .reply-form textarea {
            flex: 1;

            min-height: 48px;
            max-height: 130px;

            resize: vertical;

            border: 1px solid #dce2ea;
            border-radius: 11px;

            padding: 13px 15px;

            outline: none;

            font-size: 12px;

            transition: .2s;
        }

        .reply-form textarea:focus {
            border-color: #145a86;
            box-shadow: 0 0 0 3px rgba(20, 90, 134, .08);
        }

        .reply-btn {
            width: 50px;
            height: 48px;

            flex-shrink: 0;

            border: none;
            border-radius: 11px;

            background: #145a86;
            color: white;

            font-size: 17px;

            transition: .2s;
        }

        .reply-btn:hover {
            background: #0f4c73;
            transform: translateY(-1px);
        }

        .reply-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        /* =====================================================
           OFFICIAL NO REPLY
        ===================================================== */

        .no-reply {
            padding: 15px 22px;

            background: #fafbfc;

            border-top: 1px solid #edf0f5;

            color: #7b8797;

            font-size: 11px;

            display: flex;
            align-items: center;
            gap: 9px;
        }

        .no-reply i {
            color: #a56b00;
        }

        /* =====================================================
           LOADING
        ===================================================== */

        .loading {
            min-height: 250px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            color: #7b8797;

            font-size: 13px;
        }

        .spinner {
            width: 22px;
            height: 22px;

            border: 3px solid #e4e9ef;
            border-top-color: #145a86;

            border-radius: 50%;

            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =====================================================
           TOAST
        ===================================================== */

        .toast-container {
            position: fixed;

            right: 20px;
            bottom: 20px;

            z-index: 9999;

            display: flex;
            flex-direction: column;

            gap: 10px;
        }

        .toast {
            min-width: 280px;

            background: #172033;
            color: white;

            padding: 14px 17px;

            border-radius: 11px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, .18);

            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 12px;

            animation: toastIn .25s ease;
        }

        .toast.success i {
            color: #52d98b;
        }

        .toast.error i {
            color: #ff7777;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 850px) {

            .topbar {
                padding: 0 15px;
            }

            .brand {
                font-size: 16px;
            }

            .messaging-layout {
                grid-template-columns: 1fr;
            }

            .message-list {
                max-height: 400px;
            }

            .message-detail {
                min-height: 550px;
            }

            .page {
                width: calc(100% - 20px);
                margin: 20px auto;
            }

            .page-header h1 {
                font-size: 23px;
            }

            .detail-header {
                padding: 20px;
            }

            .detail-body {
                padding: 18px;
            }

            .reply-box {
                padding: 15px;
            }

            .back-btn span {
                display: none;
            }
        }

    </style>
</head>

<body>

<header class="topbar">

    <div class="brand">
        <div class="brand-icon">
            <i class="fa-solid fa-envelope"></i>
        </div>

        <span>BMJ SERVICE</span>
    </div>

    <button class="back-btn" id="backButton">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Retour</span>
    </button>

</header>


<main class="page">

    <div class="page-header">
        <h1>Ma messagerie</h1>

        <p>
            Retrouvez ici les annonces de BMJ SERVICE et les messages qui vous sont personnellement destinés.
        </p>
    </div>


    <div class="messaging-layout">

        <!-- =================================================
             LISTE DES MESSAGES
        ================================================== -->

        <div class="card">

            <div class="messages-header">

                <h2>Messages</h2>

                <div class="message-count" id="messageCount">
                    0
                </div>

            </div>

            <div class="message-list" id="messageList">

                <div class="loading">
                    <div class="spinner"></div>
                    Chargement...
                </div>

            </div>

        </div>


        <!-- =================================================
             DETAIL
        ================================================== -->

        <div class="card message-detail" id="messageDetail">

            <div class="empty-state">

                <div class="empty-icon">
                    <i class="fa-regular fa-envelope-open"></i>
                </div>

                <h3>Sélectionnez un message</h3>

                <p>
                    Choisissez un message dans votre boîte de réception
                    pour afficher son contenu.
                </p>

            </div>

        </div>

    </div>

</main>


<div class="toast-container" id="toastContainer"></div>


<script>

/* ============================================================
   BMJ SERVICE — MESSAGERIE UTILISATEUR
   ============================================================ */

document.addEventListener("DOMContentLoaded", function () {

    /* ========================================================
       CONFIGURATION
    ======================================================== */

    const API_URL =
        "https://back-end-h602.onrender.com";


    let currentUser = null;
    let currentMessages = [];
    let currentMessage = null;
    let refreshInterval = null;


    /* ========================================================
       ELEMENTS
    ======================================================== */

    const messagesContainer =
        document.getElementById(
            "messagesContainer"
        );

    const messageDetail =
        document.getElementById(
            "messageDetail"
        );

    const toastContainer =
        document.getElementById(
            "toastContainer"
        );


    /* ========================================================
       UTILISATEUR CONNECTÉ
    ======================================================== */

    function getCurrentUser() {

        const keys = [
            "bmj_current_user",
            "currentUser",
            "bmj_user",
            "user"
        ];

        for (const key of keys) {

            const raw =
                localStorage.getItem(key);

            if (!raw) {
                continue;
            }

            try {

                const user =
                    JSON.parse(raw);

                if (
                    user &&
                    (
                        user.id ||
                        user.user_id
                    )
                ) {

                    return user;

                }

            } catch (error) {

                console.error(
                    "Erreur localStorage :",
                    error
                );

            }
        }

        return null;
    }


    /* ========================================================
       ID UTILISATEUR
    ======================================================== */

    function getCurrentUserId() {

        if (!currentUser) {
            return null;
        }

        const id = Number(
            currentUser.id ||
            currentUser.user_id
        );

        if (
            !Number.isInteger(id) ||
            id <= 0
        ) {

            return null;

        }

        return id;
    }


    /* ========================================================
       SECURITÉ HTML
    ======================================================== */

    function escapeHTML(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* ========================================================
       DATE
    ======================================================== */

    function formatDate(value) {

        if (!value) {
            return "";
        }

        const date =
            new Date(value);

        if (
            isNaN(
                date.getTime()
            )
        ) {

            return "";

        }

        return date.toLocaleDateString(
            "fr-FR",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }
        );
    }


    /* ========================================================
       DATE + HEURE
    ======================================================== */

    function formatDateTime(value) {

        if (!value) {
            return "";
        }

        const date =
            new Date(value);

        if (
            isNaN(
                date.getTime()
            )
        ) {

            return "";

        }

        return date.toLocaleDateString(
            "fr-FR",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );
    }


    /* ========================================================
       TYPE MESSAGE
    ======================================================== */

    function isOfficial(message) {

        return (
            message &&
            message.type === "official"
        );
    }


    function isUserReply(message) {

        return (
            message &&
            message.type === "user_reply"
        );
    }


    function isIndividual(message) {

        return (
            message &&
            message.type === "user"
        );
    }


    /* ========================================================
       PEUT RÉPONDRE
    ======================================================== */

    function canReplyToMessage(message) {

        if (!message) {
            return false;
        }

        if (isOfficial(message)) {
            return false;
        }

        if (isUserReply(message)) {
            return false;
        }

        if (!isIndividual(message)) {
            return false;
        }

        if (
            message.sender_type &&
            message.sender_type !== "admin"
        ) {

            return false;

        }

        const userId =
            getCurrentUserId();

        if (!userId) {
            return false;
        }

        return (
            Number(
                message.recipient_user_id
            ) === Number(userId)
        );
    }


    /* ========================================================
       API
    ======================================================== */

    async function apiRequest(
        endpoint,
        options = {}
    ) {

        const controller =
            new AbortController();

        const timeout =
            setTimeout(
                function () {

                    controller.abort();

                },
                15000
            );


        try {

            const headers = {
                "Accept":
                    "application/json"
            };


            if (options.body) {

                headers[
                    "Content-Type"
                ] =
                    "application/json";

            }


            const response =
                await fetch(
                    `${API_URL}${endpoint}`,
                    {
                        ...options,
                        headers: {
                            ...headers,
                            ...(options.headers || {})
                        },
                        signal:
                            controller.signal
                    }
                );


            let data = null;


            try {

                data =
                    await response.json();

            } catch (error) {

                data = null;

            }


            if (!response.ok) {

                throw new Error(
                    data?.message ||
                    data?.error ||
                    `Erreur HTTP ${response.status}`
                );

            }


            return data;

        } finally {

            clearTimeout(timeout);

        }
    }


    /* ========================================================
       TOAST
    ======================================================== */

    function showToast(
        message,
        type = "info"
    ) {

        if (!toastContainer) {

            console.log(message);

            return;

        }


        const toast =
            document.createElement(
                "div"
            );


        toast.className =
            `bmj-toast ${type}`;


        let icon =
            "fa-circle-info";


        if (type === "success") {

            icon =
                "fa-circle-check";

        }


        if (type === "error") {

            icon =
                "fa-circle-xmark";

        }


        if (type === "warning") {

            icon =
                "fa-triangle-exclamation";

        }


        toast.innerHTML = `

            <div class="toast-icon">

                <i class="fa-solid ${icon}"></i>

            </div>

            <div class="toast-text">

                ${escapeHTML(message)}

            </div>

            <button
                type="button"
                class="toast-close"
            >

                <i class="fa-solid fa-xmark"></i>

            </button>

        `;


        toastContainer.appendChild(
            toast
        );


        requestAnimationFrame(
            function () {

                toast.classList.add(
                    "show"
                );

            }
        );


        const close =
            toast.querySelector(
                ".toast-close"
            );


        if (close) {

            close.addEventListener(
                "click",
                function () {

                    removeToast(toast);

                }
            );

        }


        setTimeout(
            function () {

                removeToast(toast);

            },
            4500
        );
    }


    function removeToast(toast) {

        if (!toast) {
            return;
        }

        toast.classList.remove(
            "show"
        );

        setTimeout(
            function () {

                if (
                    toast.parentNode
                ) {

                    toast.remove();

                }

            },
            300
        );
    }


    /* ========================================================
       CHARGEMENT INITIAL
       ======================================================== */

    function showInitialLoading() {

        if (!messagesContainer) {
            return;
        }


        messagesContainer.innerHTML = `

            <div class="message-loading">

                <div class="loading-spinner"></div>

                <span>
                    Chargement...
                </span>

            </div>

        `;
    }


    /* ========================================================
       PETIT INDICATEUR ACTUALISATION
       ======================================================== */

    function showRefreshing() {

        if (
            document.getElementById(
                "messagesRefreshing"
            )
        ) {

            return;

        }


        const indicator =
            document.createElement(
                "div"
            );


        indicator.id =
            "messagesRefreshing";


        indicator.innerHTML = `

            <i class="fa-solid fa-rotate fa-spin"></i>

            Actualisation...

        `;


        document.body.appendChild(
            indicator
        );
    }


    function hideRefreshing() {

        const indicator =
            document.getElementById(
                "messagesRefreshing"
            );


        if (indicator) {

            indicator.remove();

        }
    }


    /* ========================================================
       ERREUR
       ======================================================== */

    function showLoadError(
        errorMessage = ""
    ) {

        if (!messagesContainer) {
            return;
        }


        messagesContainer.innerHTML = `

            <div class="message-error">

                <div class="error-icon">

                    <i class="fa-regular fa-circle-xmark"></i>

                </div>

                <h3>
                    Impossible de charger les messages
                </h3>

                <p>
                    Une erreur est survenue.
                    Vérifiez votre connexion puis
                    réessayez.
                </p>

                <button
                    type="button"
                    id="retryMessagesBtn"
                    class="retry-btn"
                >

                    <i class="fa-solid fa-rotate-right"></i>

                    Réessayer

                </button>

            </div>

        `;


        console.error(
            "Erreur chargement messages :",
            errorMessage
        );


        const retry =
            document.getElementById(
                "retryMessagesBtn"
            );


        if (retry) {

            retry.addEventListener(
                "click",
                function () {

                    loadMessages();

                }
            );

        }
    }


    /* ========================================================
       CHARGER LES MESSAGES
       ======================================================== */

    async function loadMessages() {

        currentUser =
            getCurrentUser();


        const userId =
            getCurrentUserId();


        if (!userId) {

            showLoadError(
                "Utilisateur non connecté."
            );

            return;

        }


        /*
         * PREMIER CHARGEMENT
         */

        if (
            !currentMessages ||
            currentMessages.length === 0
        ) {

            showInitialLoading();

        } else {

            /*
             * IMPORTANT :
             * on garde les messages affichés
             * pendant l'actualisation.
             */

            showRefreshing();

        }


        try {

            const data =
                await apiRequest(
                    `/api/utilisateurs/${encodeURIComponent(userId)}/messages`,
                    {
                        method: "GET",
                        cache: "no-store"
                    }
                );


            console.log(
                "Messages serveur :",
                data
            );


            let messages = [];


            if (
                Array.isArray(data)
            ) {

                messages =
                    data;

            } else if (
                data &&
                Array.isArray(
                    data.messages
                )
            ) {

                messages =
                    data.messages;

            } else if (
                data &&
                Array.isArray(
                    data.data
                )
            ) {

                messages =
                    data.data;

            }


            currentMessages =
                messages;


            renderMessages(
                currentMessages
            );


            hideRefreshing();


        } catch (error) {

            console.error(
                "Erreur chargement :",
                error
            );


            hideRefreshing();


            /*
             * Si les anciens messages existent,
             * on les conserve.
             */

            if (
                currentMessages &&
                currentMessages.length > 0
            ) {

                showToast(
                    "Actualisation impossible. Vos messages restent disponibles.",
                    "warning"
                );

                return;

            }


            if (
                error.name ===
                "AbortError"
            ) {

                showLoadError(
                    "Le serveur met trop de temps à répondre."
                );

                return;

            }


            showLoadError(
                error.message
            );

        }
    }


    /* ========================================================
       AFFICHER LES MESSAGES
       ======================================================== */

    function renderMessages(
        messages
    ) {

        if (!messagesContainer) {
            return;
        }


        if (
            !Array.isArray(messages) ||
            messages.length === 0
        ) {

            messagesContainer.innerHTML = `

                <div class="messages-empty">

                    <div class="empty-icon">

                        <i class="fa-regular fa-envelope-open"></i>

                    </div>

                    <h3>
                        Aucun message
                    </h3>

                    <p>
                        Vous n'avez actuellement
                        aucun message.
                    </p>

                </div>

            `;

            return;
        }


        const sorted =
            [...messages].sort(
                function (a, b) {

                    return (
                        new Date(
                            b.created_at ||
                            b.date ||
                            0
                        ) -
                        new Date(
                            a.created_at ||
                            a.date ||
                            0
                        )
                    );

                }
            );


        messagesContainer.innerHTML =
            sorted
                .map(
                    function (message) {

                        return createMessageCard(
                            message
                        );

                    }
                )
                .join("");


        messagesContainer
            .querySelectorAll(
                "[data-message-id]"
            )
            .forEach(
                function (card) {

                    card.addEventListener(
                        "click",
                        function () {

                            openMessage(
                                Number(
                                    card.dataset.messageId
                                )
                            );

                        }
                    );

                }
            );
    }


    /* ========================================================
       CARTE MESSAGE
       ======================================================== */

    function createMessageCard(
        message
    ) {

        const id =
            Number(message.id);


        const official =
            isOfficial(message);


        const reply =
            isUserReply(message);


        const unread =
            message.status !== "read";


        let icon =
            "fa-user";


        let label =
            "Message personnel";


        if (official) {

            icon =
                "fa-bullhorn";

            label =
                "Annonce officielle";

        } else if (reply) {

            icon =
                "fa-reply";

            label =
                "Votre réponse";

        }


        let priority =
            message.priority ||
            "normal";


        let priorityLabel =
            "Normal";


        if (
            priority ===
            "important"
        ) {

            priorityLabel =
                "Important";

        }


        if (
            priority ===
            "urgent"
        ) {

            priorityLabel =
                "Urgent";

        }


        return `

            <article
                class="
                    message-card
                    ${unread ? "unread" : ""}
                    ${official ? "official" : ""}
                    ${reply ? "user-reply" : ""}
                "
                data-message-id="${id}"
            >

                <div class="message-card-icon">

                    <i class="fa-solid ${icon}"></i>

                </div>


                <div class="message-card-content">

                    <div class="message-card-top">

                        <span class="message-type">

                            ${escapeHTML(label)}

                        </span>


                        ${
                            unread
                            ? `
                                <span class="unread-dot">
                                    Nouveau
                                </span>
                            `
                            : ""
                        }

                    </div>


                    <h3 class="message-subject">

                        ${escapeHTML(
                            message.subject ||
                            "Sans objet"
                        )}

                    </h3>


                    <p class="message-preview">

                        ${escapeHTML(
                            truncateText(
                                message.content ||
                                "",
                                120
                            )
                        )}

                    </p>


                    <div class="message-card-bottom">

                        <span class="message-date">

                            <i class="fa-regular fa-clock"></i>

                            ${formatDate(
                                message.created_at ||
                                message.date
                            )}

                        </span>


                        <span
                            class="
                                priority-badge
                                ${escapeHTML(priority)}
                            "
                        >

                            ${escapeHTML(
                                priorityLabel
                            )}

                        </span>

                    </div>

                </div>


                <div class="message-card-arrow">

                    <i class="fa-solid fa-chevron-right"></i>

                </div>

            </article>

        `;
    }


    /* ========================================================
       TRONQUER TEXTE
       ======================================================== */

    function truncateText(
        text,
        length
    ) {

        text =
            String(text || "");


        if (
            text.length <= length
        ) {

            return text;

        }


        return (
            text.substring(
                0,
                length
            ) + "..."
        );
    }


    /* ========================================================
       OUVRIR MESSAGE
       ======================================================== */

    async function openMessage(
        messageId
    ) {

        const message =
            currentMessages.find(
                function (item) {

                    return (
                        Number(item.id) ===
                        Number(messageId)
                    );

                }
            );


        if (!message) {

            showToast(
                "Message introuvable.",
                "error"
            );

            return;

        }


        currentMessage =
            message;


        renderMessageDetail(
            message
        );


        if (
            message.status !==
            "read"
        ) {

            await markMessageAsRead(
                message.id
            );

        }
    }


    /* ========================================================
       DETAIL MESSAGE
       ======================================================== */

    function renderMessageDetail(
        message
    ) {

        if (!messageDetail) {
            return;
        }


        const official =
            isOfficial(message);


        const reply =
            isUserReply(message);


        const canReply =
            canReplyToMessage(
                message
            );


        let type =
            "Message personnel";


        let icon =
            "fa-user";


        if (official) {

            type =
                "Communication officielle";

            icon =
                "fa-bullhorn";

        } else if (reply) {

            type =
                "Votre réponse";

            icon =
                "fa-reply";

        }


        messageDetail.innerHTML = `

            <div class="message-detail-header">

                <button
                    type="button"
                    id="closeMessageDetail"
                    class="message-back-btn"
                >

                    <i class="fa-solid fa-arrow-left"></i>

                    Retour

                </button>


                <div class="message-detail-type">

                    <i class="fa-solid ${icon}"></i>

                    ${escapeHTML(type)}

                </div>

            </div>


            <div class="message-detail-body">

                <div class="message-detail-icon">

                    <i class="fa-solid ${icon}"></i>

                </div>


                <div class="message-detail-meta">

                    <span>

                        <i class="fa-regular fa-calendar"></i>

                        ${formatDateTime(
                            message.created_at ||
                            message.date
                        )}

                    </span>

                </div>


                <h2 class="detail-subject">

                    ${escapeHTML(
                        message.subject ||
                        "Sans objet"
                    )}

                </h2>


                <div class="detail-content">

                    ${escapeHTML(
                        message.content ||
                        ""
                    ).replace(
                        /\n/g,
                        "<br>"
                    )}

                </div>


                ${
                    official
                    ? `

                        <div class="no-reply-box official-box">

                            <i class="fa-solid fa-bullhorn"></i>

                            <div>

                                <strong>
                                    Communication officielle
                                </strong>

                                <p>
                                    Ce message est une
                                    communication officielle
                                    de BMJ SERVICE.
                                    Les annonces officielles
                                    ne peuvent pas recevoir
                                    de réponse.
                                </p>

                            </div>

                        </div>

                    `
                    : ""
                }


                ${
                    reply
                    ? `

                        <div class="no-reply-box reply-box">

                            <i class="fa-solid fa-check"></i>

                            <div>

                                <strong>
                                    Réponse envoyée
                                </strong>

                                <p>
                                    Votre réponse a été
                                    transmise à
                                    l'administration.
                                </p>

                            </div>

                        </div>

                    `
                    : ""
                }


                ${
                    canReply
                    ? createReplyForm()
                    : ""
                }

            </div>

        `;


        messageDetail.classList.add(
            "active"
        );


        const closeButton =
            document.getElementById(
                "closeMessageDetail"
            );


        if (closeButton) {

            closeButton.addEventListener(
                "click",
                closeMessageDetail
            );

        }


        if (canReply) {

            const form =
                document.getElementById(
                    "messageReplyForm"
                );


            if (form) {

                form.addEventListener(
                    "submit",
                    handleReply
                );

            }

        }
    }


    /* ========================================================
       FORMULAIRE RÉPONSE
       ======================================================== */

    function createReplyForm() {

        return `

            <div class="reply-section">

                <div class="reply-title">

                    <i class="fa-solid fa-reply"></i>

                    Répondre à ce message

                </div>


                <form
                    id="messageReplyForm"
                    class="reply-form"
                >

                    <textarea
                        id="replyContent"
                        rows="5"
                        maxlength="5000"
                        placeholder="Écrivez votre réponse..."
                        required
                    ></textarea>


                    <div class="reply-bottom">

                        <span class="reply-limit">

                            Maximum 5000 caractères

                        </span>


                        <button
                            type="submit"
                            id="sendReplyBtn"
                            class="send-reply-btn"
                        >

                            <i class="fa-solid fa-paper-plane"></i>

                            Envoyer la réponse

                        </button>

                    </div>

                </form>

            </div>

        `;
    }


    /* ========================================================
       ENVOYER RÉPONSE
       ======================================================== */

    async function handleReply(
        event
    ) {

        event.preventDefault();


        const userId =
            getCurrentUserId();


        if (!userId) {

            showToast(
                "Utilisateur non connecté.",
                "error"
            );

            return;

        }


        if (
            !currentMessage ||
            !canReplyToMessage(
                currentMessage
            )
        ) {

            showToast(
                "Vous ne pouvez pas répondre à ce message.",
                "warning"
            );

            return;

        }


        const textarea =
            document.getElementById(
                "replyContent"
            );


        const button =
            document.getElementById(
                "sendReplyBtn"
            );


        if (!textarea) {
            return;
        }


        const content =
            textarea.value.trim();


        if (!content) {

            showToast(
                "Écrivez votre réponse.",
                "warning"
            );

            textarea.focus();

            return;

        }


        if (
            content.length > 5000
        ) {

            showToast(
                "Votre réponse est trop longue.",
                "warning"
            );

            return;

        }


        if (button) {

            button.disabled =
                true;


            button.innerHTML = `

                <i class="fa-solid fa-spinner fa-spin"></i>

                Envoi...

            `;
        }


        try {

            await apiRequest(
                `/api/utilisateurs/${encodeURIComponent(userId)}/messages/${encodeURIComponent(currentMessage.id)}/repondre`,
                {
                    method: "POST",

                    body: JSON.stringify({
                        content: content
                    })
                }
            );


            showToast(
                "Votre réponse a été envoyée.",
                "success"
            );


            closeMessageDetail();


            /*
             * Rechargement en arrière-plan.
             */

            await loadMessages();


        } catch (error) {

            console.error(
                "Erreur réponse :",
                error
            );


            showToast(
                error.message ||
                "Impossible d'envoyer la réponse.",
                "error"
            );


            if (button) {

                button.disabled =
                    false;


                button.innerHTML = `

                    <i class="fa-solid fa-paper-plane"></i>

                    Envoyer la réponse

                `;

            }
        }
    }


    /* ========================================================
       MARQUER COMME LU
       ======================================================== */

    async function markMessageAsRead(
        messageId
    ) {

        const userId =
            getCurrentUserId();


        if (!userId) {
            return;
        }


        try {

            await apiRequest(
                `/api/utilisateurs/${encodeURIComponent(userId)}/messages/${encodeURIComponent(messageId)}/read`,
                {
                    method: "PATCH"
                }
            );


            const message =
                currentMessages.find(
                    function (item) {

                        return (
                            Number(item.id) ===
                            Number(messageId)
                        );

                    }
                );


            if (message) {

                message.status =
                    "read";

            }


        } catch (error) {

            console.error(
                "Erreur lecture message :",
                error
            );

        }
    }


    /* ========================================================
       FERMER DETAIL
       ======================================================== */

    function closeMessageDetail() {

        if (!messageDetail) {
            return;
        }


        messageDetail.classList.remove(
            "active"
        );


        currentMessage =
            null;
    }


    /* ========================================================
       BOUTON RETOUR
       ======================================================== */

    const backButton =
        document.getElementById(
            "backButton"
        );


    if (backButton) {

        backButton.addEventListener(
            "click",
            function () {

                if (
                    window.history.length > 1
                ) {

                    window.history.back();

                } else {

                    window.location.href =
                        "index.html";

                }

            }
        );

    }


    /* ========================================================
       INITIALISATION
       ======================================================== */

    currentUser =
        getCurrentUser();


    if (!currentUser) {

        showLoadError(
            "Utilisateur non connecté."
        );

        return;

    }


    if (!getCurrentUserId()) {

        showLoadError(
            "ID utilisateur invalide."
        );

        return;

    }


    /*
     * PREMIER CHARGEMENT
     */

    loadMessages();


    /* ========================================================
       ACTUALISATION AUTOMATIQUE
       ======================================================== */

    refreshInterval =
        setInterval(
            function () {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    /*
                     * Ne pas bloquer l'utilisateur
                     * pendant l'actualisation.
                     */

                    loadMessages();

                }

            },
            60000
        );


    /* ========================================================
       RETOUR SUR LA PAGE
       ======================================================== */

    document.addEventListener(
        "visibilitychange",
        function () {

            if (
                document.visibilityState ===
                "visible"
            ) {

                loadMessages();

            }

        }
    );


    /* ========================================================
       NETTOYAGE
       ======================================================== */

    window.addEventListener(
        "beforeunload",
        function () {

            if (refreshInterval) {

                clearInterval(
                    refreshInterval
                );

            }

        }
    );


    /* ========================================================
       DEBUG
       ======================================================== */

    window.BMJMessages = {

        loadMessages:
            loadMessages,

        getCurrentUser:
            getCurrentUser,

        getCurrentUserId:
            getCurrentUserId,

        openMessage:
            openMessage,

        closeMessageDetail:
            closeMessageDetail

    };

});

</script>
</body>
</html>
