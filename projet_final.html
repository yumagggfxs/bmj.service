<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>projet</title>
    <style>
/*==================================================
        BMJ SERVICE
        PROJET FINAL ENTREPRENEURIAT
        STYLE DE VÉRIFICATION
==================================================*/


/*====================================
        RESET
====================================*/

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}


html{

    scroll-behavior:smooth;

}


body{

    font-family:"Segoe UI", Arial, sans-serif;

    background:#f4f7fb;

    color:#17202a;

    min-height:100vh;

}



/*====================================
        HEADER
====================================*/

header{

    width:100%;

    min-height:75px;

    padding:12px 6%;

    background:#ffffff;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-bottom:1px solid #e5eaf0;

    box-shadow:0 3px 15px rgba(0,0,0,0.06);

    position:relative;

    z-index:10;

}


/* LOGO */

.logo{

    display:flex;

    align-items:center;

    gap:12px;

}


.logo img{

    width:48px;

    height:48px;

    object-fit:cover;

    border-radius:50%;

}


.logo h2{

    font-size:22px;

    color:#145a86;

    letter-spacing:0.5px;

}


.logo h2 span{

    color:#f5b700;

}



/* UTILISATEUR */

.course-user{

    display:flex;

    align-items:center;

    gap:12px;

}


.course-user img{

    width:45px;

    height:45px;

    border-radius:50%;

    object-fit:cover;

    border:2px solid #145a86;

}


.course-user h4{

    font-size:15px;

    color:#1c2733;

    margin-bottom:3px;

}


.course-user small{

    font-size:12px;

    color:#7b8794;

}



/*====================================
        CONTENEUR
====================================*/

.verification-container{

    width:100%;

    min-height:

        calc(100vh - 75px);

    display:flex;

    align-items:center;

    justify-content:center;

    padding:50px 20px;

}



/*====================================
        CARTE
====================================*/

.verification-card{

    width:100%;

    max-width:760px;

    background:#ffffff;

    border-radius:22px;

    padding:45px;

    text-align:center;

    box-shadow:

        0 15px 45px rgba(20,90,134,0.10);

    border:1px solid #e8edf3;

    position:relative;

    overflow:hidden;

}



/* ligne supérieure */

.verification-card::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:5px;

    background:

        linear-gradient(

            90deg,

            #145a86,

            #f5b700

        );

}



/*====================================
        ICÔNE PRINCIPALE
====================================*/

.verification-icon{

    width:90px;

    height:90px;

    margin:0 auto 25px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#eef5fa;

    color:#145a86;

    font-size:38px;

}


.verification-icon i{

    line-height:1;

}



/* SUCCÈS */

.success-icon{

    background:#e9f9ef;

    color:#16803c;

}


/* ERREUR */

.error-icon{

    background:#fff0f0;

    color:#d62828;

}



/*====================================
        TITRE
====================================*/

#titreVerification{

    font-size:30px;

    color:#145a86;

    margin-bottom:12px;

    font-weight:700;

}


#messageVerification{

    max-width:600px;

    margin:0 auto;

    color:#687585;

    font-size:16px;

    line-height:1.7;

}



/*====================================
        DÉTAILS
====================================*/

.verification-details{

    margin-top:30px;

    display:flex;

    flex-direction:column;

    gap:10px;

    text-align:left;

}


.verification-line{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    padding:14px 17px;

    background:#f8fafc;

    border:1px solid #e8edf2;

    border-radius:12px;

    transition:0.25s;

}


.verification-line:hover{

    transform:translateY(-2px);

    box-shadow:

        0 5px 15px rgba(0,0,0,0.05);

}


.verification-line span{

    display:flex;

    align-items:center;

    gap:10px;

    color:#354250;

    font-size:14px;

    font-weight:500;

}


.verification-line span i{

    color:#145a86;

}


.verification-line strong{

    font-size:12px;

    padding:6px 11px;

    border-radius:20px;

    white-space:nowrap;

}



/* STATUTS */

.ok{

    background:#e8f8ee;

    color:#16803c;

}


.error{

    background:#ffeded;

    color:#c62828;

}


.pending{

    background:#fff7df;

    color:#9a7100;

}



/*====================================
        PROGRESSION
====================================*/

.verification-progress{

    margin-top:30px;

}


.progress-track{

    width:100%;

    height:9px;

    background:#e8edf2;

    border-radius:20px;

    overflow:hidden;

}


.progress-bar{

    width:0%;

    height:100%;

    border-radius:20px;

    background:

        linear-gradient(

            90deg,

            #145a86,

            #f5b700

        );

    transition:

        width 0.7s ease;

}


#progressText{

    display:block;

    margin-top:10px;

    font-size:13px;

    color:#7a8794;

}



/*====================================
        ZONE ACTION
====================================*/

.verification-action{

    margin-top:30px;

}



/*====================================
        MESSAGE ERREUR
====================================*/

.error-message{

    padding:20px;

    border-radius:14px;

    background:#fff5f5;

    border:1px solid #ffd6d6;

    color:#7c2525;

    line-height:1.7;

    font-size:14px;

    text-align:left;

}


.error-message strong{

    color:#b71c1c;

}



/*====================================
        MESSAGE SUCCÈS
====================================*/

.success-message{

    padding:20px;

    border-radius:14px;

    background:#f0fbf4;

    border:1px solid #c9efd5;

    color:#27663a;

    line-height:1.7;

    font-size:14px;

}


.success-message strong{

    color:#16803c;

    font-size:17px;

}



/*====================================
        BOUTONS
====================================*/

.verification-action button{

    border:none;

    cursor:pointer;

    font-family:inherit;

    font-weight:600;

    transition:

        transform 0.25s,

        box-shadow 0.25s;

}



/* RETOUR */

.btn-retour{

    margin-top:18px;

    padding:13px 22px;

    background:#edf2f6;

    color:#40515f;

    border-radius:10px;

}


.btn-retour:hover{

    transform:translateY(-2px);

    box-shadow:

        0 7px 18px rgba(0,0,0,0.08);

}



/* PREMIUM */

.btn-premium{

    margin-top:5px;

    padding:13px 24px;

    background:#f5b700;

    color:#171717;

    border-radius:25px;

    box-shadow:

        0 7px 20px rgba(245,183,0,0.25);

}


.btn-premium:hover{

    transform:translateY(-2px);

    box-shadow:

        0 10px 25px rgba(245,183,0,0.35);

}



/* CERTIFICAT */

.btn-certificat{

    padding:14px 28px;

    background:#145a86;

    color:#ffffff;

    border-radius:25px;

    box-shadow:

        0 8px 22px rgba(20,90,134,0.25);

}


.btn-certificat:hover{

    transform:translateY(-3px);

    box-shadow:

        0 12px 28px rgba(20,90,134,0.35);

}


.btn-certificat i{

    margin-right:7px;

}



/*====================================
        ANIMATION
====================================*/

@keyframes apparition{

    from{

        opacity:0;

        transform:translateY(20px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}


.verification-card{

    animation:

        apparition 0.6s ease;

}



/*====================================
        TABLETTE
====================================*/

@media(max-width:768px){

    header{

        padding:12px 4%;

    }


    .logo h2{

        font-size:19px;

    }


    .logo img{

        width:42px;

        height:42px;

    }


    .course-user img{

        width:40px;

        height:40px;

    }


    .course-user h4{

        font-size:13px;

    }


    .course-user small{

        font-size:11px;

    }


    .verification-container{

        padding:30px 15px;

        align-items:flex-start;

    }


    .verification-card{

        padding:35px 22px;

        margin-top:20px;

    }


    #titreVerification{

        font-size:25px;

    }


    #messageVerification{

        font-size:14px;

    }

}



/*====================================
        MOBILE
====================================*/

@media(max-width:520px){

    header{

        min-height:68px;

        padding:10px 15px;

    }


    .logo{

        gap:8px;

    }


    .logo img{

        width:38px;

        height:38px;

    }


    .logo h2{

        font-size:16px;

    }


    .course-user{

        gap:7px;

    }


    .course-user img{

        width:36px;

        height:36px;

    }


    .course-user h4{

        font-size:11px;

    }


    .course-user small{

        display:none;

    }


    .verification-container{

        min-height:

            calc(100vh - 68px);

        padding:20px 12px;

    }


    .verification-card{

        padding:30px 15px;

        border-radius:18px;

    }


    .verification-icon{

        width:75px;

        height:75px;

        font-size:30px;

        margin-bottom:20px;

    }


    #titreVerification{

        font-size:22px;

    }


    #messageVerification{

        font-size:13px;

    }


    .verification-line{

        padding:12px;

        flex-direction:column;

        align-items:flex-start;

        gap:8px;

    }


    .verification-line strong{

        align-self:flex-start;

    }


    .error-message,
    .success-message{

        font-size:13px;

        padding:16px;

    }


    .btn-premium,
    .btn-certificat,
    .btn-retour{

        width:100%;

    }

}

    </style>
</head>

<body>

    <!--================================
        HEADER
    =================================-->

    <header>

        <div class="logo">

            <img src="images/logo.png" alt="BMJ SERVICE">

            <h2>
                BMJ <span>SERVICE</span>
            </h2>

        </div>


        <div class="course-user">

            <img
                id="photoUtilisateur"
                src="images/user.png"
                alt="Utilisateur"
            >

            <div>

                <h4 id="nomUtilisateur">
                    Vérification...
                </h4>

                <small>
                    Entrepreneuriat
                </small>

            </div>

        </div>

    </header>



    <!--================================
        CONTENU
    =================================-->

    <main class="verification-container">


        <section class="verification-card">


            <div class="verification-icon" id="verificationIcon">

                <i class="fa-solid fa-spinner fa-spin"></i>

            </div>


            <h1 id="titreVerification">

                Vérification du parcours

            </h1>


            <p id="messageVerification">

                Le système vérifie automatiquement
                votre progression...

            </p>



            <!--================================
                DETAILS
            =================================-->

            <div
                class="verification-details"
                id="verificationDetails"
            >

            </div>



            <!--================================

            =================================-->

            <div
                class="verification-progress"
                id="verificationProgress"
            >

                <div class="progress-track">

                    <div
                        id="verificationProgressBar"
                        class="progress-bar"
                    ></div>

                </div>

                <span id="progressText">
                    Vérification : 0%
                </span>

            </div>



            <!--================================
                ACTION
            =================================-->

            <div
                class="verification-action"
                id="verificationAction"
            >

            </div>


        </section>


    </main>



    <!--================================
        JAVASCRIPT
    =================================-->
<script>

/*==================================================
        BMJ SERVICE
        FORMATION ENTREPRENEURIAT
        PROGRESSION PAR UTILISATEUR
==================================================*/


//==================================================
// CONFIGURATION DES 4 COURS
//==================================================

const coursEntrepreneuriat = [

    {
        id: "introduction_entrepreneuriat",
        nom: "Introduction à l'entrepreneuriat",
        fichier: "introduction_entrepreneuriat.html"
    },

    {
        id: "idee_entreprise",
        nom: "Trouver une idée d'entreprise",
        fichier: "idee_entreprise.html"
    },

    {
        id: "business_model",
        nom: "Construire son Business Model",
        fichier: "business_model.html"
    },

    {
        id: "lancer_entreprise",
        nom: "Lancer son entreprise",
        fichier: "lancer_entreprise.html"
    }

];


//==================================================
// RÉCUPÉRER L'UTILISATEUR CONNECTÉ
//==================================================

function obtenirUtilisateur() {

    try {

        return JSON.parse(
            localStorage.getItem("bmj_current_user")
        );

    }

    catch (erreur) {

        return null;

    }

}


//==================================================
// CLÉ DE PROGRESSION DE L'UTILISATEUR
//==================================================

function obtenirCleProgression() {

    const utilisateur = obtenirUtilisateur();

    if (!utilisateur || !utilisateur.id_bmj) {

        return null;

    }

    return (
        "entrepreneuriat_progression_" +
        utilisateur.id_bmj
    );

}


//==================================================
// RÉCUPÉRER LA PROGRESSION
//==================================================

function recupererProgression() {

    const cle = obtenirCleProgression();

    if (!cle) {

        return [];

    }


    try {

        let progression = JSON.parse(
            localStorage.getItem(cle)
        ) || [];


        if (!Array.isArray(progression)) {

            return [];

        }


        // Supprimer doublons

        progression = [
            ...new Set(progression)
        ];


        // Garder uniquement les 4 vrais cours

        progression = progression.filter(
            function(id) {

                return coursEntrepreneuriat.some(
                    function(cours) {

                        return cours.id === id;

                    }
                );

            }
        );


        return progression;

    }

    catch(erreur) {

        console.error(
            "Erreur récupération progression :",
            erreur
        );

        return [];

    }

}


//==================================================
// SAUVEGARDER LA PROGRESSION
//==================================================

function sauvegarderProgression(progression) {

    const cle = obtenirCleProgression();

    if (!cle) {

        return;

    }


    localStorage.setItem(

        cle,

        JSON.stringify(progression)

    );

}


//==================================================
// AFFICHER L'UTILISATEUR
//==================================================

function afficherUtilisateur() {

    const utilisateur =
        obtenirUtilisateur();


    if (!utilisateur) {

        return;

    }


    const nom =
        document.getElementById(
            "nomUtilisateur"
        );


    const photo =
        document.getElementById(
            "photoUtilisateur"
        );


    const domaine =
        document.getElementById(
            "domaineUtilisateur"
        );


    if (nom) {

        nom.textContent =
            utilisateur.nom ||
            "Apprenant";

    }


    if (photo) {

        photo.src =
            utilisateur.photo ||
            "images/user.png";

    }


    if (domaine) {

        domaine.textContent =
            utilisateur.domaine ||
            "Entrepreneuriat";

    }

}


//==================================================
// CALCULER LA PROGRESSION
//==================================================

function calculerPourcentage() {

    const progression =
        recupererProgression();


    const total =
        coursEntrepreneuriat.length;


    if (total === 0) {

        return 0;

    }


    return Math.round(
        (progression.length / total) * 100
    );

}


//==================================================
// AFFICHER LA PROGRESSION
//==================================================

function afficherProgression() {

    const progression =
        recupererProgression();


    const total =
        coursEntrepreneuriat.length;


    const termines =
        progression.length;


    const pourcentage =
        calculerPourcentage();


    //==============================================
    // BARRE
    //==============================================

    const progressBar =
        document.getElementById(
            "progressBar"
        );


    if (progressBar) {

        progressBar.style.width =
            pourcentage + "%";

    }


    //==============================================
    // POURCENTAGE
    //==============================================

    const progressValue =
        document.getElementById(
            "progressValue"
        );


    if (progressValue) {

        progressValue.textContent =
            pourcentage;

    }


    //==============================================
    // TEXTE
    //==============================================

    const progressText =
        document.getElementById(
            "progressText"
        );


    if (progressText) {

        progressText.textContent =
            termines +
            "/" +
            total +
            " cours terminés";

    }


    //==============================================
    // SAUVEGARDE DANS L'UTILISATEUR
    //==============================================

    const utilisateur =
        obtenirUtilisateur();


    if (utilisateur) {

        utilisateur.entrepreneuriatProgression =
            pourcentage;


        localStorage.setItem(

            "bmj_current_user",

            JSON.stringify(
                utilisateur
            )

        );

    }

}


//==================================================
// MARQUER UN COURS TERMINÉ
//==================================================

function marquerCoursTermine(idCours) {

    if (!idCours) {

        console.error(
            "ID du cours manquant."
        );

        return;

    }


    const utilisateur =
        obtenirUtilisateur();


    if (!utilisateur) {

        alert(
            "⚠️ Vous devez être connecté."
        );

        window.location.href =
            "connexion.html";

        return;

    }


    //==============================================
    // VÉRIFIER LE COURS
    //==============================================

    const existe =
        coursEntrepreneuriat.some(
            function(cours) {

                return cours.id === idCours;

            }
        );


    if (!existe) {

        console.error(
            "Cours inconnu :",
            idCours
        );

        return;

    }


    //==============================================
    // PROGRESSION DE CET UTILISATEUR
    //==============================================

    let progression =
        recupererProgression();


    if (!progression.includes(idCours)) {

        progression.push(idCours);

    }


    //==============================================
    // SAUVEGARDER
    //==============================================

    sauvegarderProgression(
        progression
    );


    //==============================================
    // CALCUL
    //==============================================

    const pourcentage =
        calculerPourcentage();


    utilisateur.entrepreneuriatProgression =
        pourcentage;


    //==============================================
    // SAUVEGARDER UTILISATEUR
    //==============================================

    localStorage.setItem(

        "bmj_current_user",

        JSON.stringify(
            utilisateur
        )

    );


    //==============================================
    // BMJ UTILISATEURS
    //==============================================

    let utilisateurs = [];


    try {

        utilisateurs =
            JSON.parse(
                localStorage.getItem(
                    "bmjUtilisateurs"
                )
            ) || [];

    }

    catch(erreur) {

        utilisateurs = [];

    }


    const index =
        utilisateurs.findIndex(
            function(user) {

                return (
                    user.id_bmj ===
                    utilisateur.id_bmj
                );

            }
        );


    if (index !== -1) {

        utilisateurs[index] =
            utilisateur;


        localStorage.setItem(

            "bmjUtilisateurs",

            JSON.stringify(
                utilisateurs
            )

        );

    }


    //==============================================
    // ACTUALISER
    //==============================================

    afficherProgression();

    afficherStatutCours();


    console.log(
        "Utilisateur :",
        utilisateur.id_bmj
    );


    console.log(
        "Cours terminé :",
        idCours
    );


    console.log(
        "Progression :",
        progression
    );


    console.log(
        "Pourcentage :",
        pourcentage + "%"
    );

}


//==================================================
// VÉRIFIER UN COURS
//==================================================

function coursTermine(idCours) {

    return recupererProgression()
        .includes(idCours);

}


//==================================================
// AFFICHER STATUT DES CARTES
//==================================================

function afficherStatutCours() {

    const progression =
        recupererProgression();


    const cartes =
        document.querySelectorAll(
            ".chapitre-card"
        );


    cartes.forEach(
        function(carte, index) {

            const cours =
                coursEntrepreneuriat[index];


            if (!cours) {

                return;

            }


            const bouton =
                carte.querySelector(
                    "button"
                );


            if (
                progression.includes(
                    cours.id
                )
            ) {

                carte.classList.add(
                    "termine"
                );


                if (bouton) {

                    bouton.innerHTML =
                        "✓ Terminé";

                }

            }

            else {

                carte.classList.remove(
                    "termine"
                );


                if (bouton) {

                    bouton.innerHTML =
                        "Commencer";

                }

            }

        }
    );

}


//==================================================
// OUVRIR UN COURS
//==================================================

function ouvrirCours(fichier) {

    if (!fichier) {

        alert(
            "❌ Le cours demandé est introuvable."
        );

        return;

    }


    window.location.href =
        fichier;

}


//==================================================
// COMMENCER LA FORMATION
//==================================================

function commencerFormation() {

    ouvrirCours(
        "introduction_entrepreneuriat.html"
    );

}


//==================================================
// ACCÉDER À UN COURS
//==================================================

function accederCours(
    fichier,
    idCours
) {

    if (!fichier) {

        alert(
            "❌ Cette leçon n'est pas disponible."
        );

        return;

    }


    window.location.href =
        fichier;

}


//==================================================
// CERTIFICAT
//==================================================

function obtenirCertificat() {

    const progression =
        recupererProgression();


    const total =
        coursEntrepreneuriat.length;


    if (
        progression.length < total
    ) {

        alert(

            "🔒 Vous devez terminer les " +
            total +
            " cours de la formation " +
            "Entrepreneuriat."

        );

        return;

    }


    const utilisateur =
        obtenirUtilisateur();


    if (!utilisateur) {

        window.location.href =
            "connexion.html";

        return;

    }


    utilisateur.entrepreneuriatProgression =
        100;


    if (!utilisateur.coursSuivis) {

        utilisateur.coursSuivis = [];

    }


    if (
        !utilisateur.coursSuivis.includes(
            "Entrepreneuriat"
        )
    ) {

        utilisateur.coursSuivis.push(
            "Entrepreneuriat"
        );

    }


    localStorage.setItem(

        "bmj_current_user",

        JSON.stringify(
            utilisateur
        )

    );


    window.location.href =
        "certificat.html";

}


//==================================================
// RETOUR DASHBOARD
//==================================================

function retourDashboard() {

    window.location.href =
        "dashboard.html";

}


//==================================================
// BOUTON COMMENCER
//==================================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const utilisateur =
            obtenirUtilisateur();


        if (!utilisateur) {

            window.location.href =
                "connexion.html";

            return;

        }


        afficherUtilisateur();

        afficherProgression();

        afficherStatutCours();


        const bouton =
            document.querySelector(
                ".hero-content button"
            );


        if (bouton) {

            bouton.addEventListener(
                "click",
                commencerFormation
            );

        }


        const progressBar =
            document.getElementById(
                "progressBar"
            );


        if (progressBar) {

            progressBar.style.transition =
                "width 0.8s ease";

        }

    }
);


//==================================================
// CHANGEMENT DE COMPTE
//==================================================

window.addEventListener(
    "storage",
    function(event) {

        if (
            event.key ===
            "bmj_current_user"
        ) {

            afficherUtilisateur();

            afficherProgression();

            afficherStatutCours();

        }

    }
);

</script>
    

</body>

</html>
