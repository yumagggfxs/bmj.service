<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>projet</title>
    <style>
/*==================================================
        BMJ SERVICE
        PROJET FINAL ENTREPRENEURIAT
        STYLE DE VÉRIFICATION
==================================================*/


/*====================================
        RESET
====================================*/

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}


html{

    scroll-behavior:smooth;

}


body{

    font-family:"Segoe UI", Arial, sans-serif;

    background:#f4f7fb;

    color:#17202a;

    min-height:100vh;

}



/*====================================
        HEADER
====================================*/

header{

    width:100%;

    min-height:75px;

    padding:12px 6%;

    background:#ffffff;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-bottom:1px solid #e5eaf0;

    box-shadow:0 3px 15px rgba(0,0,0,0.06);

    position:relative;

    z-index:10;

}


/* LOGO */

.logo{

    display:flex;

    align-items:center;

    gap:12px;

}


.logo img{

    width:48px;

    height:48px;

    object-fit:cover;

    border-radius:50%;

}


.logo h2{

    font-size:22px;

    color:#145a86;

    letter-spacing:0.5px;

}


.logo h2 span{

    color:#f5b700;

}



/* UTILISATEUR */

.course-user{

    display:flex;

    align-items:center;

    gap:12px;

}


.course-user img{

    width:45px;

    height:45px;

    border-radius:50%;

    object-fit:cover;

    border:2px solid #145a86;

}


.course-user h4{

    font-size:15px;

    color:#1c2733;

    margin-bottom:3px;

}


.course-user small{

    font-size:12px;

    color:#7b8794;

}



/*====================================
        CONTENEUR
====================================*/

.verification-container{

    width:100%;

    min-height:

        calc(100vh - 75px);

    display:flex;

    align-items:center;

    justify-content:center;

    padding:50px 20px;

}



/*====================================
        CARTE
====================================*/

.verification-card{

    width:100%;

    max-width:760px;

    background:#ffffff;

    border-radius:22px;

    padding:45px;

    text-align:center;

    box-shadow:

        0 15px 45px rgba(20,90,134,0.10);

    border:1px solid #e8edf3;

    position:relative;

    overflow:hidden;

}



/* ligne supérieure */

.verification-card::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:5px;

    background:

        linear-gradient(

            90deg,

            #145a86,

            #f5b700

        );

}



/*====================================
        ICÔNE PRINCIPALE
====================================*/

.verification-icon{

    width:90px;

    height:90px;

    margin:0 auto 25px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#eef5fa;

    color:#145a86;

    font-size:38px;

}


.verification-icon i{

    line-height:1;

}



/* SUCCÈS */

.success-icon{

    background:#e9f9ef;

    color:#16803c;

}


/* ERREUR */

.error-icon{

    background:#fff0f0;

    color:#d62828;

}



/*====================================
        TITRE
====================================*/

#titreVerification{

    font-size:30px;

    color:#145a86;

    margin-bottom:12px;

    font-weight:700;

}


#messageVerification{

    max-width:600px;

    margin:0 auto;

    color:#687585;

    font-size:16px;

    line-height:1.7;

}



/*====================================
        DÉTAILS
====================================*/

.verification-details{

    margin-top:30px;

    display:flex;

    flex-direction:column;

    gap:10px;

    text-align:left;

}


.verification-line{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    padding:14px 17px;

    background:#f8fafc;

    border:1px solid #e8edf2;

    border-radius:12px;

    transition:0.25s;

}


.verification-line:hover{

    transform:translateY(-2px);

    box-shadow:

        0 5px 15px rgba(0,0,0,0.05);

}


.verification-line span{

    display:flex;

    align-items:center;

    gap:10px;

    color:#354250;

    font-size:14px;

    font-weight:500;

}


.verification-line span i{

    color:#145a86;

}


.verification-line strong{

    font-size:12px;

    padding:6px 11px;

    border-radius:20px;

    white-space:nowrap;

}



/* STATUTS */

.ok{

    background:#e8f8ee;

    color:#16803c;

}


.error{

    background:#ffeded;

    color:#c62828;

}


.pending{

    background:#fff7df;

    color:#9a7100;

}



/*====================================
        PROGRESSION
====================================*/

.verification-progress{

    margin-top:30px;

}


.progress-track{

    width:100%;

    height:9px;

    background:#e8edf2;

    border-radius:20px;

    overflow:hidden;

}


.progress-bar{

    width:0%;

    height:100%;

    border-radius:20px;

    background:

        linear-gradient(

            90deg,

            #145a86,

            #f5b700

        );

    transition:

        width 0.7s ease;

}


#progressText{

    display:block;

    margin-top:10px;

    font-size:13px;

    color:#7a8794;

}



/*====================================
        ZONE ACTION
====================================*/

.verification-action{

    margin-top:30px;

}



/*====================================
        MESSAGE ERREUR
====================================*/

.error-message{

    padding:20px;

    border-radius:14px;

    background:#fff5f5;

    border:1px solid #ffd6d6;

    color:#7c2525;

    line-height:1.7;

    font-size:14px;

    text-align:left;

}


.error-message strong{

    color:#b71c1c;

}



/*====================================
        MESSAGE SUCCÈS
====================================*/

.success-message{

    padding:20px;

    border-radius:14px;

    background:#f0fbf4;

    border:1px solid #c9efd5;

    color:#27663a;

    line-height:1.7;

    font-size:14px;

}


.success-message strong{

    color:#16803c;

    font-size:17px;

}



/*====================================
        BOUTONS
====================================*/

.verification-action button{

    border:none;

    cursor:pointer;

    font-family:inherit;

    font-weight:600;

    transition:

        transform 0.25s,

        box-shadow 0.25s;

}



/* RETOUR */

.btn-retour{

    margin-top:18px;

    padding:13px 22px;

    background:#edf2f6;

    color:#40515f;

    border-radius:10px;

}


.btn-retour:hover{

    transform:translateY(-2px);

    box-shadow:

        0 7px 18px rgba(0,0,0,0.08);

}



/* PREMIUM */

.btn-premium{

    margin-top:5px;

    padding:13px 24px;

    background:#f5b700;

    color:#171717;

    border-radius:25px;

    box-shadow:

        0 7px 20px rgba(245,183,0,0.25);

}


.btn-premium:hover{

    transform:translateY(-2px);

    box-shadow:

        0 10px 25px rgba(245,183,0,0.35);

}



/* CERTIFICAT */

.btn-certificat{

    padding:14px 28px;

    background:#145a86;

    color:#ffffff;

    border-radius:25px;

    box-shadow:

        0 8px 22px rgba(20,90,134,0.25);

}


.btn-certificat:hover{

    transform:translateY(-3px);

    box-shadow:

        0 12px 28px rgba(20,90,134,0.35);

}


.btn-certificat i{

    margin-right:7px;

}



/*====================================
        ANIMATION
====================================*/

@keyframes apparition{

    from{

        opacity:0;

        transform:translateY(20px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}


.verification-card{

    animation:

        apparition 0.6s ease;

}



/*====================================
        TABLETTE
====================================*/

@media(max-width:768px){

    header{

        padding:12px 4%;

    }


    .logo h2{

        font-size:19px;

    }


    .logo img{

        width:42px;

        height:42px;

    }


    .course-user img{

        width:40px;

        height:40px;

    }


    .course-user h4{

        font-size:13px;

    }


    .course-user small{

        font-size:11px;

    }


    .verification-container{

        padding:30px 15px;

        align-items:flex-start;

    }


    .verification-card{

        padding:35px 22px;

        margin-top:20px;

    }


    #titreVerification{

        font-size:25px;

    }


    #messageVerification{

        font-size:14px;

    }

}



/*====================================
        MOBILE
====================================*/

@media(max-width:520px){

    header{

        min-height:68px;

        padding:10px 15px;

    }


    .logo{

        gap:8px;

    }


    .logo img{

        width:38px;

        height:38px;

    }


    .logo h2{

        font-size:16px;

    }


    .course-user{

        gap:7px;

    }


    .course-user img{

        width:36px;

        height:36px;

    }


    .course-user h4{

        font-size:11px;

    }


    .course-user small{

        display:none;

    }


    .verification-container{

        min-height:

            calc(100vh - 68px);

        padding:20px 12px;

    }


    .verification-card{

        padding:30px 15px;

        border-radius:18px;

    }


    .verification-icon{

        width:75px;

        height:75px;

        font-size:30px;

        margin-bottom:20px;

    }


    #titreVerification{

        font-size:22px;

    }


    #messageVerification{

        font-size:13px;

    }


    .verification-line{

        padding:12px;

        flex-direction:column;

        align-items:flex-start;

        gap:8px;

    }


    .verification-line strong{

        align-self:flex-start;

    }


    .error-message,
    .success-message{

        font-size:13px;

        padding:16px;

    }


    .btn-premium,
    .btn-certificat,
    .btn-retour{

        width:100%;

    }

}

    </style>
</head>

<body>

    <!--================================
        HEADER
    =================================-->

    <header>

        <div class="logo">

            <img src="images/logo.png" alt="BMJ SERVICE">

            <h2>
                BMJ <span>SERVICE</span>
            </h2>

        </div>


        <div class="course-user">

            <img
                id="photoUtilisateur"
                src="images/user.png"
                alt="Utilisateur"
            >

            <div>

                <h4 id="nomUtilisateur">
                    Vérification...
                </h4>

                <small>
                    Entrepreneuriat
                </small>

            </div>

        </div>

    </header>



    <!--================================
        CONTENU
    =================================-->

    <main class="verification-container">


        <section class="verification-card">


            <div class="verification-icon" id="verificationIcon">

                <i class="fa-solid fa-spinner fa-spin"></i>

            </div>


            <h1 id="titreVerification">

                Vérification du parcours

            </h1>


            <p id="messageVerification">

                Le système vérifie automatiquement
                votre progression...

            </p>



            <!--================================
                DETAILS
            =================================-->

            <div
                class="verification-details"
                id="verificationDetails"
            >

            </div>



            <!--================================
                PROGRESSION
            =================================-->

            <div
                class="verification-progress"
                id="verificationProgress"
            >

                <div class="progress-track">

                    <div
                        id="verificationProgressBar"
                        class="progress-bar"
                    ></div>

                </div>

                <span id="progressText">
                    Vérification : 0%
                </span>

            </div>



            <!--================================
                ACTION
            =================================-->

            <div
                class="verification-action"
                id="verificationAction"
            >

            </div>


        </section>


    </main>



    <!--================================
        JAVASCRIPT
    =================================-->

<script>

/*==================================================
        BMJ SERVICE
        VÉRIFICATION FORMATION ENTREPRENEURIAT
        COURS + PROGRESSION + PREMIUM + CERTIFICAT
==================================================*/


//==================================================
// CONFIGURATION
//==================================================

const coursEntrepreneuriat = [

    {
        id: "introduction_entrepreneuriat",
        nom: "Introduction à l'entrepreneuriat",
        fichier: "introduction_entrepreneuriat.html"
    },

    {
        id: "idee_entreprise",
        nom: "Trouver une idée d'entreprise",
        fichier: "idee_entreprise.html"
    },

    {
        id: "business_model",
        nom: "Construire son Business Model",
        fichier: "business_model.html"
    },

    {
        id: "lancer_entreprise",
        nom: "Lancer son entreprise",
        fichier: "lancer_entreprise.html"
    }

];


const TOTAL_COURS =
    coursEntrepreneuriat.length;


//==================================================
// UTILISATEUR CONNECTÉ
//==================================================

function obtenirUtilisateur() {

    try {

        const donnees =
            localStorage.getItem(
                "bmj_current_user"
            );


        if (!donnees) {

            return null;

        }


        return JSON.parse(
            donnees
        );

    }

    catch (erreur) {

        console.error(
            "Erreur utilisateur :",
            erreur
        );

        return null;

    }

}


//==================================================
// IDENTIFIANT UTILISATEUR
//==================================================

function obtenirIdentifiantUtilisateur(
    utilisateur
) {

    if (!utilisateur) {

        return null;

    }


    return String(

        utilisateur.id_bmj ||

        utilisateur.email ||

        utilisateur.telephone ||

        utilisateur.nom ||

        ""

    ).trim();

}


//==================================================
// CLÉ DE PROGRESSION
//==================================================

function obtenirCleProgression(
    utilisateur = obtenirUtilisateur()
) {

    const identifiant =
        obtenirIdentifiantUtilisateur(
            utilisateur
        );


    if (!identifiant) {

        return null;

    }


    return (

        "entrepreneuriat_progression_" +

        identifiant

    );

}


//==================================================
// RÉCUPÉRER PROGRESSION
//==================================================

function recupererProgression() {

    const utilisateur =
        obtenirUtilisateur();


    if (!utilisateur) {

        return [];

    }


    const cle =
        obtenirCleProgression(
            utilisateur
        );


    if (!cle) {

        return [];

    }


    let progression = [];


    try {

        progression = JSON.parse(

            localStorage.getItem(
                cle
            )

        ) || [];

    }

    catch (erreur) {

        progression = [];

    }


    if (!Array.isArray(progression)) {

        progression = [];

    }


    /*
        Supprimer les doublons
    */

    progression = [

        ...new Set(
            progression
        )

    ];


    /*
        Garder uniquement les
        4 cours de cette formation
    */

    progression =
        progression.filter(

            function(id) {

                return coursEntrepreneuriat.some(

                    function(cours) {

                        return cours.id === id;

                    }

                );

            }

        );


    return progression;

}


//==================================================
// CALCUL PROGRESSION
//==================================================

function calculerProgression() {

    const progression =
        recupererProgression();


    let termines = 0;


    coursEntrepreneuriat.forEach(

        function(cours) {

            if (
                progression.includes(
                    cours.id
                )
            ) {

                termines++;

            }

        }

    );


    const pourcentage =
        Math.round(

            (
                termines /
                TOTAL_COURS
            ) * 100

        );


    return {

        termines:
            termines,

        total:
            TOTAL_COURS,

        pourcentage:
            pourcentage

    };

}


//==================================================
// SAUVEGARDER PROGRESSION DANS UTILISATEUR
//==================================================

function synchroniserUtilisateur() {

    const utilisateur =
        obtenirUtilisateur();


    if (!utilisateur) {

        return;

    }


    const resultat =
        calculerProgression();


    utilisateur.entrepreneuriatProgression =
        resultat.pourcentage;


    /*
        Sauvegarde session
    */

    localStorage.setItem(

        "bmj_current_user",

        JSON.stringify(
            utilisateur
        )

    );


    /*
        Sauvegarde dans la liste
        générale des utilisateurs
    */

    let utilisateurs = [];


    try {

        utilisateurs = JSON.parse(

            localStorage.getItem(
                "bmjUtilisateurs"
            )

        ) || [];

    }

    catch(erreur) {

        utilisateurs = [];

    }


    if (!Array.isArray(utilisateurs)) {

        utilisateurs = [];

    }


    const identifiant =
        obtenirIdentifiantUtilisateur(
            utilisateur
        );


    const index =
        utilisateurs.findIndex(

            function(user) {

                return (

                    obtenirIdentifiantUtilisateur(
                        user
                    ) === identifiant

                );

            }

        );


    if (index !== -1) {

        utilisateurs[index] =
            utilisateur;

    }


    localStorage.setItem(

        "bmjUtilisateurs",

        JSON.stringify(
            utilisateurs
        )

    );

}


//==================================================
// AFFICHER UTILISATEUR
//==================================================

function afficherUtilisateur() {

    const utilisateur =
        obtenirUtilisateur();


    if (!utilisateur) {

        return;

    }


    const nom =
        document.getElementById(
            "nomUtilisateur"
        );


    if (nom) {

        nom.textContent =
            utilisateur.nom ||
            "Apprenant";

    }


    const photo =
        document.getElementById(
            "photoUtilisateur"
        );


    if (photo) {

        photo.src =
            utilisateur.photo ||
            "images/user.png";

    }


    const domaine =
        document.getElementById(
            "domaineUtilisateur"
        );


    if (domaine) {

        domaine.textContent =
            utilisateur.domaine ||
            "Entrepreneuriat";

    }

}


//==================================================
// AFFICHER PROGRESSION
//==================================================

function afficherProgression() {

    const resultat =
        calculerProgression();


    const progressBar =
        document.getElementById(
            "verificationProgressBar"
        );


    const progressText =
        document.getElementById(
            "progressText"
        );


    if (progressBar) {

        progressBar.style.width =
            resultat.pourcentage + "%";

    }


    if (progressText) {

        progressText.textContent =

            "Vérification : " +

            resultat.pourcentage +

            "%";

    }


    /*
        Si ta page utilise aussi
        les anciens éléments
    */

    const ancienneBarre =
        document.getElementById(
            "progressBar"
        );


    if (ancienneBarre) {

        ancienneBarre.style.width =
            resultat.pourcentage + "%";

    }


    const ancienneValeur =
        document.getElementById(
            "progressValue"
        );


    if (ancienneValeur) {

        ancienneValeur.textContent =
            resultat.pourcentage;

    }


    const ancienTexte =
        document.getElementById(
            "progressText"
        );


    if (ancienTexte) {

        ancienTexte.textContent =

            resultat.termines +

            "/" +

            resultat.total +

            " cours terminés — " +

            resultat.pourcentage +

            "%";

    }

}


//==================================================
// AFFICHER LES DÉTAILS DE VÉRIFICATION
//==================================================

function afficherDetailsVerification() {

    const details =
        document.getElementById(
            "verificationDetails"
        );


    if (!details) {

        console.warn(
            "verificationDetails introuvable."
        );

        return;

    }


    const progression =
        recupererProgression();


    details.innerHTML = "";


    /*
        TITRE
    */

    const titre =
        document.createElement(
            "div"
        );


    titre.className =
        "verification-summary";


    titre.innerHTML = `

        <strong>
            Vérification de la formation
        </strong>

        <br>

        <span>
            Vérification des ${TOTAL_COURS} cours
        </span>

    `;


    details.appendChild(
        titre
    );


    /*
        CHAQUE COURS
    */

    coursEntrepreneuriat.forEach(

        function(cours) {

            const termine =
                progression.includes(
                    cours.id
                );


            const ligne =
                document.createElement(
                    "div"
                );


            ligne.className =
                "verification-line";


            if (termine) {

                ligne.innerHTML = `

                    <span>

                        <i
                            class="fa-solid fa-circle-check"
                        ></i>

                        ${cours.nom}

                    </span>

                    <strong class="ok">

                        Terminé

                    </strong>

                `;

            }

            else {

                ligne.innerHTML = `

                    <span>

                        <i
                            class="fa-solid fa-circle-xmark"
                        ></i>

                        ${cours.nom}

                    </span>

                    <strong class="error">

                        Non terminé

                    </strong>

                `;

            }


            details.appendChild(
                ligne
            );

        }

    );


    /*
        LIGNE PROGRESSION
    */

    const resultat =
        calculerProgression();


    const progressionLine =
        document.createElement(
            "div"
        );


    progressionLine.className =
        "verification-line";


    progressionLine.innerHTML = `

        <span>

            <i
                class="fa-solid fa-chart-line"
            ></i>

            Progression globale

        </span>

        <strong>

            ${resultat.termines}/${resultat.total}

            — ${resultat.pourcentage}%

        </strong>

    `;


    details.appendChild(
        progressionLine
    );


    /*
        SÉPARATION
    */

    const separation =
        document.createElement(
            "hr"
        );


    details.appendChild(
        separation
    );


    /*
        VÉRIFICATION PREMIUM
    */

    const utilisateur =
        obtenirUtilisateur();


    const premiumActif =
        verifierPremium(
            utilisateur
        );


    const premiumLine =
        document.createElement(
            "div"
        );


    premiumLine.className =
        "verification-line";


    if (premiumActif) {

        premiumLine.innerHTML = `

            <span>

                <i
                    class="fa-solid fa-crown"
                ></i>

                Abonnement Premium

            </span>

            <strong class="ok">

                Actif

            </strong>

        `;

    }

    else {

        premiumLine.innerHTML = `

            <span>

                <i
                    class="fa-solid fa-crown"
                ></i>

                Abonnement Premium

            </span>

            <strong class="error">

                Non actif

            </strong>

        `;

    }


    details.appendChild(
        premiumLine

//==================================================
// VÉRIFIER PREMIUM
//==================================================

function verifierPremium(
    utilisateur
) {

    if (!utilisateur) {

        return false;

    }


    /*
        CAS 1 :
        premium === true
    */

    if (
        utilisateur.premium === true
    ) {

        return true;

    }


    /*
        CAS 2 :
        abonnementPremium === true
    */

    if (
        utilisateur.abonnementPremium === true
    ) {

        return true;

    }


    /*
        CAS 3 :
        premiumActif === true
    */

    if (
        utilisateur.premiumActif === true
    ) {

        return true;

    }


    /*
        CAS 4 :
        Vérification d'une date
        d'expiration Premium
    */

    if (
        utilisateur.premiumExpiration
    ) {

        const expiration =
            new Date(
                utilisateur.premiumExpiration
            );


        if (
            !isNaN(
                expiration.getTime()
            ) &&

            expiration.getTime() >
            Date.now()

        ) {

            return true;

        }

    }


    /*
        CAS 5 :
        date expiration abonnement
    */

    if (
        utilisateur.dateExpirationPremium
    ) {

        const expiration =
            new Date(
                utilisateur.dateExpirationPremium
            );


        if (
            !isNaN(
                expiration.getTime()
            ) &&

            expiration.getTime() >
            Date.now()

        ) {

            return true;

        }

    }


    return false;

}

//==================================================
// ALLER AU CERTIFICAT
//==================================================

function allerAuCertificat() {

    const utilisateur =
        obtenirUtilisateur();


    if (!utilisateur) {

        window.location.href =
            "connexion.html";

        return;

    }


    const resultat =
        calculerProgression();


    if (
        resultat.pourcentage < 100
    ) {

        alert(
            "⚠️ Vous devez terminer tous les cours."
        );

        return;

    }


    if (
        !verifierPremium(
            utilisateur
        )
    ) {

        alert(

            "👑 Votre abonnement Premium " +

            "n'est pas actif."

        );

        return;

    }


    /*
        Enregistrer que la formation
        est validée
    */

    utilisateur.entrepreneuriatProgression =
        100;


    utilisateur.formationEntrepreneuriatValidee =
        true;


    utilisateur.coursEntrepreneuriatTermines =
        true;


    if (
        !Array.isArray(
            utilisateur.coursSuivis
        )
    ) {

        utilisateur.coursSuivis = [];

    }


    if (
        !utilisateur.coursSuivis.includes(
            "Entrepreneuriat"
        )
    ) {

        utilisateur.coursSuivis.push(
            "Entrepreneuriat"
        );

    }


    localStorage.setItem(

        "bmj_current_user",

        JSON.stringify(
            utilisateur
        )

    );


    window.location.href =
        "certificat.html";

}

//==================================================
// VÉRIFICATION PRINCIPALE
//==================================================

function verifierParcours() {

    console.log(
        "================================="
    );

    console.log(
        "VÉRIFICATION ENTREPRENEURIAT"
    );


    /*
        UTILISATEUR
    */

    const utilisateur =
        obtenirUtilisateur();


    if (!utilisateur) {

        window.location.href =
            "connexion.html";

        return;

    }


    console.log(
        "Utilisateur :",
        obtenirIdentifiantUtilisateur(
            utilisateur
        )
    );


    /*
        AFFICHAGE
    */

    afficherUtilisateur();


    /*
        PROGRESSION
    */

    const resultat =
        calculerProgression();


    console.log(
        "Cours terminés :",

        resultat.termines +

        "/" +

        resultat.total
    );


    console.log(
        "Progression :",

        resultat.pourcentage +

        "%"
    );


    /*
        SYNCHRONISER LE COMPTE
    */

    synchroniserUtilisateur();


    /*
        AFFICHER LA BARRE
    */

    afficherProgression();


    /*
        AFFICHER LES DÉTAILS
    */

    afficherDetailsVerification();


    /*
        ATTENDRE UN PETIT MOMENT
        POUR L'AFFICHAGE VISUEL
    */

    setTimeout(

        function() {

            /*
                =================================
                CAS 1 :
                FORMATION INCOMPLÈTE
                =================================
            */

            if (
                resultat.termines <
                TOTAL_COURS
            ) {

                afficherFormationIncomplete(

                    resultat.termines,

                    resultat.pourcentage

                );


                console.log(
                    "❌ Formation incomplète."
                );


                return;

            }


            /*
                =================================
                CAS 2 :
                4/4 COURS TERMINÉS
                =================================
            */

            console.log(
                "✅ Tous les cours sont terminés."
            );


            /*
                Vérifier Premium
            */

            const premiumActif =
                verifierPremium(
                    utilisateur
                );


            console.log(
                "Premium :",
                premiumActif
            );


            /*
                =================================
                CAS 3 :
                FORMATION OK + PREMIUM OK
                =================================
            */

            if (premiumActif) {

                console.log(
                    "✅ Premium actif."
                );


                afficherSucces();


                /*
                    NE PAS rediriger immédiatement.
                    L'utilisateur voit d'abord
                    les détails de vérification.

                    Il clique ensuite sur
                    "Obtenir mon certificat".
                */

                return;

            }


            /*
                =================================
                CAS 4 :
                FORMATION OK + PREMIUM NON
                =================================
            */

            console.log(
                "⚠️ Premium non actif."
            );


            afficherPremiumRequis();

        },

        300

    );


    console.log(
        "================================="
    );

}

//==================================================
// ACTUALISATION SI CHANGEMENT
//==================================================

window.addEventListener(
    "storage",
    function(event) {

        const utilisateur =
            obtenirUtilisateur();


        if (!utilisateur) {

            return;

        }


        const cle =
            obtenirCleProgression(
                utilisateur
            );


        /*
            Progression modifiée
        */

        if (
            event.key === cle
        ) {

            verifierParcours();

        }


        /*
            Utilisateur connecté
            modifié
        */

        if (
            event.key ===
            "bmj_current_user"
        ) {

            verifierParcours();

        }

    }
);

</script>
