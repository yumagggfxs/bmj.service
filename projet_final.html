<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>projet</title>
    <style>
/*==================================================
        BMJ SERVICE
        PROJET FINAL ENTREPRENEURIAT
        STYLE DE VÉRIFICATION
==================================================*/


/*====================================
        RESET
====================================*/

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}


html{

    scroll-behavior:smooth;

}


body{

    font-family:"Segoe UI", Arial, sans-serif;

    background:#f4f7fb;

    color:#17202a;

    min-height:100vh;

}



/*====================================
        HEADER
====================================*/

header{

    width:100%;

    min-height:75px;

    padding:12px 6%;

    background:#ffffff;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-bottom:1px solid #e5eaf0;

    box-shadow:0 3px 15px rgba(0,0,0,0.06);

    position:relative;

    z-index:10;

}


/* LOGO */

.logo{

    display:flex;

    align-items:center;

    gap:12px;

}


.logo img{

    width:48px;

    height:48px;

    object-fit:cover;

    border-radius:50%;

}


.logo h2{

    font-size:22px;

    color:#145a86;

    letter-spacing:0.5px;

}


.logo h2 span{

    color:#f5b700;

}



/* UTILISATEUR */

.course-user{

    display:flex;

    align-items:center;

    gap:12px;

}


.course-user img{

    width:45px;

    height:45px;

    border-radius:50%;

    object-fit:cover;

    border:2px solid #145a86;

}


.course-user h4{

    font-size:15px;

    color:#1c2733;

    margin-bottom:3px;

}


.course-user small{

    font-size:12px;

    color:#7b8794;

}



/*====================================
        CONTENEUR
====================================*/

.verification-container{

    width:100%;

    min-height:

        calc(100vh - 75px);

    display:flex;

    align-items:center;

    justify-content:center;

    padding:50px 20px;

}



/*====================================
        CARTE
====================================*/

.verification-card{

    width:100%;

    max-width:760px;

    background:#ffffff;

    border-radius:22px;

    padding:45px;

    text-align:center;

    box-shadow:

        0 15px 45px rgba(20,90,134,0.10);

    border:1px solid #e8edf3;

    position:relative;

    overflow:hidden;

}



/* ligne supérieure */

.verification-card::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:5px;

    background:

        linear-gradient(

            90deg,

            #145a86,

            #f5b700

        );

}



/*====================================
        ICÔNE PRINCIPALE
====================================*/

.verification-icon{

    width:90px;

    height:90px;

    margin:0 auto 25px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#eef5fa;

    color:#145a86;

    font-size:38px;

}


.verification-icon i{

    line-height:1;

}



/* SUCCÈS */

.success-icon{

    background:#e9f9ef;

    color:#16803c;

}


/* ERREUR */

.error-icon{

    background:#fff0f0;

    color:#d62828;

}



/*====================================
        TITRE
====================================*/

#titreVerification{

    font-size:30px;

    color:#145a86;

    margin-bottom:12px;

    font-weight:700;

}


#messageVerification{

    max-width:600px;

    margin:0 auto;

    color:#687585;

    font-size:16px;

    line-height:1.7;

}



/*====================================
        DÉTAILS
====================================*/

.verification-details{

    margin-top:30px;

    display:flex;

    flex-direction:column;

    gap:10px;

    text-align:left;

}


.verification-line{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    padding:14px 17px;

    background:#f8fafc;

    border:1px solid #e8edf2;

    border-radius:12px;

    transition:0.25s;

}


.verification-line:hover{

    transform:translateY(-2px);

    box-shadow:

        0 5px 15px rgba(0,0,0,0.05);

}


.verification-line span{

    display:flex;

    align-items:center;

    gap:10px;

    color:#354250;

    font-size:14px;

    font-weight:500;

}


.verification-line span i{

    color:#145a86;

}


.verification-line strong{

    font-size:12px;

    padding:6px 11px;

    border-radius:20px;

    white-space:nowrap;

}



/* STATUTS */

.ok{

    background:#e8f8ee;

    color:#16803c;

}


.error{

    background:#ffeded;

    color:#c62828;

}


.pending{

    background:#fff7df;

    color:#9a7100;

}



/*====================================
        PROGRESSION
====================================*/

.verification-progress{

    margin-top:30px;

}


.progress-track{

    width:100%;

    height:9px;

    background:#e8edf2;

    border-radius:20px;

    overflow:hidden;

}


.progress-bar{

    width:0%;

    height:100%;

    border-radius:20px;

    background:

        linear-gradient(

            90deg,

            #145a86,

            #f5b700

        );

    transition:

        width 0.7s ease;

}


#progressText{

    display:block;

    margin-top:10px;

    font-size:13px;

    color:#7a8794;

}



/*====================================
        ZONE ACTION
====================================*/

.verification-action{

    margin-top:30px;

}



/*====================================
        MESSAGE ERREUR
====================================*/

.error-message{

    padding:20px;

    border-radius:14px;

    background:#fff5f5;

    border:1px solid #ffd6d6;

    color:#7c2525;

    line-height:1.7;

    font-size:14px;

    text-align:left;

}


.error-message strong{

    color:#b71c1c;

}



/*====================================
        MESSAGE SUCCÈS
====================================*/

.success-message{

    padding:20px;

    border-radius:14px;

    background:#f0fbf4;

    border:1px solid #c9efd5;

    color:#27663a;

    line-height:1.7;

    font-size:14px;

}


.success-message strong{

    color:#16803c;

    font-size:17px;

}



/*====================================
        BOUTONS
====================================*/

.verification-action button{

    border:none;

    cursor:pointer;

    font-family:inherit;

    font-weight:600;

    transition:

        transform 0.25s,

        box-shadow 0.25s;

}



/* RETOUR */

.btn-retour{

    margin-top:18px;

    padding:13px 22px;

    background:#edf2f6;

    color:#40515f;

    border-radius:10px;

}


.btn-retour:hover{

    transform:translateY(-2px);

    box-shadow:

        0 7px 18px rgba(0,0,0,0.08);

}



/* PREMIUM */

.btn-premium{

    margin-top:5px;

    padding:13px 24px;

    background:#f5b700;

    color:#171717;

    border-radius:25px;

    box-shadow:

        0 7px 20px rgba(245,183,0,0.25);

}


.btn-premium:hover{

    transform:translateY(-2px);

    box-shadow:

        0 10px 25px rgba(245,183,0,0.35);

}



/* CERTIFICAT */

.btn-certificat{

    padding:14px 28px;

    background:#145a86;

    color:#ffffff;

    border-radius:25px;

    box-shadow:

        0 8px 22px rgba(20,90,134,0.25);

}


.btn-certificat:hover{

    transform:translateY(-3px);

    box-shadow:

        0 12px 28px rgba(20,90,134,0.35);

}


.btn-certificat i{

    margin-right:7px;

}



/*====================================
        ANIMATION
====================================*/

@keyframes apparition{

    from{

        opacity:0;

        transform:translateY(20px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}


.verification-card{

    animation:

        apparition 0.6s ease;

}



/*====================================
        TABLETTE
====================================*/

@media(max-width:768px){

    header{

        padding:12px 4%;

    }


    .logo h2{

        font-size:19px;

    }


    .logo img{

        width:42px;

        height:42px;

    }


    .course-user img{

        width:40px;

        height:40px;

    }


    .course-user h4{

        font-size:13px;

    }


    .course-user small{

        font-size:11px;

    }


    .verification-container{

        padding:30px 15px;

        align-items:flex-start;

    }


    .verification-card{

        padding:35px 22px;

        margin-top:20px;

    }


    #titreVerification{

        font-size:25px;

    }


    #messageVerification{

        font-size:14px;

    }

}



/*====================================
        MOBILE
====================================*/

@media(max-width:520px){

    header{

        min-height:68px;

        padding:10px 15px;

    }


    .logo{

        gap:8px;

    }


    .logo img{

        width:38px;

        height:38px;

    }


    .logo h2{

        font-size:16px;

    }


    .course-user{

        gap:7px;

    }


    .course-user img{

        width:36px;

        height:36px;

    }


    .course-user h4{

        font-size:11px;

    }


    .course-user small{

        display:none;

    }


    .verification-container{

        min-height:

            calc(100vh - 68px);

        padding:20px 12px;

    }


    .verification-card{

        padding:30px 15px;

        border-radius:18px;

    }


    .verification-icon{

        width:75px;

        height:75px;

        font-size:30px;

        margin-bottom:20px;

    }


    #titreVerification{

        font-size:22px;

    }


    #messageVerification{

        font-size:13px;

    }


    .verification-line{

        padding:12px;

        flex-direction:column;

        align-items:flex-start;

        gap:8px;

    }


    .verification-line strong{

        align-self:flex-start;

    }


    .error-message,
    .success-message{

        font-size:13px;

        padding:16px;

    }


    .btn-premium,
    .btn-certificat,
    .btn-retour{

        width:100%;

    }

}

    </style>
</head>

<body>

    <!--================================
        HEADER
    =================================-->

    <header>

        <div class="logo">

            <img src="images/logo.png" alt="BMJ SERVICE">

            <h2>
                BMJ <span>SERVICE</span>
            </h2>

        </div>


        <div class="course-user">

            <img
                id="photoUtilisateur"
                src="images/user.png"
                alt="Utilisateur"
            >

            <div>

                <h4 id="nomUtilisateur">
                    Vérification...
                </h4>

                <small>
                    Entrepreneuriat
                </small>

            </div>

        </div>

    </header>



    <!--================================
        CONTENU
    =================================-->

    <main class="verification-container">


        <section class="verification-card">


            <div class="verification-icon" id="verificationIcon">

                <i class="fa-solid fa-spinner fa-spin"></i>

            </div>


            <h1 id="titreVerification">

                Vérification du parcours

            </h1>


            <p id="messageVerification">

                Le système vérifie automatiquement
                votre progression...

            </p>



            <!--================================
                DETAILS
            =================================-->

            <div
                class="verification-details"
                id="verificationDetails"
            >

            </div>



            <!--================================
                PROGRESSION
            =================================-->

            <div
                class="verification-progress"
                id="verificationProgress"
            >

                <div class="progress-track">

                    <div
                        id="verificationProgressBar"
                        class="progress-bar"
                    ></div>

                </div>

                <span id="progressText">
                    Vérification : 0%
                </span>

            </div>



            <!--================================
                ACTION
            =================================-->

            <div
                class="verification-action"
                id="verificationAction"
            >

            </div>


        </section>


    </main>



    <!--================================
        JAVASCRIPT
    =================================-->

    <script>

    /*==================================================
            BMJ SERVICE
            PROJET FINAL ENTREPRENEURIAT
            VÉRIFICATION AUTOMATIQUE
    ==================================================*/


    //==================================================
    // CONFIGURATION DU CHAPITRE
    //==================================================

    const chapitre = {

        nom: "Chapitre 1 : Entrepreneuriat",

        lecons: [

            {
                nom: "Introduction à l'entrepreneuriat",
                fichier: "introduction_entrepreneuriat.html",
                cle: "introduction_entrepreneuriat"
            },

            {
                nom: "Trouver une idée d'entreprise",
                fichier: "idee_entreprise.html",
                cle: "idee_entreprise"
            },

            {
                nom: "Construire son Business Model",
                fichier: "business_model.html",
                cle: "business_model"
            },

            {
                nom: "Lancer son entreprise",
                fichier: "lancer_entreprise.html",
                cle: "lancer_entreprise"
            }

        ]

    };



    //==================================================
    // CHARGEMENT
    //==================================================

    document.addEventListener(
        "DOMContentLoaded",
        function(){

            verifierParcours();

        }
    );



    //==================================================
    // UTILISATEUR
    //==================================================

    function obtenirUtilisateur(){

        try{

            return JSON.parse(

                localStorage.getItem(
                    "bmj_current_user"
                )

            );

        }

        catch(erreur){

            return null;

        }

    }



    //==================================================
    // AFFICHER UTILISATEUR
    //==================================================

    function afficherUtilisateur(utilisateur){

        let nom =
            document.getElementById(
                "nomUtilisateur"
            );

        let photo =
            document.getElementById(
                "photoUtilisateur"
            );


        if(nom){

            nom.textContent =
                utilisateur.nom ||
                "Apprenant";

        }


        if(photo){

            photo.src =
                utilisateur.photo ||
                "images/user.png";

        }

    }



    //==================================================
    // VÉRIFIER UNE LEÇON
    //==================================================

    function leconTerminee(cle){

        /*
            Plusieurs formats sont acceptés
            pour rester compatible avec
            les progressions déjà enregistrées.
        */


        // Format :
        // localStorage.getItem("cle")

        if(

            localStorage.getItem(cle) === "termine" ||

            localStorage.getItem(cle) === "completed" ||

            localStorage.getItem(cle) === "true" ||

            localStorage.getItem(cle) === "1"

        ){

            return true;

        }



        // Format :
        // bmj_progression

        try{

            let progression =
                JSON.parse(

                    localStorage.getItem(
                        "bmj_progression"
                    )

                ) || [];


            if(

                Array.isArray(progression) &&

                (

                    progression.includes(cle)

                )

            ){

                return true;

            }

        }

        catch(e){}



        // Format :
        // progression_entrepreneuriat

        try{

            let progression =
                JSON.parse(

                    localStorage.getItem(
                        "progression_entrepreneuriat"
                    )

                ) || [];


            if(

                Array.isArray(progression) &&

                (

                    progression.includes(cle) ||

                    progression.includes(
                        chapitre.lecons.find(
                            l => l.cle === cle
                        )?.fichier
                    )

                )

            ){

                return true;

            }

        }

        catch(e){}



        return false;

    }



    //==================================================
    // MARQUER LE PROJET FINAL COMME TERMINÉ
    //==================================================

    function terminerProjetFinal(utilisateur){

        /*
            Le projet final était auparavant
            considéré comme non terminé.

            Dès que toutes les leçons sont terminées,
            cette page se valide automatiquement.
        */


        localStorage.setItem(

            "projet_final_entrepreneuriat",

            "termine"

        );



        localStorage.setItem(

            "entrepreneuriat_projet_final",

            "termine"

        );



        //==============================================
        // PROGRESSION DU CHAPITRE
        //==============================================

        let progression = 0;


        chapitre.lecons.forEach(
            function(lecon){

                if(
                    leconTerminee(
                        lecon.cle
                    )
                ){

                    progression++;

                }

            }
        );


        // Ajouter le projet final

        progression++;


        let total = chapitre.lecons.length + 1;


        let pourcentage = Math.round(

            (progression / total) * 100

        );


        //==============================================
        // SAUVEGARDER LA PROGRESSION
        //==============================================

        localStorage.setItem(

            "entrepreneuriat_progression",

            pourcentage

        );



        //==============================================
        // DONNÉES UTILISATEUR
        //==============================================

        utilisateur.entrepreneuriatProgression =
            pourcentage;


        utilisateur.projetFinalEntrepreneuriat =
            true;


        //==============================================
        // COURS TERMINÉS
        //==============================================

        if(!utilisateur.coursTermines){

            utilisateur.coursTermines = [];

        }


        if(

            !utilisateur.coursTermines.includes(

                "Projet final - Entrepreneuriat"

            )

        ){

            utilisateur.coursTermines.push(

                "Projet final - Entrepreneuriat"

            );

        }


        //==============================================
        // SAUVEGARDE
        //==============================================

        localStorage.setItem(

            "bmj_current_user",

            JSON.stringify(
                utilisateur
            )

        );



        //==============================================
        // MISE À JOUR BMJ UTILISATEURS
        //==============================================

        let utilisateurs = JSON.parse(

            localStorage.getItem(
                "bmjUtilisateurs"
            )

        ) || [];


        let index =
            utilisateurs.findIndex(

                function(user){

                    return (

                        user.id_bmj ===
                        utilisateur.id_bmj

                    );

                }

            );


        if(index !== -1){

            utilisateurs[index] =
                utilisateur;


            localStorage.setItem(

                "bmjUtilisateurs",

                JSON.stringify(
                    utilisateurs
                )

            );

        }

    }



    //==================================================
    // AFFICHER LES DÉTAILS
    //==================================================

    function afficherDetails(resultats){

        let details =
            document.getElementById(
                "verificationDetails"
            );


        if(!details){

            return;

        }


        details.innerHTML = "";



        resultats.forEach(
            function(resultat){

                let ligne =
                    document.createElement(
                        "div"
                    );


                ligne.className =
                    "verification-line";



                if(resultat.termine){

                    ligne.innerHTML = `

                        <span>

                            <i class="fa-solid fa-circle-check"></i>

                            ${resultat.nom}

                        </span>

                        <strong class="ok">

                            Terminé

                        </strong>

                    `;

                }

                else{

                    ligne.innerHTML = `

                        <span>

                            <i class="fa-solid fa-circle-xmark"></i>

                            ${resultat.nom}

                        </span>

                        <strong class="error">

                            Non terminé

                        </strong>

                    `;

                }


                details.appendChild(ligne);

            }
        );



        //==============================================
        // PROJET FINAL
        //==============================================

        let projet =
            document.createElement(
                "div"
            );


        projet.className =
            "verification-line";



        projet.innerHTML = `

            <span>

                <i class="fa-solid fa-graduation-cap"></i>

                Projet final

            </span>

            <strong class="pending">

                Vérifié automatiquement

            </strong>

        `;


        details.appendChild(projet);

    }



    //==================================================
    // AFFICHER PROGRESSION
    //==================================================

    function afficherProgression(valeur){

        let bar =
            document.getElementById(
                "verificationProgressBar"
            );


        let texte =
            document.getElementById(
                "progressText"
            );


        if(bar){

            bar.style.width =
                valeur + "%";

        }


        if(texte){

            texte.textContent =
                "Vérification : " +
                valeur +
                "%";

        }

    }



    //==================================================
    // AFFICHER ERREUR
    //==================================================

    function afficherErreur(
        titre,
        message,
        details
    ){

        let icon =
            document.getElementById(
                "verificationIcon"
            );


        let titreElement =
            document.getElementById(
                "titreVerification"
            );


        let messageElement =
            document.getElementById(
                "messageVerification"
            );


        let action =
            document.getElementById(
                "verificationAction"
            );



        if(icon){

            icon.innerHTML =

                '<i class="fa-solid fa-circle-xmark"></i>';

            icon.className =
                "verification-icon error-icon";

        }


        if(titreElement){

            titreElement.textContent =
                titre;

        }


        if(messageElement){

            messageElement.textContent =
                message;

        }


        if(action){

            action.innerHTML = `

                <div class="error-message">

                    ${details}

                </div>


                <button
                    onclick="window.location.href='dashboard.html'"
                    class="btn-retour"
                >

                    <i class="fa-solid fa-arrow-left"></i>

                    Retour au tableau de bord

                </button>

            `;

        }

    }



    //==================================================
    // VÉRIFICATION PRINCIPALE
    //==================================================

    function verifierParcours(){

        let utilisateur =
            obtenirUtilisateur();



        //==============================================
        // CONNEXION
        //==============================================

        if(!utilisateur){

            window.location.href =
                "connexion.html";

            return;

        }



        afficherUtilisateur(
            utilisateur
        );



        //==============================================
        // ÉTAPE 1
        //==============================================

        afficherProgression(20);


        let resultats = [];

        let toutesLesLecons =
            true;


        let nombreTerminees =
            0;



        //==============================================
        // VÉRIFICATION DES LEÇONS
        //==============================================

        chapitre.lecons.forEach(
            function(lecon){

                let termine =
                    leconTerminee(
                        lecon.cle
                    );


                if(termine){

                    nombreTerminees++;

                }
                else{

                    toutesLesLecons =
                        false;

                }


                resultats.push({

                    nom: lecon.nom,

                    termine: termine

                });

            }
        );



        //==============================================
        // AFFICHER LES RÉSULTATS
        //==============================================

        afficherDetails(
            resultats
        );



        afficherProgression(50);



        //==============================================
        // LEÇONS INCOMPLÈTES
        //==============================================

        if(!toutesLesLecons){

            afficherErreur(

                "Parcours incomplet",

                "Vous ne pouvez pas encore obtenir votre certificat.",

                `

                    <strong>
                        Certaines leçons du chapitre
                        Entrepreneuriat ne sont pas encore terminées.
                    </strong>

                    <br><br>

                    Leçons terminées :

                    <strong>
                        ${nombreTerminees}/${chapitre.lecons.length}
                    </strong>

                    <br><br>

                    Veuillez terminer toutes les leçons
                    avant de continuer.

                `

            );


            return;

        }



        //==============================================
        // TOUTES LES LEÇONS SONT TERMINÉES
        //==============================================

        terminerProjetFinal(
            utilisateur
        );



        afficherProgression(75);



        //==============================================
        // VÉRIFICATION PREMIUM
        //==============================================

        let premium =
            utilisateur.premium === true;



        //==============================================
        // PREMIUM INACTIF
        //==============================================

        if(!premium){

            afficherErreur(

                "Abonnement Premium requis",

                "Votre parcours est terminé, mais votre abonnement Premium n'est pas actif.",

                `

                    <strong>
                        Félicitations !
                    </strong>

                    <br><br>

                    Toutes les leçons du domaine
                    <strong>Entrepreneuriat</strong>
                    sont terminées.

                    <br><br>

                    Votre progression est maintenant enregistrée.

                    <br><br>

                    Cependant, l'obtention et le téléchargement
                    du certificat nécessitent un abonnement
                    <strong>Premium actif</strong>.

                    <br><br>

                    Veuillez activer votre abonnement
                    Premium pour continuer.

                    <br><br>

                    <button
                        onclick="window.location.href='paiement_visapay.html'"
                        class="btn-premium"
                    >

                        <i class="fa-solid fa-crown"></i>

                        Activer Premium

                    </button>

                `

            );


            return;

        }



        //==============================================
        // TOUT EST CORRECT
        //==============================================

        afficherProgression(100);



        let icon =
            document.getElementById(
                "verificationIcon"
            );


        let titre =
            document.getElementById(
                "titreVerification"
            );


        let message =
            document.getElementById(
                "messageVerification"
            );


        let action =
            document.getElementById(
                "verificationAction"
            );



        if(icon){

            icon.innerHTML =

                '<i class="fa-solid fa-circle-check"></i>';

            icon.className =
                "verification-icon success-icon";

        }


        if(titre){

            titre.textContent =
                "Parcours validé !";

        }


        if(message){

            message.textContent =

                "Félicitations ! Toutes les conditions sont remplies.";

        }


        if(action){

            action.innerHTML = `

                <div class="success-message">

                    <strong>
                        🎓 Certificat disponible
                    </strong>

                    <br><br>

                    Votre parcours Entrepreneuriat
                    a été entièrement validé.

                    <br><br>

                    Vous pouvez maintenant accéder
                    à votre certificat.

                </div>

                <br>

                <button
                    onclick="window.location.href='certificat.html'"
                    class="btn-certificat"
                >

                    <i class="fa-solid fa-certificate"></i>

                    Obtenir mon certificat

                </button>

            `;

        }

    }

    </script>

</body>

</html>
