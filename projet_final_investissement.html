<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Vérification Premium | BMJ SERVICE
    </title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f5f7fa,
                    #eef4f8
                );

            color: #222;

        }


        .box {

            width: min(
                460px,
                100%
            );

            padding: 40px 28px;

            background: #fff;

            border:
                1px solid #e2e8f0;

            border-radius: 14px;

            text-align: center;

            box-shadow:
                0 15px 40px
                rgba(
                    0,
                    0,
                    0,
                    .08
                );

        }


        .logo {

            width: 75px;

            height: 75px;

            object-fit: contain;

            margin:
                0 auto 20px;

        }


        .icon {

            width: 65px;

            height: 65px;

            margin:
                0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                #e0f2fe;

            color:
                #075985;

            font-size: 27px;

        }


        .icon.success {

            background:
                #dcfce7;

            color:
                #15803d;

        }


        .icon.error {

            background:
                #fee2e2;

            color:
                #b91c1c;

        }


        h1 {

            font-size: 23px;

            margin-bottom: 12px;

            color:
                #075985;

        }


        .description {

            font-size: 14px;

            line-height: 1.7;

            color: #64748b;

            margin-bottom: 25px;

        }


        .status {

            padding: 15px;

            border-radius: 10px;

            background:
                #f8fafc;

            border:
                1px solid #e2e8f0;

            margin-bottom: 20px;

            font-size: 14px;

            line-height: 1.6;

        }


        .status-title {

            font-weight: 700;

            color:
                #334155;

            margin-bottom: 5px;

        }


        .status-text {

            color:
                #64748b;

        }


        .progress-container {

            width: 100%;

            height: 9px;

            background:
                #e2e8f0;

            border-radius: 20px;

            overflow: hidden;

            margin:
                20px 0 8px;

        }


        .progress-bar {

            height: 100%;

            width: 0%;

            background:
                linear-gradient(
                    90deg,
                    #075985,
                    #0ea5e9
                );

            border-radius: 20px;

            transition:
                width .7s ease;

        }


        .progress-label {

            font-size: 12px;

            color:
                #64748b;

        }


        .loading {

            font-size: 14px;

            color:
                #64748b;

            min-height: 25px;

        }


        .success-message {

            color:
                #15803d;

            font-size: 14px;

            line-height: 1.6;

        }


        .error-message {

            color:
                #b91c1c;

            font-size: 14px;

            line-height: 1.6;

        }


        .button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            margin-top: 18px;

            padding:
                12px 20px;

            border: none;

            border-radius: 8px;

            background:
                #075985;

            color: #fff;

            text-decoration: none;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;

            transition:
                .2s ease;

        }


        .button:hover {

            background:
                #064e73;

            transform:
                translateY(-1px);

        }


        .button.secondary {

            background:
                #64748b;

        }


        .button:disabled {

            opacity: .65;

            cursor: not-allowed;

            transform: none;

        }


        .hidden {

            display: none !important;

        }


        .spinner {

            width: 17px;

            height: 17px;

            display: inline-block;

            border:
                2px solid
                rgba(
                    255,
                    255,
                    255,
                    .4
                );

            border-top-color:
                #fff;

            border-radius: 50%;

            animation:
                spin .8s linear infinite;

        }


        .loading-spinner {

            width: 18px;

            height: 18px;

            display: inline-block;

            border:
                2px solid #dbeafe;

            border-top-color:
                #075985;

            border-radius: 50%;

            animation:
                spin .8s linear infinite;

            vertical-align: middle;

            margin-right: 7px;

        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }

        }


        @media (
            max-width: 480px
        ) {

            .box {

                padding:
                    32px 20px;

            }


            h1 {

                font-size:
                    21px;

            }

        }

    </style>

</head>


<body>


<div class="box">


    <!-- =====================================================
         LOGO
    ====================================================== -->

    <img
        src="images/logo.png"
        alt="BMJ SERVICE"
        class="logo"
        onerror="
            this.style.display='none';
        "
    >


    <!-- =====================================================
         ICONE
    ====================================================== -->

    <div
        id="statusIcon"
        class="icon"
    >

        <i
            id="statusIconElement"
            class="fa-solid fa-shield-halved"
        ></i>

    </div>


    <!-- =====================================================
         TITRE
    ====================================================== -->

    <h1 id="pageTitle">

        Vérification Premium

    </h1>


    <!-- =====================================================
         DESCRIPTION
    ====================================================== -->

    <p
        id="description"
        class="description"
    >

        Nous vérifions actuellement
        votre statut Premium.

    </p>


    <!-- =====================================================
         STATUT
    ====================================================== -->

    <div class="status">

        <div
            id="statusTitle"
            class="status-title"
        >

            Vérification en cours

        </div>


        <div
            id="statusText"
            class="status-text"
        >

            Veuillez patienter...

        </div>


        <!-- =================================================
             PROGRESSION
        ================================================== -->

        <div
            class="progress-container"
        >

            <div
                id="progressBar"
                class="progress-bar"
            ></div>

        </div>


        <div
            id="progressLabel"
            class="progress-label"
        >

            Vérification Premium

        </div>

    </div>


    <!-- =====================================================
         MESSAGE
    ====================================================== -->

    <div
        id="loading"
        class="loading"
    >

        <span
            class="loading-spinner"
        ></span>

        Vérification de votre compte...

    </div>


    <!-- =====================================================
         ACTION
    ====================================================== -->

    <div
        id="actionContainer"
    ></div>


</div>



<script>

/* ============================================================
   CONFIGURATION
============================================================ */

"use strict";


const API_URL =
    "https://back-end-8i4t.onrender.com";


/* ============================================================
   ELEMENTS
============================================================ */

const statusIcon =
    document.getElementById(
        "statusIcon"
    );


const statusIconElement =
    document.getElementById(
        "statusIconElement"
    );


const pageTitle =
    document.getElementById(
        "pageTitle"
    );


const description =
    document.getElementById(
        "description"
    );


const statusTitle =
    document.getElementById(
        "statusTitle"
    );


const statusText =
    document.getElementById(
        "statusText"
    );


const progressBar =
    document.getElementById(
        "progressBar"
    );


const progressLabel =
    document.getElementById(
        "progressLabel"
    );


const loading =
    document.getElementById(
        "loading"
    );


const actionContainer =
    document.getElementById(
        "actionContainer"
    );


/* ============================================================
   DEMARRAGE
============================================================ */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        verifierUtilisateur();

    }
);


/* ============================================================
   RECUPERER UTILISATEUR
============================================================ */

function verifierUtilisateur() {


    const storedUser =
        localStorage.getItem(
            "bmj_current_user"
        );


    if (!storedUser) {

        window.location.href =
            "connexion.html";

        return;

    }


    let user;


    try {

        user =
            JSON.parse(
                storedUser
            );

    } catch (error) {

        console.error(
            "[BMJ PREMIUM] LocalStorage invalide :",
            error
        );


        localStorage.removeItem(
            "bmj_current_user"
        );


        window.location.href =
            "connexion.html";

        return;

    }


    const userId =
        user.id ||
        user.id_bmj ||
        user.user_id;


    if (!userId) {

        afficherErreur(
            "Impossible d'identifier votre compte."
        );

        return;

    }


    verifierStatutPremium(
        userId,
        user
    );

}


/* ============================================================
   ETAPE 1
   RECUPERER L'ETAT DE LA VERIFICATION
============================================================ */

async function verifierStatutPremium(
    userId,
    localUser
) {


    try {

        afficherChargement(
            "Vérification de votre abonnement Premium..."
        );


        const response =
            await fetch(

                API_URL +
                "/api/users/" +
                encodeURIComponent(
                    userId
                ) +
                "/premium-verification",

                {

                    method:
                        "GET",

                    headers: {

                        "Accept":
                            "application/json"

                    }

                }

            );


        const data =
            await lireJSON(
                response
            );


        console.log(
            "[BMJ PREMIUM] ETAT :",
            data
        );


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Impossible de vérifier votre abonnement."
            );

        }


        /*
         * ====================================================
         * PAS PREMIUM
         * ====================================================
         */

        if (
            data.premium !== true
        ) {

            mettreAJourProgression(
                data.premium_verification_progression ?? 50
            );


            afficherNonPremium();


            return;

        }


        /*
         * ====================================================
         * DEJA TERMINE
         * ====================================================
         */

        const alreadyCompleted =
            data.premium_verification_completed === true ||
            data.verified === true ||
            Number(
                data.premium_verification_progression
            ) >= 100;


        if (alreadyCompleted) {

            mettreAJourProgression(
                100
            );


            enregistrerUtilisateurLocal(
                localUser,
                data
            );


            afficherTermine();


            return;

        }


        /*
         * ====================================================
         * PREMIUM ACTIF MAIS VERIFICATION PAS TERMINEE
         * ====================================================
         */

        mettreAJourProgression(
            data.premium_verification_progression ?? 50
        );


        await finaliserVerification(
            userId,
            localUser
        );


    } catch (error) {

        console.error(
            "[BMJ PREMIUM] GET ERROR :",
            error
        );


        afficherErreur(
            error.message ||
            "Impossible de vérifier votre compte."
        );

    }

}


/* ============================================================
   ETAPE 2
   FINALISER LA VERIFICATION PREMIUM
============================================================ */

async function finaliserVerification(
    userId,
    localUser
) {


    afficherChargement(
        "Abonnement Premium confirmé. Finalisation de la vérification..."
    );


    /*
     * Animation visuelle pendant la validation.
     *
     * La vraie valeur est ensuite confirmée
     * par PostgreSQL via la réponse du serveur.
     */

    mettreAJourProgression(
        75
    );


    try {


        const response =
            await fetch(

                API_URL +
                "/api/users/" +
                encodeURIComponent(
                    userId
                ) +
                "/premium-verification",

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"

                    },

                    body:
                        JSON.stringify({})

                }

            );


        const data =
            await lireJSON(
                response
            );


        console.log(
            "[BMJ PREMIUM] FINALISATION :",
            data
        );


        if (!response.ok) {

            throw new Error(
                data.message ||
                "La vérification Premium n'a pas pu être finalisée."
            );

        }


        /*
         * Le serveur doit confirmer :
         *
         * premium_verification_progression = 100
         * premium_verification_completed = true
         */

        const progress =
            Number(
                data.premium_verification_progression
            );


        const completed =
            data.premium_verification_completed === true ||
            data.verification_premium_terminee === true ||
            data.verified === true;


        if (
            !completed ||
            !Number.isFinite(progress) ||
            progress < 100
        ) {

            throw new Error(
                "Le serveur n'a pas confirmé la fin de la vérification Premium."
            );

        }


        /*
         * ====================================================
         * 100% CONFIRME PAR LE SERVEUR
         * ====================================================
         */

        mettreAJourProgression(
            100
        );


        /*
         * Mise à jour du localStorage.
         */

        enregistrerUtilisateurLocal(
            localUser,
            data
        );


        afficherTermine();


    } catch (error) {

        console.error(
            "[BMJ PREMIUM] POST ERROR :",
            error
        );


        afficherErreur(
            error.message ||
            "Impossible de terminer la vérification Premium."
        );

    }

}


/* ============================================================
   UTILISATEUR NON PREMIUM
============================================================ */

function afficherNonPremium() {


    statusIcon.classList.remove(
        "success"
    );


    statusIcon.classList.add(
        "error"
    );


    statusIconElement.className =
        "fa-solid fa-lock";


    pageTitle.textContent =
        "Premium non actif";


    description.textContent =
        "Votre compte ne possède pas encore un abonnement Premium actif.";


    statusTitle.textContent =
        "Vérification en attente";


    statusText.textContent =
        "Activez votre abonnement Premium pour terminer cette étape.";


    loading.innerHTML =
        '<span class="error-message">' +
        "Redirection vers la page d'abonnement..." +
        "</span>";


    actionContainer.innerHTML =

        '<a ' +

        'href="certificat_marketing.html" ' +

        'class="button">' +

        '<i class="fa-solid fa-crown"></i>' +

        "Activer Premium" +

        "</a>";


    setTimeout(
        function () {

            window.location.href =
                "certificat_marketing.html";

        },
        2500
    );

}


/* ============================================================
   VERIFICATION TERMINEE
============================================================ */

function afficherTermine() {


    statusIcon.classList.remove(
        "error"
    );


    statusIcon.classList.add(
        "success"
    );


    statusIconElement.className =
        "fa-solid fa-circle-check";


    pageTitle.textContent =
        "Vérification terminée";


    description.textContent =
        "Votre abonnement Premium a été confirmé avec succès.";


    statusTitle.textContent =
        "Vérification Premium : Terminée";


    statusText.textContent =
        "Votre accès Premium est confirmé. Vous pouvez maintenant accéder à votre certificat.";


    mettreAJourProgression(
        100
    );


    loading.innerHTML =
        '<span class="success-message">' +

        '<i class="fa-solid fa-check"></i> ' +

        "Vérification terminée. Redirection..." +

        "</span>";


    actionContainer.innerHTML =

        '<a ' +

        'href="certeficat.html" ' +

        'class="button">' +

        '<i class="fa-solid fa-certificate"></i>' +

        "Accéder au certificat" +

        "</a>";


    setTimeout(
        function () {

            window.location.href =
                "certeficat.html";

        },
        1200
    );

}


/* ============================================================
   PROGRESSION VISUELLE
============================================================ */

function mettreAJourProgression(
    value
) {


    let progress =
        Number(
            value
        );


    if (
        !Number.isFinite(
            progress
        )
    ) {

        progress =
            50;

    }


    progress =
        Math.max(
            0,
            Math.min(
                100,
                progress
            )
        );


    progressBar.style.width =
        progress + "%";


    /*
     * On affiche uniquement un statut à l'utilisateur.
     *
     * La valeur numérique sert seulement à
     * l'animation visuelle de la barre.
     */

    if (
        progress >= 100
    ) {

        progressLabel.textContent =
            "Vérification terminée";

    } else {

        progressLabel.textContent =
            "Vérification en cours";

    }

}


/* ============================================================
   MESSAGE CHARGEMENT
============================================================ */

function afficherChargement(
    message
) {


    statusIcon.classList.remove(
        "success",
        "error"
    );


    statusIconElement.className =
        "fa-solid fa-shield-halved";


    pageTitle.textContent =
        "Vérification Premium";


    statusTitle.textContent =
        "Vérification en cours";


    statusText.textContent =
        message;


    loading.innerHTML =

        '<span class="loading-spinner"></span>' +

        "Veuillez patienter...";


    actionContainer.innerHTML =
        "";

}


/* ============================================================
   MESSAGE ERREUR
============================================================ */

function afficherErreur(
    message
) {


    statusIcon.classList.remove(
        "success"
    );


    statusIcon.classList.add(
        "error"
    );


    statusIconElement.className =
        "fa-solid fa-circle-exclamation";


    pageTitle.textContent =
        "Vérification impossible";


    description.textContent =
        "Une erreur est survenue pendant la vérification de votre compte.";


    statusTitle.textContent =
        "Erreur";


    statusText.textContent =
        "Votre abonnement n'a pas été modifié.";


    loading.innerHTML =

        '<div class="error-message">' +

        escapeHTML(
            message
        ) +

        "</div>";


    actionContainer.innerHTML =

        '<button ' +

        'type="button" ' +

        'class="button" ' +

        'onclick="location.reload()">' +

        '<i class="fa-solid fa-rotate-right"></i>' +

        "Réessayer" +

        "</button>";

}


/* ============================================================
   MISE A JOUR LOCALSTORAGE
============================================================ */

function enregistrerUtilisateurLocal(
    localUser,
    data
) {


    const serverUser =
        data?.user ||
        data?.utilisateur ||
        data?.data?.user ||
        data?.data;


    let updatedUser = {

        ...localUser

    };


    if (
        serverUser &&
        typeof serverUser === "object"
    ) {

        updatedUser = {

            ...updatedUser,

            ...serverUser

        };

    }


    /*
     * Statut Premium.
     */

    updatedUser.is_premium =
        true;


    updatedUser.premium =
        true;


    /*
     * Progression spécifique Premium.
     */

    updatedUser.premium_verification_progression =
        100;


    updatedUser.premium_progression =
        100;


    updatedUser.progression_premium =
        100;


    updatedUser.premium_verification_completed =
        true;


    updatedUser.verification_premium_terminee =
        true;


    updatedUser.premium_verification_status =
        "Terminé";


    localStorage.setItem(

        "bmj_current_user",

        JSON.stringify(
            updatedUser
        )

    );


    console.log(
        "[BMJ PREMIUM] LOCALSTORAGE MIS A JOUR :",
        updatedUser
    );

}


/* ============================================================
   LIRE JSON
============================================================ */

async function lireJSON(
    response
) {


    try {

        return await response.json();

    } catch (error) {

        return {};

    }

}


/* ============================================================
   SECURITE HTML
============================================================ */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}

</script>


<!-- =========================================================
     FONT AWESOME
========================================================== -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"
></script>


</body>

</html>
